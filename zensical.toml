# Strona dokumentacji (N-SHOW-16, Zensical): budowana z docs/ w trybie strict w CI (docs-site.yml); deploy na
# GitHub Pages dopiero po włączeniu Pages przez właściciela. Wersja narzędzia: docs/requirements-site.txt (hashe).
[project]
site_name = "Platform"
site_description = "The shared build, quality, version and frontend layer of a set of product repositories."
site_url = "https://dominiksienkiewicz.github.io/Platform/"
repo_url = "https://github.com/DominikSienkiewicz/Platform"
repo_name = "DominikSienkiewicz/Platform"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = "site"
exclude_docs = """
concepts/
requirements-site.txt
"""
nav = [
  { "Home" = "index.md" },
  { "Consuming" = "consuming.md" },
  { "Reference" = "reference.md" },
  { "Reusable workflows" = "reusable-workflows.md" },
  { "Gate codes" = "gates.md" },
  { "Versions" = "versions.md" },
  { "Compatibility" = "compatibility.md" },
  { "API contracts" = "api-contracts.md" },
  { "API client" = "api-client.md" },
  { "Security scanning" = "security-scanning.md" },
  { "Local development" = "local-development.md" },
  { "Agents" = [
    { "Rules for consumer agents" = "consumer-agents.md" },
    { "Agent profile" = "agent-profile.md" },
    { "Engineering with agents" = "engineering-with-agents.md" },
  ] },
  { "Runbooks" = "runbooks/README.md" },
  { "Decisions" = "adr/README.md" },
  { "Tour" = "tour.md" },
]

[project.theme]
language = "en"
features = ["content.code.copy", "navigation.footer", "navigation.indexes", "navigation.sections", "search.highlight"]
