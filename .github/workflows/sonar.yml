name: Sonar (reusable)

# DEPRECATED (Decyzja 14): żaden konsument nie woła tego workflowu — SkillSprintPlus i BookOfStyling usunęły
# swoje joby Sonar 2026-08-05, a Azimuth skanuje inline, w limicie 50 000 LOC SonarQube Cloud dla prywatnych
# projektów. Plik zostaje, żeby istniejące referencje dalej się rozwiązywały; nie adoptuj go. Zamiast tego
# uruchom task `sonar` w jobie backendu — seniordev.quality-conventions go konfiguruje.
#
# Reusable: skan SonarQube Cloud dla monorepo (backend Gradle + frontend npm).
# Wołane z cienkiego callera z jawnymi sekretami:
#   uses: DominikSienkiewicz/Platform/.github/workflows/sonar.yml@vX.Y.Z
#   secrets: { SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}, gpr_token: ${{ secrets.GPR_TOKEN }} }
#
# Oba joby są POMIJANE dopóki nie istnieje sekret SONAR_TOKEN (guard krokowy `if: env.SONAR_TOKEN != ''`),
# więc nigdy nie blokują CI zanim Sonar zostanie skonfigurowany. Backend: organizacja i plugin żyją
# w seniordev.quality-conventions, klucz projektu = property `sonarProjectKey` w gradle.properties
# (fallback DominikSienkiewicz_<rootProject.name>); repo NIE deklaruje id("org.sonarqube") ani sonar{}.
# Frontend: klucz w sonar-project.properties katalogu frontendu. Tu są tylko mechanika i wersje toolingu.
#
# Jednorazowy setup w SonarCloud: utwórz oba projekty, włącz tryb monorepo, WYŁĄCZ Automatic Analysis
# (Administration -> Analysis Method) — analiza automatyczna i CI-owa wykluczają się, a tylko skan z CI
# wgrywa raport pokrycia wymagany przez bramkę "Sonar way" (>= 80% na nowym kodzie).

on:
  workflow_call:
    inputs:
      java-version:
        # build-logic Platform (>=1.3.11) jest skompilowane do bytecode'u 25 -> samo Gradle MUSI jechać
        # na JDK 25 (nie wystarczy toolchain 25 z Foojay). Zrównane z backend-ci.yml (default "25").
        description: "JDK that runs Gradle for the backend scan."
        type: string
        default: "25"
      toolchain-java-version:
        description: "Toolchain JDK that seniordev.java-conventions compiles with; installed by setup-java, not Foojay."
        type: string
        default: "27"
      node-version:
        description: "Node.js version for the frontend tests and coverage."
        type: string
        default: "24"
    secrets:
      SONAR_TOKEN:
        description: "SonarQube Cloud token. Without it both jobs are skipped."
        required: false
      gpr_token:
        description: "Classic PAT with read:packages for Platform's packages. Without it the caller's automatic GITHUB_TOKEN is used."
        required: false

permissions:
  contents: read
  packages: read # Gradle/npm dociągają artefakty Platform z GitHub Packages

jobs:
  backend:
    name: Sonar backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: https://sonarcloud.io
    steps:
      - name: Warn that this workflow is deprecated
        run: echo "::warning title=Platform deprecation::[PLAT-DEPR-001] sonar.yml is deprecated (Decision 14); run the sonar task of seniordev.quality-conventions in your backend job instead."
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0 # pełna historia -> poprawne new-code & blame
      # Toolchain JDK z setup-java (API Adoptium), nie z Foojay: 2026-09-25 Foojay indeksował Temurin 27
      # dla linuksa tylko jako build Alpine (musl), resolver wybierał go na runnerze glibc i Gradle
      # odrzucał rozpakowane archiwum. Jawna ścieżka w installations.paths omija provisioning.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        id: toolchain-jdk
        with:
          distribution: temurin
          java-version: ${{ inputs.toolchain-java-version }}
      - name: Expose the toolchain JDK to Gradle
        env:
          TOOLCHAIN_JDK: ${{ steps.toolchain-jdk.outputs.path }}
        run: |
          mkdir -p "${GRADLE_USER_HOME:-$HOME/.gradle}"
          echo "org.gradle.java.installations.paths=$TOOLCHAIN_JDK" >> "${GRADLE_USER_HOME:-$HOME/.gradle}/gradle.properties"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }} # uruchamia Gradle; toolchain aplikacji z kroku toolchain-jdk
      # Testcontainers: Docker jest na runnerze. Testy -> JaCoCo XML -> skan.
      - name: Test + JaCoCo + Sonar
        if: ${{ env.SONAR_TOKEN != '' }}
        working-directory: backend
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          # PAT read:packages do prywatnych paczek Platform (fallback: automatyczny GITHUB_TOKEN).
          # Domyślny GITHUB_TOKEN jest scoped do repo-callera i NIE czyta paczek z osobnego repo Platform.
          GITHUB_TOKEN: ${{ secrets.gpr_token || secrets.GITHUB_TOKEN }}
        run: ./gradlew test jacocoTestReport sonar --no-daemon

  frontend:
    name: Sonar frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: https://sonarcloud.io
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        if: ${{ env.SONAR_TOKEN != '' }}
        working-directory: frontend
        env:
          # PAT read:packages do scoped @dominiksienkiewicz/* (fallback: automatyczny GITHUB_TOKEN).
          GITHUB_TOKEN: ${{ secrets.gpr_token || secrets.GITHUB_TOKEN }}
        # --ignore-scripts: spójnie z frontend-ci.yml — bez skryptów lifecycle zależności.
        run: npm ci --ignore-scripts
      - name: Test + coverage (lcov)
        if: ${{ env.SONAR_TOKEN != '' }}
        working-directory: frontend
        run: npm run test -- --coverage
      - name: SonarQube scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8.2.0
        with:
          projectBaseDir: frontend
