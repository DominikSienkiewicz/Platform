name: Release a merged dependency update

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read

jobs:
  release:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'renovate/') &&
      github.event.pull_request.user.type == 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app
        with:
          client-id: ${{ vars.DEPENDENCY_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDENCY_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event.pull_request.user.login == format('{0}[bot]', steps.app.outputs.app-slug)
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Tag the reviewed merge with the dependency App
        if: github.event.pull_request.user.login == format('{0}[bot]', steps.app.outputs.app-slug)
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          REVIEWED_HEAD: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if ! git cat-file -e "$REVIEWED_HEAD^{commit}" 2>/dev/null; then
            gh auth setup-git
            git fetch --no-tags origin "refs/pull/$PR/head"
          fi
          bash scripts/tag-dependency-release.sh "$MERGE_SHA" "$REVIEWED_HEAD"
