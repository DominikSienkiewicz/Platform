name: Publish Gradle artifacts

# Publikuje convention plugins (build-logic) + version catalog do GitHub Packages (Maven).
# Trigger: tag vX.Y.Z lub ręcznie.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [build-logic, catalog]
    defaults:
      run:
        working-directory: gradle/${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Publish ${{ matrix.project }}
        run: ./gradlew publish --no-daemon --stacktrace
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPR_OWNER: ${{ github.repository_owner }}
          GPR_REPO: ${{ github.event.repository.name }}
