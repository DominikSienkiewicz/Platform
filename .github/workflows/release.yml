name: Release (version tag)

# Świadome wydanie: push taga vX.Y.Z (albo ręczny workflow_dispatch) publikuje platformVersion
# z gradle/build-logic/gradle.properties — bez auto-bumpu i bez auto-prune:
#   - Maven: build-logic (+ markery pluginów), catalog, test-fixtures, security-starter,
#   - npm: każda paczka z frontend/packages/* bez "private": true.
# Procedura i idempotencja per rejestr: RELEASING.md. Konsumenci trzymają DOKŁADNE piny.
on:
  workflow_dispatch:
  push:
    # Tylko tagi wersji X.Y.Z (kropki wymagane) — ruchomy tag `v1` (reusable workflows) NIE może
    # triggerować wydania: dwa równoległe publish'e tej samej wersji to race (źródło partial
    # release 1.3.1). `v1` przesuwa job move-v1 dopiero po publikacji.
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Bramka wydania: version (tag == platformVersion) → verify (pełne CI na otagowanym commicie)
# + registry-build → gradle + npm (packages: write) → move-v1 + github-release (contents: write).
# Czerwony job zatrzymuje wszystko za nim: nic nie trafia do GitHub Packages, v1 zostaje na miejscu
# i nie powstaje GitHub Release.
jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - id: v
        run: |
          V=$(grep '^platformVersion=' gradle/build-logic/gradle.properties | cut -d= -f2 | tr -d ' ')
          # Bijekcja tag ↔ wersja: publikujemy wyłącznie z taga równego platformVersion, więc każda
          # wersja w GitHub Packages ma swój tag i odwrotnie. Dispatch z gałęzi kończy się tutaj.
          # >>> tag-version-bijection
          if [ "$GITHUB_REF" != "refs/tags/v$V" ]; then
            echo "::error::Release publikuje tylko z taga v$V (platformVersion), a uruchomiono go z $GITHUB_REF. Wydawaj przez ./release.sh."
            exit 1
          fi
          # <<< tag-version-bijection
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Wersja release: $V (z gradle.properties — jedno źródło: local == GitHub == pin)"

  verify:
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  # Rejestr shadcn budowany osobno, bez packages: write: narzędzie i jego zależności nie widzą
  # tokenu publikacji. Wynik nie jest publikowany — job jest wyłącznie bramką.
  registry-build:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.18.0
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      # --ignore-scripts: build rejestru nie potrzebuje skryptów lifecycle zależności (patrz ci.yml).
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build registry (shadcn)
        run: pnpm --filter @dominiksienkiewicz/ui build

  gradle:
    needs: [version, verify, registry-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Publish Maven (build-logic, catalog, test-fixtures, security-starter)
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPR_OWNER: ${{ github.repository_owner }}
          GPR_REPO: ${{ github.event.repository.name }}
          V: ${{ needs.version.outputs.version }}
        run: |
          set -uo pipefail
          # Idempotencja BEZ partial-release: pre-check przez GitHub API "czy wersja JUŻ jest".
          # - wersja istnieje  -> skip CAŁY moduł (re-run po sukcesie nic nie psuje)
          # - wersja nie istnieje -> publikuj; KAŻDY błąd = fatal (NIE połykamy 409!)
          # Dlaczego nie połykać 409: przy 409 na .pom Gradle przerywa moduł PRZED wgraniem .module
          # (Gradle Module Metadata). Efekt = artefakt bez wariantu version-catalog/plugin-marker,
          # czyli "No matching variant" u konsumenta (to zabiło platform-catalog:1.3.4).
          # Mapowanie modeł -> nazwa pakietu Maven używana przez version_exists = sygnał "publish DOKOŃCZONY".
          # build-logic publikuje 5 artefaktów: główny (pl.seniordeveloper.gradle.build-logic) PIERWSZY + 4 markery
          # pluginów. Sprawdzanie GŁÓWNEGO dawało fałszywe "done", gdy markery padły (partial → skip → markery nigdy
          # nie dojeżdżały; główny był na 1.5.1/1.5.2/1.5.3, marker nie). Kluczujemy build-logic po MARKERZE
          # settings-conventions (load-bearing dla konsumenta) — brak = republikuj / fail głośno, nie cichy skip.
          declare -A PKG=( [build-logic]="seniordev.settings-conventions.seniordev.settings-conventions.gradle.plugin" \
                           [catalog]="pl.seniordeveloper.platform-catalog" \
                           [test-fixtures]="pl.seniordeveloper.platform-test-fixtures" \
                           [security-starter]="pl.seniordeveloper.platform-security-starter" )
          version_exists() {
            curl -fsSL --proto '=https' --proto-redir '=https' \
              -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/users/$GPR_OWNER/packages/maven/$1/versions" 2>/dev/null \
              | python3 -c "import sys,json; print(any(v['name']=='$V' for v in json.load(sys.stdin)))" 2>/dev/null
          }
          for m in build-logic catalog test-fixtures security-starter; do
            if [ "$(version_exists "${PKG[$m]}")" = "True" ]; then
              echo "::notice::${PKG[$m]} $V już w registry — pomijam moduł $m (idempotentnie)"
              continue
            fi
            echo "== publish gradle/$m ($V) =="
            ( cd "gradle/$m" && chmod +x ./gradlew && ./gradlew --no-daemon -PplatformVersion="$V" publish )
            rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "::error::publish $m ($V) nie powiódł się (kod $rc). Jeśli to 409: wersja jest częściowo opublikowana — usuń $V z GitHub Packages albo wydaj wyższą wersję (nie re-publikuj po partialu)."
              exit 1
            fi
          done

  # Job z packages: write nie uruchamia żadnego builda — rejestr sprawdza registry-build.
  npm:
    needs: [version, verify, registry-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: frontend
    # Tylko NODE_AUTH_TOKEN: setup-node wpisuje go do .npmrc rejestru; GITHUB_TOKEN nic tu nie czytało.
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      V: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.18.0
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://npm.pkg.github.com"
          scope: "@dominiksienkiewicz"
      # --ignore-scripts: publikacja nie potrzebuje skryptów lifecycle zależności (patrz ci.yml).
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Ustaw wersję na wszystkich paczkach
        run: pnpm -r exec npm pkg set version="$V"
      # Idempotentnie, per-paczka (lustro logiki z joba gradle): wersja już opublikowana
      # (np. re-run po częściowym wydaniu) — pomijamy i publikujemy RESZTĘ. `pnpm -r publish`
      # wywala się na pierwszym konflikcie i zostawia partial release.
      # Detekcja "już istnieje": NAJPIERW pre-check `npm view` (pytamy registry, zamiast parsować
      # komunikaty błędów — registry zwraca różne warianty: "E409", "409 Conflict", "You cannot
      # publish over the previously published versions"), grep szeroki tylko jako fallback.
      - name: Publish (idempotentny)
        run: |
          set +e
          FAIL=0
          for d in packages/*/; do
            [ -f "$d/package.json" ] || continue
            NAME=$(node -p "require('./$d/package.json').name")
            PRIV=$(node -p "require('./$d/package.json').private === true")
            if [ "$PRIV" = "true" ]; then echo "== $NAME: private — pomijam =="; continue; fi
            if npm view "$NAME@$V" version >/dev/null 2>&1; then
              echo "::notice::$NAME@$V już w registry — pomijam (publish idempotentny)"
              continue
            fi
            echo "== publish $NAME@$V =="
            ( cd "$d" && pnpm publish --no-git-checks ) 2>&1 | tee /tmp/pub-npm.log
            rc=${PIPESTATUS[0]}
            if [ "$rc" -ne 0 ]; then
              if grep -qiE "E409|409 Conflict|cannot publish over" /tmp/pub-npm.log; then
                echo "::notice::$NAME@$V już opublikowane (konflikt wersji) — pomijam"
              else
                echo "::error::publish $NAME@$V nie powiódł się (kod $rc)"; FAIL=1
              fi
            fi
          done
          exit $FAIL

  # Ruchomy v1 (reusable workflows konsumentów) idzie za wydaniem dopiero po obu zielonych
  # publikacjach i tylko do przodu: re-run starszego taga go nie cofa, a v1 spoza historii
  # wydawanego commita zostaje na miejscu do decyzji człowieka. Do wygaszenia, gdy konsumenci
  # przejdą na referencje exact vX.Y.Z.
  move-v1:
    needs: [gradle, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Przesuń v1 do wydanego commita (tylko do przodu)
        run: |
          # >>> move-v1-forward
          set -euo pipefail
          target=$(git rev-parse --verify "${GITHUB_SHA}^{commit}")
          lease="refs/tags/v1:"
          if git ls-remote --exit-code --tags origin refs/tags/v1 >/dev/null; then
            git fetch --quiet --no-tags origin "+refs/tags/v1:refs/tags/v1"
            current=$(git rev-parse --verify "refs/tags/v1^{commit}")
            if [ "$current" = "$target" ]; then
              echo "::notice::v1 już wskazuje $target ($GITHUB_REF)"
              exit 0
            fi
            if git merge-base --is-ancestor "$target" "$current"; then
              echo "::notice::v1 ($current) jest nowszy niż $GITHUB_REF ($target) — nie cofam"
              exit 0
            fi
            if ! git merge-base --is-ancestor "$current" "$target"; then
              echo "::error::v1 ($current) nie leży w historii $GITHUB_REF ($target) — nie przesuwam"
              exit 1
            fi
            lease="refs/tags/v1:$(git rev-parse --verify refs/tags/v1)"
          fi
          git tag -f v1 "$target"
          git push --force-with-lease="$lease" origin refs/tags/v1
          echo "::notice::v1 → $target ($GITHUB_REF)"
          # <<< move-v1-forward

  # GitHub Release z sekcji CHANGELOG.md tej wersji — to samo źródło co annotated tag z release.sh
  # i notatki w platform-bump (docs/adr/0002-release-and-versioning-contract.md). Po obu publikacjach,
  # więc Release opisuje wersję, która naprawdę jest w rejestrach. Re-run nie tworzy duplikatu.
  github-release:
    needs: [version, gradle, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: GitHub Release z sekcji CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # >>> github-release-notes
          set -euo pipefail
          tag="v$VERSION"
          bash scripts/changelog-section.sh "$VERSION" CHANGELOG.md > notes.md
          previous=$(git describe --tags --abbrev=0 --match 'v*.*.*' "$tag^" 2>/dev/null || true)
          if [ -n "$previous" ]; then
            printf '\n**Full diff:** https://github.com/%s/compare/%s...%s\n' "$GITHUB_REPOSITORY" "$previous" "$tag" >> notes.md
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::GitHub Release $tag już istnieje"
          else
            gh release create "$tag" --title "Platform $VERSION" --notes-file notes.md --verify-tag
          fi
          # <<< github-release-notes

  # Brak auto-prune: przy deliberate versioning + exact pin konsumenta przycięcie mogłoby skasować
  # wersję, którą ktoś pinuje. Storage Packages jest współdzielony z Actions, ale przy tej skali
  # (KB–MB) to nieistotne. Sprzątanie = świadome, ręczne: workflow "Cleanup old package versions".
