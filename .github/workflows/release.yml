name: Release (version tag)

# Świadome wydanie: push taga vX.Y.Z (albo ręczny workflow_dispatch) publikuje platformVersion
# z gradle/build-logic/gradle.properties — bez auto-bumpu i bez auto-prune:
#   - Maven: moduły z gradle/maven-modules.txt (build-logic + markery pluginów, catalog, bom, test-fixtures, security-starter),
#   - npm: każda paczka z frontend/packages/* bez "private": true.
# Procedura i idempotencja per rejestr: RELEASING.md. Konsumenci trzymają DOKŁADNE piny.
on:
  workflow_dispatch:
  push:
    # Tylko tagi wersji X.Y.Z (kropki wymagane) — ruchomy tag `v1` (reusable workflows) NIE może
    # triggerować wydania: dwa równoległe publish'e tej samej wersji to race (źródło partial
    # release 1.3.1). `v1` przesuwa job move-v1 dopiero po publikacji.
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Bramka wydania: version (tag == platformVersion) → verify (pełne CI na otagowanym commicie)
# + registry-build → gradle + npm (packages: write) → move-v1 + github-release (contents: write).
# Czerwony job zatrzymuje wszystko za nim: nic nie trafia do GitHub Packages, v1 zostaje na miejscu
# i nie powstaje GitHub Release.
jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - id: v
        run: |
          V=$(grep '^platformVersion=' gradle/build-logic/gradle.properties | cut -d= -f2 | tr -d ' ')
          # Bijekcja tag ↔ wersja: publikujemy wyłącznie z taga równego platformVersion, więc każda
          # wersja w GitHub Packages ma swój tag i odwrotnie. Dispatch z gałęzi kończy się tutaj.
          # >>> tag-version-bijection
          if [ "$GITHUB_REF" != "refs/tags/v$V" ]; then
            echo "::error::Release must run from tag v$V, the platformVersion; it ran from $GITHUB_REF. Release with ./release.sh."
            exit 1
          fi
          # <<< tag-version-bijection
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Wersja release: $V (z gradle.properties — jedno źródło: local == GitHub == pin)"

  # packages: read dla backend-ci-smoke w ci.yml: wołany workflow nie dostanie więcej, niż przyzna ten job.
  verify:
    needs: version
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/ci.yml

  # Rejestr shadcn budowany osobno, bez packages: write: narzędzie i jego zależności nie widzą
  # tokenu publikacji. Wynik nie jest publikowany — job jest wyłącznie bramką.
  registry-build:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.18.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
      # --ignore-scripts: build rejestru nie potrzebuje skryptów lifecycle zależności (patrz ci.yml).
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build registry (shadcn)
        run: pnpm --filter @dominiksienkiewicz/ui build

  gradle:
    needs: [version, verify, registry-build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # id-token + attestations: atestacja provenance (SLSA) zbudowanych plików, weryfikowalna przez
    # `gh attestation verify` u konsumenta (docs/consuming.md, „Verifying provenance”).
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Publish Maven (gradle/maven-modules.txt)
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPR_OWNER: ${{ github.repository_owner }}
          GPR_REPO: ${{ github.event.repository.name }}
          V: ${{ needs.version.outputs.version }}
        run: |
          set -uo pipefail
          # Idempotencja BEZ partial-release: pre-check przez GitHub API "czy wersja JUŻ jest".
          # - wersja istnieje  -> skip CAŁY moduł (re-run po sukcesie nic nie psuje)
          # - wersja nie istnieje -> publikuj; KAŻDY błąd = fatal (NIE połykamy 409!)
          # Dlaczego nie połykać 409: przy 409 na .pom Gradle przerywa moduł PRZED wgraniem .module
          # (Gradle Module Metadata). Efekt = artefakt bez wariantu version-catalog/plugin-marker,
          # czyli "No matching variant" u konsumenta (to zabiło platform-catalog:1.3.4).
          # Mapowanie modeł -> nazwa pakietu Maven używana przez version_exists = sygnał "publish DOKOŃCZONY".
          # build-logic publikuje 7 artefaktów: główny (pl.seniordeveloper.gradle.build-logic) PIERWSZY + 6 markerów
          # pluginów. Sprawdzanie GŁÓWNEGO dawało fałszywe "done", gdy markery padły (partial → skip → markery nigdy
          # nie dojeżdżały; główny był na 1.5.1/1.5.2/1.5.3, marker nie). Kluczujemy build-logic po MARKERZE
          # settings-conventions (load-bearing dla konsumenta) — brak = republikuj / fail głośno, nie cichy skip.
          # Mapowanie i kolejność: gradle/maven-modules.txt (druga kolumna).
          declare -A PKG=()
          modules=()
          while read -r module package; do
            PKG[$module]=$package
            modules+=("$module")
          done < <(awk '!/^#/ && NF' gradle/maven-modules.txt)
          # Kod wyjścia zamiast parsowania wyjścia: 0 = wersja opublikowana. Brak pakietu (404) i każdy
          # błąd API = 1, czyli publikuj — jak wcześniej. Lista nazw najpierw do zmiennej: przy
          # `gh … | grep -q` z pipefail grep kończy po pierwszym trafieniu, gh dostaje SIGPIPE i
          # istniejąca wersja wyglądałaby na brak. Blok testuje templates/tests/release-version-exists.test.sh.
          # >>> version-exists
          version_exists() {
            local names
            names=$(GH_TOKEN="$GITHUB_TOKEN" gh api --paginate "/users/$GPR_OWNER/packages/maven/$1/versions" --jq '.[].name' 2>/dev/null) \
              || return 1
            grep -qxF "$V" <<<"$names"
          }
          # <<< version-exists
          # Data commita taga, nie czas buildu (N-REL-6): build-logic wpisuje ją do platform-release.properties, a jar
          # zostaje odtwarzalny. Pozostałe moduły tej właściwości nie czytają.
          release_date=$(git log -1 --format=%cs)
          for m in "${modules[@]}"; do
            if version_exists "${PKG[$m]}"; then
              echo "::notice::${PKG[$m]} $V już w registry — pomijam moduł $m (idempotentnie)"
              continue
            fi
            echo "== publish gradle/$m ($V) =="
            ( cd "gradle/$m" && chmod +x ./gradlew && ./gradlew --no-daemon -PplatformVersion="$V" -PplatformReleaseDate="$release_date" publish )
            rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "::error::publish $m ($V) nie powiódł się (kod $rc). Jeśli to 409: wersja jest częściowo opublikowana — usuń $V z GitHub Packages albo wydaj wyższą wersję (nie re-publikuj po partialu)."
              exit 1
            fi
          done
      # Te same pliki, które Gradle właśnie wgrał (jary z build/libs, wygenerowany TOML katalogu). Moduł pominięty
      # jako już opublikowany nie zostawia plików, więc re-run po sukcesie niczego nie atestuje drugi raz.
      - name: Attest the provenance of the published files
        if: hashFiles('gradle/*/build/libs/*.jar', 'gradle/catalog/build/version-catalog/*.toml') != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            gradle/*/build/libs/*.jar
            gradle/catalog/build/version-catalog/*.toml

  # Job z packages: write nie uruchamia żadnego builda — rejestr sprawdza registry-build.
  npm:
    needs: [version, verify, registry-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: frontend
    # Tylko NODE_AUTH_TOKEN: setup-node wpisuje go do .npmrc rejestru; GITHUB_TOKEN nic tu nie czytało.
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      V: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.18.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          registry-url: "https://npm.pkg.github.com"
          scope: "@dominiksienkiewicz"
      # --ignore-scripts: publikacja nie potrzebuje skryptów lifecycle zależności (patrz ci.yml).
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Ustaw wersję na wszystkich paczkach
        run: pnpm -r exec npm pkg set version="$V"
      # Okno wsparcia (N-REL-6): platform-versions-check liczy wiek kanonu od releasedAt. Data commita taga, nie czas
      # buildu, więc tarball zostaje odtwarzalny; plik w repo daty nie ma.
      - name: Stamp the release date into the frontend canon
        run: |
          set -euo pipefail
          node -e '
            const fs = require("node:fs");
            const file = "packages/versions/versions.json";
            const canon = JSON.parse(fs.readFileSync(file, "utf8"));
            canon.releasedAt = process.argv[1];
            fs.writeFileSync(file, JSON.stringify(canon, null, 2) + "\n");
          ' "$(git log -1 --format=%cs)"
      # Idempotentnie, per-paczka (lustro logiki z joba gradle): wersja już opublikowana
      # (np. re-run po częściowym wydaniu) — pomijamy i publikujemy RESZTĘ. `pnpm -r publish`
      # wywala się na pierwszym konflikcie i zostawia partial release.
      # Detekcja "już istnieje": NAJPIERW pre-check `npm view` (pytamy registry, zamiast parsować
      # komunikaty błędów — registry zwraca różne warianty: "E409", "409 Conflict", "You cannot
      # publish over the previously published versions"), grep szeroki tylko jako fallback.
      # Pakujemy, atestujemy i publikujemy TEN SAM tarball, więc digest w atestacji = digest w registry.
      # Bloki testuje templates/tests/release-attest.test.sh.
      - name: Pack the packages to publish
        run: |
          # >>> npm-pack
          set -euo pipefail
          mkdir -p dist
          for d in packages/*/; do
            [ -f "$d/package.json" ] || continue
            NAME=$(node -p "require('./$d/package.json').name")
            PRIV=$(node -p "require('./$d/package.json').private === true")
            if [ "$PRIV" = "true" ]; then echo "== $NAME: private — pomijam =="; continue; fi
            if npm view "$NAME@$V" version >/dev/null 2>&1; then
              echo "::notice::$NAME@$V już w registry — pomijam (publish idempotentny)"
              continue
            fi
            ( cd "$d" && pnpm pack --pack-destination ../../dist >/dev/null )
            echo "== packed $NAME@$V =="
          done
          # <<< npm-pack
      - name: Attest the provenance of the tarballs
        if: hashFiles('frontend/dist/*.tgz') != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: frontend/dist/*.tgz
      - name: Publish (idempotentny)
        run: |
          # >>> npm-publish
          set +e
          FAIL=0
          for tgz in dist/*.tgz; do
            [ -e "$tgz" ] || continue
            echo "== publish $tgz =="
            # `./` jest konieczne: npm czyta `dist/x.tgz` jako skrót GitHub `owner/repo` (git ls-remote).
            npm publish "./$tgz" 2>&1 | tee /tmp/pub-npm.log
            rc=${PIPESTATUS[0]}
            if [ "$rc" -ne 0 ]; then
              if grep -qiE "E409|409 Conflict|cannot publish over" /tmp/pub-npm.log; then
                echo "::notice::$tgz już opublikowane (konflikt wersji) — pomijam"
              else
                echo "::error::publish $tgz nie powiódł się (kod $rc)"; FAIL=1
              fi
            fi
          done
          exit $FAIL
          # <<< npm-publish

  # Bijekcja w drugą stronę: wydanie jest zielone dopiero, gdy KAŻDY publikowany artefakt ma $V w registry.
  # Joby publikujące pomijają wersje, które już istnieją (idempotencja), więc tylko tu widać, że komplet jest.
  # Pakiety Maven: główny artefakt build-logic i marker każdego pluginu (z nazw plików źródeł), catalog
  # i pakiet każdego modułu z gradle/maven-modules.txt; npm: każda paczka bez "private": true. Blok testuje
  # templates/tests/release-verify-published.test.sh.
  verify-published:
    needs: [version, gradle, npm]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    env:
      V: ${{ needs.version.outputs.version }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GPR_OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          registry-url: "https://npm.pkg.github.com"
          scope: "@dominiksienkiewicz"
      - name: Every published artifact carries the version
        run: |
          # >>> verify-published
          set -uo pipefail
          maven_has() {
            local names
            names=$(GH_TOKEN="$GITHUB_TOKEN" gh api --paginate "/users/$GPR_OWNER/packages/maven/$1/versions" --jq '.[].name' 2>/dev/null) \
              || return 1
            grep -qxF "$V" <<<"$names"
          }
          maven=(pl.seniordeveloper.gradle.build-logic pl.seniordeveloper.platform-catalog)
          if [ -f gradle/maven-modules.txt ]; then
            while read -r module package; do
              [ "$module" = build-logic ] || maven+=("$package")
            done < <(awk '!/^#/ && NF' gradle/maven-modules.txt)
          fi
          for source in gradle/build-logic/src/main/kotlin/seniordev.*.gradle.kts; do
            id="${source##*/}"; id="${id%.gradle.kts}"; id="${id%.settings}"
            maven+=("$id.$id.gradle.plugin")
          done
          missing=()
          for package in "${maven[@]}"; do maven_has "$package" || missing+=("maven $package"); done
          for manifest in frontend/packages/*/package.json; do
            [ "$(node -p "require('./$manifest').private === true")" = true ] && continue
            name=$(node -p "require('./$manifest').name")
            [ "$(npm view "$name@$V" version 2>/dev/null)" = "$V" ] || missing+=("npm $name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            for entry in "${missing[@]}"; do echo "::error::$entry has no version $V in GitHub Packages"; done
            exit 1
          fi
          echo "All ${#maven[@]} Maven packages and every public npm package carry $V."
          # <<< verify-published

  # Istnienie wersji (verify-published) nie znaczy, że da się ją skonsumować: 1.3.4 nie miał wariantu katalogu,
  # 1.5.1–1.5.3 markerów pluginów. Tu startery z templates/jvm i paczki npm rozwiązują wydanie z GitHub Packages
  # tak jak konsument — czysty GRADLE_USER_HOME, bez -PplatformRepository (scripts/verify-consumable.sh).
  verify-consumable:
    needs: [version, verify-published]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      V: ${{ needs.version.outputs.version }}
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          registry-url: "https://npm.pkg.github.com"
          scope: "@dominiksienkiewicz"
      - name: Resolve the release as a consumer
        run: bash scripts/verify-consumable.sh "$V"

  # Pliki GitHub Release do użycia bez poświadczeń (N-SHOW-9): GitHub Packages odrzuca anonimowe odczyty, więc
  # recenzent publicznej Platform nie zbudowałby nawet startera bez PAT-a. Repozytorium Maven czterech modułów,
  # tarballe npm z rejestru i SHA256SUMS, z atestacją (scripts/release-assets.sh; README „Try it without credentials”).
  release-assets:
    needs: [version, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: read
      id-token: write
      attestations: write
    env:
      V: ${{ needs.version.outputs.version }}
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          registry-url: "https://npm.pkg.github.com"
          scope: "@dominiksienkiewicz"
      - name: Build the credential-free assets
        run: bash scripts/release-assets.sh "$V" "$RUNNER_TEMP/assets"
      - name: Attest the provenance of the assets
        id: attest-assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/assets/*
      # Bundle Sigstore tej atestacji jako asset wydania: OpenSSF Scorecard (Signed-Releases) szuka podpisu wśród
      # assetów (*.sigstore.json), a `gh attestation verify <plik> --bundle <ten plik>` działa bez API atestacji.
      # Bundle nie wchodzi do SHA256SUMS: powstaje z sum assetów, więc to on je poświadcza.
      - name: Keep the attestation bundle with the assets
        env:
          BUNDLE: ${{ steps.attest-assets.outputs.bundle-path }}
        run: cp "$BUNDLE" "$RUNNER_TEMP/assets/platform-$V-assets.sigstore.json"
      - name: Attach the assets to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "v$V" "$RUNNER_TEMP"/assets/* --clobber

  # Dowód, że pakiet wystarcza: starter spring-app buduje się z samego zipa, z czystym GRADLE_USER_HOME i bez
  # GITHUB_TOKEN. Brak artefaktu w pakiecie skończyłby się anonimowym 401 z GitHub Packages.
  verify-bundle:
    needs: [version, release-assets]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      V: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"
      - name: Download and verify the bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download "v$V" --dir "$RUNNER_TEMP/bundle" --pattern "platform-maven-repo-$V.zip" --pattern SHA256SUMS
          (cd "$RUNNER_TEMP/bundle" && sha256sum --check --ignore-missing SHA256SUMS)
          unzip -q "$RUNNER_TEMP/bundle/platform-maven-repo-$V.zip" -d "$RUNNER_TEMP/bundle"
      - name: Build the spring-app starter from the bundle alone
        run: |
          app="$RUNNER_TEMP/spring-app"
          cp -R templates/jvm/spring-app "$app"
          cp templates/jvm/java-library/gradlew "$app/gradlew"
          cp -R templates/jvm/java-library/gradle "$app/gradle"
          sed -i "s/^platformVersion=.*/platformVersion=$V/" "$app/gradle.properties"
          cd "$app"
          env -u GITHUB_TOKEN -u GITHUB_ACTOR GRADLE_USER_HOME="$RUNNER_TEMP/clean-gradle-home" \
            ./gradlew --no-daemon assemble -PplatformRepository="file://$RUNNER_TEMP/bundle/platform-maven-repo"

  # Ruchomy v1 (reusable workflows konsumentów) idzie za wydaniem dopiero po obu zielonych
  # publikacjach i tylko do przodu: re-run starszego taga go nie cofa, a v1 spoza historii
  # wydawanego commita zostaje na miejscu do decyzji człowieka. Do wygaszenia, gdy konsumenci
  # przejdą na referencje exact vX.Y.Z.
  move-v1:
    needs: [gradle, npm]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Przesuń v1 do wydanego commita (tylko do przodu)
        run: |
          # >>> move-v1-forward
          set -euo pipefail
          target=$(git rev-parse --verify "${GITHUB_SHA}^{commit}")
          lease="refs/tags/v1:"
          if git ls-remote --exit-code --tags origin refs/tags/v1 >/dev/null; then
            git fetch --quiet --no-tags origin "+refs/tags/v1:refs/tags/v1"
            current=$(git rev-parse --verify "refs/tags/v1^{commit}")
            if [ "$current" = "$target" ]; then
              echo "::notice::v1 już wskazuje $target ($GITHUB_REF)"
              exit 0
            fi
            if git merge-base --is-ancestor "$target" "$current"; then
              echo "::notice::v1 ($current) jest nowszy niż $GITHUB_REF ($target) — nie cofam"
              exit 0
            fi
            if ! git merge-base --is-ancestor "$current" "$target"; then
              echo "::error::v1 ($current) nie leży w historii $GITHUB_REF ($target) — nie przesuwam"
              exit 1
            fi
            lease="refs/tags/v1:$(git rev-parse --verify refs/tags/v1)"
          fi
          git tag -f v1 "$target"
          git push --force-with-lease="$lease" origin refs/tags/v1
          echo "::notice::v1 → $target ($GITHUB_REF)"
          # <<< move-v1-forward

  # GitHub Release z sekcji CHANGELOG.md tej wersji — to samo źródło co annotated tag z release.sh
  # i notatki w platform-bump (docs/adr/0002-release-and-versioning-contract.md). Po obu publikacjach,
  # więc Release opisuje wersję, która naprawdę jest w rejestrach. Re-run nie tworzy duplikatu.
  github-release:
    needs: [version, gradle, npm]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: GitHub Release z sekcji CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # >>> github-release-notes
          set -euo pipefail
          tag="v$VERSION"
          bash scripts/changelog-section.sh "$VERSION" CHANGELOG.md > notes.md
          previous=$(git describe --tags --abbrev=0 --match 'v*.*.*' "$tag^" 2>/dev/null || true)
          if [ -n "$previous" ]; then
            printf '\n**Full diff:** https://github.com/%s/compare/%s...%s\n' "$GITHUB_REPOSITORY" "$previous" "$tag" >> notes.md
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::GitHub Release $tag już istnieje"
          else
            gh release create "$tag" --title "Platform $VERSION" --notes-file notes.md --verify-tag
          fi
          # <<< github-release-notes

  # Publiczne repo przykładowe (N-DX-3): po każdym wydaniu platform-example powstaje od nowa z kanonu wydania
  # (scripts/render-example.sh). Włącza je sekret PLATFORM_EXAMPLE_TOKEN — fine-grained PAT z contents: write
  # tylko na <owner>/platform-example; bez niego job kończy się notką. Repo zakłada właściciel.
  example:
    needs: [version, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    env:
      V: ${{ needs.version.outputs.version }}
      OWNER: ${{ github.repository_owner }}
    steps:
      # Sekret nie wejdzie do if:, a w env: joba widziałby go każdy krok, także npm w renderze. Pierwszy krok
      # zamienia jego obecność na wynik present=true|false (nigdy wartość); PAT dostaje tylko krok z clone/push.
      - name: Check for the example token
        id: example-token
        env:
          EXAMPLE_TOKEN: ${{ secrets.PLATFORM_EXAMPLE_TOKEN }}
        run: |
          if [ -n "$EXAMPLE_TOKEN" ]; then present=true; else present=false; fi
          echo "present=$present" >> "$GITHUB_OUTPUT"
      - name: Skip without the example token
        if: ${{ steps.example-token.outputs.present != 'true' }}
        run: echo "::notice::PLATFORM_EXAMPLE_TOKEN is not set, so platform-example is not regenerated."
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: ${{ steps.example-token.outputs.present == 'true' }}
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: ${{ steps.example-token.outputs.present == 'true' }}
        with:
          node-version: "24"
          registry-url: "https://npm.pkg.github.com"
          scope: "@dominiksienkiewicz"
      # npm biegnie w wygenerowanym frontend/, którego .npmrc (templates/npmrc) czyta ${GITHUB_TOKEN} i wygrywa
      # z plikiem setup-node (${NODE_AUTH_TOKEN}); bez GITHUB_TOKEN npm wysłałby dosłowny placeholder i dostał 401.
      # Odczyt paczek = GITHUB_TOKEN workflowu z packages: read; PLATFORM_EXAMPLE_TOKEN służy tylko do pusha niżej.
      # Pilnuje templates/tests/release-example-npm-auth.test.sh.
      - name: Render platform-example from the release
        if: ${{ steps.example-token.outputs.present == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/render-example.sh "$V" "$RUNNER_TEMP/example"
      - name: Replace the contents of platform-example
        if: ${{ steps.example-token.outputs.present == 'true' }}
        env:
          EXAMPLE_TOKEN: ${{ secrets.PLATFORM_EXAMPLE_TOKEN }}
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/platform-example"
          git clone --quiet --depth 1 "https://x-access-token:${EXAMPLE_TOKEN}@github.com/${OWNER}/platform-example.git" "$target"
          find "$target" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "$RUNNER_TEMP/example/." "$target/"
          cd "$target"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "::notice::platform-example already matches Platform v$V"
            exit 0
          fi
          git commit --quiet -m "chore: regenerate from Platform v$V"
          git push --quiet origin HEAD

  # Brak auto-prune: przy deliberate versioning + exact pin konsumenta przycięcie mogłoby skasować
  # wersję, którą ktoś pinuje. Storage Packages jest współdzielony z Actions, ale przy tej skali
  # (KB–MB) to nieistotne. Sprzątanie = świadome, ręczne: workflow "Cleanup old package versions".
