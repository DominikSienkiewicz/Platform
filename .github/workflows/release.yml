name: Release (auto-version on push)

# Na każdy push do main, który zmienia PLATFORMĘ (gradle/** lub frontend/packages/**):
#   1) wylicz wersję 1.0.<run_number> (major.minor z gradle.properties, patch = numer runu — zawsze unikalny),
#   2) opublikuj artefakty Maven (build-logic, catalog, test-fixtures) i npm (5 paczek),
#   3) przytnij do 3 najnowszych wersji każdego pakietu.
# Konsumenci trzymają DOKŁADNE piny (powtarzalność); Renovate podbija je do najnowszej.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]   # wydanie = świadomy tag (wersja z gradle.properties), nie każdy push

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          V=$(grep '^platformVersion=' gradle/build-logic/gradle.properties | cut -d= -f2 | tr -d ' ')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Wersja release: $V (z gradle.properties — jedno źródło: local == GitHub == pin)"

  gradle:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Publish Maven (build-logic, catalog, test-fixtures)
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPR_OWNER: ${{ github.repository_owner }}
          GPR_REPO: ${{ github.event.repository.name }}
          V: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          for m in build-logic catalog test-fixtures; do
            ( cd "gradle/$m" && chmod +x ./gradlew && ./gradlew --no-daemon -PplatformVersion="$V" publish )
          done

  npm:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      V: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://npm.pkg.github.com"
          scope: "@dominiksienkiewicz"
      - run: pnpm install --no-frozen-lockfile
      - name: Ustaw wersję na wszystkich paczkach
        run: pnpm -r exec npm pkg set version="$V"
      - name: Build registry (shadcn)
        run: pnpm --filter @dominiksienkiewicz/ui build || echo "registry build skipped"
      - name: Publish
        run: pnpm -r publish --no-git-checks

  prune:
    needs: [gradle, npm]
    runs-on: ubuntu-latest
    steps:
      - name: Keep last 3 per package
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_ADMIN_TOKEN }}
          KEEP: "3"
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::Brak PACKAGES_ADMIN_TOKEN — pomijam pruning (zrobi to scheduled cleanup)."
            exit 0
          fi
          PLATFORM_RE='^(pl\.seniordeveloper|seniordev\.|@dominiksienkiewicz/)'
          for type in maven npm; do
            gh api --paginate "/user/packages?package_type=$type" --jq '.[].name' \
              | grep -E "$PLATFORM_RE" || continue
            gh api --paginate "/user/packages?package_type=$type" --jq '.[].name' \
              | grep -E "$PLATFORM_RE" | while read -r pkg; do
                enc=$(printf '%s' "$pkg" | jq -sRr @uri)
                to_delete=$(gh api --paginate "/user/packages/$type/$enc/versions" --jq '.[]' \
                  | jq -s --argjson keep "$KEEP" 'sort_by(.created_at) | reverse | .[$keep:] | .[].id')
                for id in $to_delete; do
                  echo "usuwam $type/$pkg id=$id"
                  gh api --method DELETE "/user/packages/$type/$enc/versions/$id"
                done
              done
          done
