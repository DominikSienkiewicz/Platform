name: Release (auto-version on push)

# Na każdy push do main, który zmienia PLATFORMĘ (gradle/** lub frontend/packages/**):
#   1) wylicz wersję 1.0.<run_number> (major.minor z gradle.properties, patch = numer runu — zawsze unikalny),
#   2) opublikuj artefakty Maven (build-logic, catalog, test-fixtures) i npm (5 paczek),
#   3) przytnij do 3 najnowszych wersji każdego pakietu.
# Konsumenci trzymają DOKŁADNE piny (powtarzalność); Renovate podbija je do najnowszej.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]   # wydanie = świadomy tag (wersja z gradle.properties), nie każdy push

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          V=$(grep '^platformVersion=' gradle/build-logic/gradle.properties | cut -d= -f2 | tr -d ' ')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Wersja release: $V (z gradle.properties — jedno źródło: local == GitHub == pin)"

  gradle:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Publish Maven (build-logic, catalog, test-fixtures)
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPR_OWNER: ${{ github.repository_owner }}
          GPR_REPO: ${{ github.event.repository.name }}
          V: ${{ needs.version.outputs.version }}
        run: |
          set +e   # nie przerywaj na błędzie publish — sami obsługujemy 409 (idempotencja)
          for m in build-logic catalog test-fixtures; do
            echo "== publish gradle/$m ($V) =="
            ( cd "gradle/$m" && chmod +x ./gradlew && ./gradlew --no-daemon -PplatformVersion="$V" publish ) 2>&1 | tee "/tmp/pub-$m.log"
            rc=${PIPESTATUS[0]}
            if [ "$rc" -ne 0 ]; then
              if grep -q "status code 409" "/tmp/pub-$m.log"; then
                echo "::notice::$m $V już opublikowane (409) — pomijam (publish idempotentny)"
              else
                echo "::error::publish $m nie powiódł się (kod $rc)"; exit 1
              fi
            fi
          done

  npm:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      V: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://npm.pkg.github.com"
          scope: "@dominiksienkiewicz"
      - run: pnpm install --no-frozen-lockfile
      - name: Ustaw wersję na wszystkich paczkach
        run: pnpm -r exec npm pkg set version="$V"
      - name: Build registry (shadcn)
        run: pnpm --filter @dominiksienkiewicz/ui build || echo "registry build skipped"
      # Idempotentnie, per-paczka (lustro logiki z joba gradle): 409 = wersja już opublikowana
      # (np. re-run po częściowym wydaniu) — pomijamy i publikujemy RESZTĘ. `pnpm -r publish`
      # wywala się na pierwszym 409 i zostawia partial release.
      - name: Publish (idempotentny)
        run: |
          set +e
          FAIL=0
          for d in packages/*/; do
            [ -f "$d/package.json" ] || continue
            NAME=$(node -p "require('./$d/package.json').name")
            PRIV=$(node -p "require('./$d/package.json').private === true")
            if [ "$PRIV" = "true" ]; then echo "== $NAME: private — pomijam =="; continue; fi
            echo "== publish $NAME@$V =="
            ( cd "$d" && pnpm publish --no-git-checks ) 2>&1 | tee /tmp/pub-npm.log
            rc=${PIPESTATUS[0]}
            if [ "$rc" -ne 0 ]; then
              if grep -qE "E409|409 Conflict|Cannot publish over existing version" /tmp/pub-npm.log; then
                echo "::notice::$NAME@$V już opublikowane (409) — pomijam (publish idempotentny)"
              else
                echo "::error::publish $NAME@$V nie powiódł się (kod $rc)"; FAIL=1
              fi
            fi
          done
          exit $FAIL

  # Brak auto-prune: przy deliberate versioning + exact pin konsumenta przycięcie mogłoby skasować
  # wersję, którą ktoś pinuje. Storage Packages jest współdzielony z Actions, ale przy tej skali
  # (KB–MB) to nieistotne. Sprzątanie = świadome, ręczne: workflow "Cleanup old package versions".
