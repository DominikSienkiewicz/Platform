name: Backend CI (reusable)

# Reusable workflow dla backendów Spring/Gradle. Kontrakt callera (uprawnienia, sekrety, snippet):
# docs/reusable-workflows.md. Wołany z jawnym sekretem, nie `inherit`:
#   jobs: { backend: { uses: DominikSienkiewicz/Platform/.github/workflows/backend-ci.yml@vX.Y.Z,
#                      secrets: { gpr_token: "${{ secrets.GPR_TOKEN }}" } } }
on:
  workflow_call:
    inputs:
      timeout-minutes:
        description: "Minutes before the job is cancelled; GitHub's default is 360. Raise it for a slower build."
        type: number
        default: 30
      working-directory:
        description: "Directory of the Gradle build, relative to the repository root (`.` for the templates/jvm layout)."
        type: string
        default: backend
      java-version:
        description: "JDK that runs Gradle. Platform builds and tests its plugins with Gradle on Java 27 (ADR-0034), the only JDK it supports for Gradle."
        type: string
        default: "27"
      toolchain-java-version:
        description: "Toolchain JDK that seniordev.java-conventions compiles with; installed by setup-java, not Foojay."
        type: string
        default: "27"
      gradle-task:
        description: "Gradle task arguments as one line, separated by whitespace; passed literally, without shell parsing. The step sets PLATFORM_TEST_RETRY=detect, so a flaky test is retried once and still fails the build; -Pplatform.test.retry=off here turns that off."
        type: string
        default: "build"
      verify-provenance:
        description: "Verify the artifact attestation of every Platform jar the build resolved (pl.seniordeveloper in the Gradle cache) against Platform's release.yml; Platform 1.6.0 and newer attest their jars."
        type: boolean
        default: false
      lint-task:
        description: "Optional Gradle task arguments run as a first step before gradle-task, such as `lint` from seniordev.java-conventions, so style failures arrive before the tests; empty skips the step."
        type: string
        default: ""
      red-proof:
        description: "On a pull_request event, run a red-proof job: every fix: commit of the pull request must add or change a test class, and those classes must fail against the production code (src/main) of the commit's parent. Needs the pull request's history, so the job checks out with full depth."
        type: boolean
        default: false
      red-proof-tasks:
        description: "Gradle test tasks the red-proof job runs, separated by whitespace, each with --tests for every test class of the fix: commit, such as `test integrationTest`."
        type: string
        default: "test"
    secrets:
      gpr_token:
        description: "Classic PAT with read:packages for Platform's GitHub Packages. Without it the caller's automatic GITHUB_TOKEN is used, which needs packages: read and access to Platform's packages."
        required: false

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Build & test (JDK ${{ inputs.java-version }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Toolchain JDK z setup-java (API Adoptium), nie z Foojay: 2026-09-25 Foojay indeksował Temurin 27
      # dla linuksa tylko jako build Alpine (musl), resolver wybierał go na runnerze glibc i Gradle
      # odrzucał rozpakowane archiwum. Jawna ścieżka w installations.paths omija provisioning.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        id: toolchain-jdk
        with:
          distribution: temurin
          java-version: ${{ inputs.toolchain-java-version }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Expose the toolchain JDK to Gradle
        env:
          TOOLCHAIN_JDK: ${{ steps.toolchain-jdk.outputs.path }}
        run: |
          mkdir -p "${GRADLE_USER_HOME:-$HOME/.gradle}"
          echo "org.gradle.java.installations.paths=$TOOLCHAIN_JDK" >> "${GRADLE_USER_HOME:-$HOME/.gradle}/gradle.properties"

      # GITHUB_ACTOR + GITHUB_TOKEN włączają w settings.gradle.kts repo GitHub Packages.
      # Lokalnie konsument może dołożyć jawne -PplatformRepository (ADR-0003); tu działa GitHub Packages.
      # Wyjście Gradle także do pliku: sekcję „What went wrong” (bramki Platform, kompilacja) powtarza digest niżej.
      # pipefail jest konieczny: domyślna powłoka kroku to `bash -e` bez niego, a wtedy tee ukryłby porażkę Gradle.
      # Opcjonalny szybki krok: formatter i lintery przed testami, więc porażka stylu przychodzi po minucie, nie po suite.
      - name: ./gradlew ${{ inputs.lint-task }}
        if: ${{ inputs.lint-task != '' }}
        run: |
          set -o pipefail
          read -r -a lint_tasks <<< "$LINT_TASK"
          ./gradlew "${lint_tasks[@]}" --no-daemon --stacktrace 2>&1 | tee "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/gradle-output.log"
        env:
          LINT_TASK: ${{ inputs.lint-task }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.gpr_token || secrets.GITHUB_TOKEN }}

      - name: ./gradlew ${{ inputs.gradle-task }}
        run: |
          set -o pipefail
          read -r -a gradle_tasks <<< "$GRADLE_TASK"
          ./gradlew "${gradle_tasks[@]}" --no-daemon --stacktrace 2>&1 | tee "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/gradle-output.log"
        env:
          GRADLE_TASK: ${{ inputs.gradle-task }}
          # Wykrywanie niestabilnych testów (N-REL-13); -Pplatform.test.retry w gradle-task wygrywa ze zmienną.
          PLATFORM_TEST_RETRY: detect
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.gpr_token || secrets.GITHUB_TOKEN }}

      # Proweniencja (N-REL-16): jary Platform z cache Gradle'a muszą mieć atestację release.yml Platform, czyli
      # pochodzić z jego wydania, nie z podmienionego rejestru. Blok testuje templates/tests/backend-ci-provenance.test.sh.
      - name: Verify the provenance of the Platform artifacts
        if: ${{ inputs.verify-provenance }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # >>> verify-provenance
          set -euo pipefail
          cache="${GRADLE_USER_HOME:-$HOME/.gradle}/caches/modules-2/files-2.1"
          jars=()
          while IFS= read -r jar; do jars+=("$jar"); done < <(find "$cache" -path '*/pl.seniordeveloper*' -name '*.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' 2>/dev/null | sort)
          if [ "${#jars[@]}" -eq 0 ]; then
            echo "::error title=PLAT-PROV-001::[PLAT-PROV-001] No Platform jar in the Gradle cache, so there is nothing to verify; did the build resolve Platform?"
            exit 1
          fi
          failed=0
          for jar in "${jars[@]}"; do
            if gh attestation verify "$jar" --repo DominikSienkiewicz/Platform \
              --signer-workflow DominikSienkiewicz/Platform/.github/workflows/release.yml > /dev/null 2>&1; then
              echo "verified $(basename "$jar")"
            else
              echo "::error title=PLAT-PROV-001::[PLAT-PROV-001] $(basename "$jar") carries no attestation from Platform's release.yml"
              failed=1
            fi
          done
          exit "$failed"
          # <<< verify-provenance

      # Raporty WSZYSTKICH modułów (globy), nie tylko roota: konsument wielomodułowy nie musi ich przenosić.
      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-reports-${{ github.run_id }}
          path: |
            ${{ inputs.working-directory }}/**/build/reports/tests/
            ${{ inputs.working-directory }}/**/build/test-results/
            ${{ inputs.working-directory }}/**/build/reports/checkstyle/
          if-no-files-found: ignore
          retention-days: 7

      # Zdrowie testów (N-REL-13), także na zielonym buildzie: testy, które przeszły dopiero po powtórzeniu
      # (PLATFORM_TEST_RETRY=detect), wynik quarantineTest, gdy wołający go uruchomił, i terminy kwarantanny
      # z platformQuarantineCheck. Tylko python3 z runnera; blok testuje templates/tests/ci-test-health.test.sh.
      - name: Summarise flaky and quarantined tests
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY'
          # >>> test-health
          import glob, os
          import xml.etree.ElementTree as ET

          flaky, quarantined, deadlines = [], [], []
          for report in sorted(glob.glob("**/build/test-results/**/*.xml", recursive=True)):
              task = report.split("/test-results/", 1)[1].split("/", 1)[0]
              runs = {}
              for case in ET.parse(report).getroot().iter("testcase"):
                  failed = case.find("failure") is not None or case.find("error") is not None
                  runs.setdefault(f"{case.get('classname')}.{case.get('name')}", []).append(failed)
              for test, failures in runs.items():
                  if task == "quarantineTest":
                      quarantined.append((test, "failed" if failures[-1] else "passed"))
                  elif len(failures) > 1 and failures[0] and not failures[-1]:
                      flaky.append((test, task))
          for report in sorted(glob.glob("**/build/reports/platform/quarantine.txt", recursive=True)):
              module = report.split("/build/", 1)[0]
              for line in open(report, encoding="utf-8"):
                  if line.strip():
                      source, issue, until = (line.split() + ["-", "-"])[:3]
                      deadlines.append((module, source, issue, until))

          for test, task in flaky:
              print(f"::warning title=Flaky test::{test} failed, then passed on retry in {task}")
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary and (flaky or quarantined or deadlines):
              with open(summary, "a", encoding="utf-8") as out:
                  out.write("## Test health\n\n")
                  if flaky:
                      out.write("Passed only on retry, so the build is red (`failOnPassedAfterRetry`):\n\n| Test | Task |\n|---|---|\n")
                      out.writelines(f"| `{test}` | `{task}` |\n" for test, task in flaky)
                  if quarantined:
                      out.write("\n`quarantineTest`, which never fails the build:\n\n| Test | Result |\n|---|---|\n")
                      out.writelines(f"| `{test}` | {result} |\n" for test, result in quarantined)
                  if deadlines:
                      out.write("\nIn quarantine:\n\n| Module | Source | Issue | Until |\n|---|---|---|---|\n")
                      out.writelines(f"| `{module}` | `{source}` | {issue} | {until} |\n" for module, source, issue, until in deadlines)
          # <<< test-health
          PY

      # Diagramy i kanwy modułów z AbstractModulithDocumentationTest (test-fixtures), gdy konsument go używa.
      - name: Upload Spring Modulith documentation
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: module-docs-${{ github.run_id }}
          path: ${{ inputs.working-directory }}/**/build/spring-modulith-docs/
          if-no-files-found: ignore
          retention-days: 7

      # Zwięzły obraz porażki bez pobierania artefaktu (widać go w `gh run view`): nieudane testy i naruszenia
      # Checkstyle ze wszystkich modułów jako adnotacje (z limitem poniżej progu GitHuba) i tabela w podsumowaniu
      # joba, plus sekcja „What went wrong” Gradle. Tylko python3 z runnera; blok testuje templates/tests/ci-digest.test.sh.
      - name: Summarise the failures
        if: ${{ failure() }}
        env:
          GRADLE_OUTPUT: ${{ runner.temp }}/gradle-output.log
        run: |
          python3 - <<'PY'
          # >>> ci-digest
          import glob, os, re
          import xml.etree.ElementTree as ET

          LIMIT = 10
          workspace = os.environ.get("GITHUB_WORKSPACE", os.getcwd())
          rows, annotations = [], []

          def relative(path):
              return os.path.relpath(os.path.realpath(path), os.path.realpath(workspace))

          def first_line(text):
              return (text or "").strip().splitlines()[0] if (text or "").strip() else ""

          def escape(text):
              return text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          def source_of(classname, trace):
              simple = classname.split(".")[-1].split("$")[0]
              stem = classname.split("$")[0].replace(".", "/")
              for path in glob.glob(f"**/src/*/*/{stem}.*", recursive=True):
                  line = re.search(rf"\({re.escape(simple)}\.\w+:(\d+)\)", trace or "")
                  return relative(path), line.group(1) if line else None
              return None, None

          for report in sorted(glob.glob("**/build/test-results/**/*.xml", recursive=True)):
              for case in ET.parse(report).getroot().iter("testcase"):
                  problem = case.find("failure") if case.find("failure") is not None else case.find("error")
                  if problem is None:
                      continue
                  test = f"{case.get('classname')}.{case.get('name')}"
                  message = first_line(problem.get("message")) or first_line(problem.text)
                  path, line = source_of(case.get("classname", ""), problem.text)
                  where = f"{path}:{line}" if path and line else path or relative(report)
                  rows.append((test, message, where))
                  annotations.append((path, line, f"Test failed: {test}", message))

          for report in sorted(glob.glob("**/build/reports/checkstyle/*.xml", recursive=True)):
              for file in ET.parse(report).getroot().iter("file"):
                  for error in file.iter("error"):
                      path, line = relative(file.get("name")), error.get("line")
                      rule = (error.get("source") or "").split(".")[-1].removesuffix("Check")
                      rows.append((f"Checkstyle {rule}", error.get("message", ""), f"{path}:{line}"))
                      annotations.append((path, line, f"Checkstyle {rule}", error.get("message", "")))

          gradle_output = os.environ.get("GRADLE_OUTPUT", "")
          wrong = []
          if os.path.isfile(gradle_output):
              text = open(gradle_output, encoding="utf-8", errors="replace").read()
              for block in re.findall(r"\* What went wrong:\n(.*?)(?:\n\* Try:|\Z)", text, re.S):
                  wrong.append(block.strip())

          # Kody bramek (N-SHOW-8) dla porażek Gradle'a, które nie drukują własnego kodu; na początek listy, poza limitem.
          GATES = [("Dependency verification failed", "PLAT-VER-001"), ("Rule violated for bundle", "PLAT-COV-003")]
          coded = [("", "", code, f"[{code}] {block.splitlines()[0]}") for block in wrong for needle, code in GATES if needle in block]
          annotations = coded + annotations

          for path, line, title, message in annotations[:LIMIT + len(coded)]:
              location = f"file={path}," if path else ""
              location += f"line={line}," if path and line else ""
              print(f"::error {location}title={escape(title)}::{escape(message)}")
          if len(annotations) > LIMIT + len(coded):
              print(f"::error title=More failures::{len(annotations) - LIMIT - len(coded)} more; see the job summary and the test reports artifact")

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as out:
                  out.write(f"## Backend CI failures\n\n")
                  if rows:
                      out.write("| Failure | Message | Where |\n|---|---|---|\n")
                      for test, message, where in rows:
                          cell = message.replace("|", "\\|")
                          out.write(f"| `{test}` | {cell} | `{where}` |\n")
                  for block in wrong:
                      out.write(f"\n**What went wrong**\n\n```\n{block}\n```\n")
                  if not rows and not wrong:
                      out.write("No test or Checkstyle report and no Gradle failure description; read the step log.\n")
          # <<< ci-digest
          PY

  # Dowód czerwieni (TDD): commit `fix:` musi nieść test, który pada na kodzie produkcyjnym rodzica. Testy z commita,
  # `src/main` z rodzica; gałąź jest zielona w każdym commicie, więc czerwień widać tylko tak. Blok testuje
  # templates/tests/backend-ci-red-proof.test.sh.
  red-proof:
    name: Red-proof of fix commits
    if: ${{ inputs.red-proof && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        id: toolchain-jdk
        with:
          distribution: temurin
          java-version: ${{ inputs.toolchain-java-version }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Expose the toolchain JDK to Gradle
        env:
          TOOLCHAIN_JDK: ${{ steps.toolchain-jdk.outputs.path }}
        run: |
          mkdir -p "${GRADLE_USER_HOME:-$HOME/.gradle}"
          echo "org.gradle.java.installations.paths=$TOOLCHAIN_JDK" >> "${GRADLE_USER_HOME:-$HOME/.gradle}/gradle.properties"

      - name: Prove that each fix commit's tests fail on its parent
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RED_PROOF_TASKS: ${{ inputs.red-proof-tasks }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.gpr_token || secrets.GITHUB_TOKEN }}
        run: |
          # >>> red-proof
          set -euo pipefail
          top=$(git rev-parse --show-toplevel)
          log="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/red-proof.log"
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          read -r -a tasks <<< "${RED_PROOF_TASKS:-test}"
          # Klasa testowa: plik źródłowy poza src/main, którego nazwa kończy się jak klasa testu w JUnit/Spock.
          source_file='^(.*/)?src/([^/]+)/(java|kotlin|groovy)/(.+)\.(java|kt|groovy)$'
          test_name='(Test|Tests|IT|ITCase|Spec)$'
          trap 'git -C "$top" reset --quiet --hard; git -C "$top" checkout --quiet --detach "$HEAD_SHA"' EXIT
          printf '## Red-proof\n\n| Commit | Test class | On the parent |\n|---|---|---|\n' >> "$summary"
          failed=0
          fixes=0
          while IFS= read -r commit; do
            subject=$(git log -1 --format=%s "$commit")
            [[ "$subject" =~ ^fix(\([^\)]*\))?!?: ]] || continue
            fixes=$((fixes + 1))
            short=$(git rev-parse --short "$commit")
            classes=()
            while IFS= read -r path; do
              [[ "$path" =~ $source_file ]] || continue
              source_set="${BASH_REMATCH[2]}"
              name="${BASH_REMATCH[4]}"
              if [[ "$source_set" != main && "$name" =~ $test_name ]]; then classes+=("${name//\//.}"); fi
            done < <(git diff-tree --no-commit-id --name-only -r --diff-filter=AM "$commit")
            if [ "${#classes[@]}" -eq 0 ]; then
              echo "::error title=PLAT-RED-001::[PLAT-RED-001] $short \"$subject\" adds or changes no test class, so nothing proves the bug it fixes"
              printf "| \`%s\` | none | PLAT-RED-001 |\n" "$short" >> "$summary"
              failed=1
              continue
            fi
            # Testy z commita, kod produkcyjny z rodzica: plik dodany w commicie znika, zmieniony wraca do rodzica.
            git -C "$top" reset --quiet --hard
            git -C "$top" checkout --quiet --detach "$commit"
            while IFS= read -r path; do
              if git -C "$top" cat-file -e "$commit^:$path" 2> /dev/null; then
                git -C "$top" checkout --quiet "$commit^" -- "$path"
              else
                git -C "$top" rm --quiet -- "$path"
              fi
            done < <(git diff-tree --no-commit-id --name-only -r "$commit" | grep -E '(^|/)src/main/' || true)
            find "$top" -type d -path '*/build/test-results' -prune -exec rm -rf {} +
            arguments=()
            for task in "${tasks[@]}"; do
              arguments+=("$task")
              for class in "${classes[@]}"; do arguments+=(--tests "$class"); done
            done
            echo "$short: ./gradlew ${arguments[*]}"
            ./gradlew "${arguments[@]}" --continue --no-daemon -Pplatform.test.retry=off > "$log" 2>&1 || true
            red=0
            ran=0
            for class in "${classes[@]}"; do
              result="did not run"
              while IFS= read -r report; do
                if grep -Eq '<testsuite[^>]* (failures|errors)="[1-9]' "$report"; then
                  result="red"
                elif [ "$result" != red ]; then
                  result="green"
                fi
              done < <(find "$top" -type f -path '*/build/test-results/*' \( -name "TEST-$class.xml" -o -name "TEST-$class\$*.xml" \))
              [ "$result" = "did not run" ] || ran=1
              [ "$result" != red ] || red=1
              printf "| \`%s\` | \`%s\` | %s |\n" "$short" "$class" "$result" >> "$summary"
            done
            if [ "$red" -eq 1 ]; then
              echo "red-proof: $short \"$subject\" fails on its parent, as a regression test must"
            elif [ "$ran" -eq 1 ]; then
              echo "::error title=PLAT-RED-002::[PLAT-RED-002] $short \"$subject\": ${classes[*]} pass on the parent commit, so they do not reproduce the bug"
              failed=1
            else
              tail -n 40 "$log"
              echo "::error title=PLAT-RED-003::[PLAT-RED-003] $short \"$subject\": ${classes[*]} did not run on the parent commit (compilation or setup failed); the log ends above"
              failed=1
            fi
          done < <(git rev-list --reverse --no-merges "$BASE_SHA..$HEAD_SHA")
          [ "$fixes" -gt 0 ] || echo "red-proof: no fix: commit between ${BASE_SHA:0:7} and ${HEAD_SHA:0:7}, nothing to prove"
          exit "$failed"
          # <<< red-proof
