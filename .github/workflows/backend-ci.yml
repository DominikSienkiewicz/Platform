name: Backend CI (reusable)

# Reusable workflow dla backendów Spring/Gradle. Wołany przez repo:
#   jobs: { backend: { uses: DominikSienkiewicz/Platform/.github/workflows/backend-ci.yml@v1, secrets: inherit } }
on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: backend
      java-version:
        type: string
        default: "25"
      toolchain-java-version:
        description: "JDK toolchainu kompilacji (seniordev.java-conventions). Instalowany przez setup-java, nie przez Foojay."
        type: string
        default: "27"
      gradle-task:
        type: string
        default: "build"
    secrets:
      gpr_token:
        description: "PAT z read:packages do prywatnych paczek Platform (fallback: automatyczny GITHUB_TOKEN)."
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Build & test (JDK ${{ inputs.java-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Toolchain JDK z setup-java (API Adoptium), nie z Foojay: 2026-09-25 Foojay indeksował Temurin 27
      # dla linuksa tylko jako build Alpine (musl), resolver wybierał go na runnerze glibc i Gradle
      # odrzucał rozpakowane archiwum. Jawna ścieżka w installations.paths omija provisioning.
      - uses: actions/setup-java@v5
        id: toolchain-jdk
        with:
          distribution: temurin
          java-version: ${{ inputs.toolchain-java-version }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Expose the toolchain JDK to Gradle
        env:
          TOOLCHAIN_JDK: ${{ steps.toolchain-jdk.outputs.path }}
        run: |
          mkdir -p "${GRADLE_USER_HOME:-$HOME/.gradle}"
          echo "org.gradle.java.installations.paths=$TOOLCHAIN_JDK" >> "${GRADLE_USER_HOME:-$HOME/.gradle}/gradle.properties"

      # GITHUB_ACTOR + GITHUB_TOKEN włączają w settings.gradle.kts repo GitHub Packages
      # (local-first: lokalnie mavenLocal, na CI fallback do GitHub Packages).
      - name: ./gradlew ${{ inputs.gradle-task }}
        run: ./gradlew $GRADLE_TASK --no-daemon --stacktrace
        env:
          GRADLE_TASK: ${{ inputs.gradle-task }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.gpr_token || secrets.GITHUB_TOKEN }}

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports-${{ github.run_id }}
          path: |
            ${{ inputs.working-directory }}/build/reports/tests/
            ${{ inputs.working-directory }}/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
