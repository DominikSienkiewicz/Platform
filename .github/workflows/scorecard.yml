name: Scorecard (reusable)

# Reusable OpenSSF Scorecard. Wołany przez repo (z odpowiednimi uprawnieniami na poziomie joba callera).
# Platform woła go na sobie z self-scan.yml — jedyne publiczne repo ekosystemu, więc tylko tu wynik
# trafia do api.securityscorecards.dev (publish_results).
on:
  workflow_call:
    inputs:
      timeout-minutes:
        description: "Minutes before the job is cancelled; GitHub's default is 360. Raise it for a slower build."
        type: number
        default: 10

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      security-events: write
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
