name: Scorecard (reusable)

# Reusable OpenSSF Scorecard. Wołany przez repo (z odpowiednimi uprawnieniami na poziomie joba callera).
# Platform woła go na sobie z self-scan.yml — jedyne publiczne repo ekosystemu, więc tylko tu wynik
# trafia do api.securityscorecards.dev (publish_results).
on:
  workflow_call:
    inputs:
      timeout-minutes:
        description: "Minutes before the job is cancelled; GitHub's default is 360. Raise it for a slower build."
        type: number
        default: 10

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      security-events: write
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
