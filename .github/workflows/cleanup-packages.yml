name: Cleanup old package versions

# ŚWIADOME, RĘCZNE sprzątanie (tylko workflow_dispatch — brak crona).
# Powód: przy deliberate versioning + exact pin u konsumenta automatyczne przycinanie mogłoby
# skasować wersję, którą ktoś jeszcze pinuje. Dlatego `protect` (piny konsumentów) jest wymagany,
# a `dry_run` domyślnie włączony — logika i jej test: scripts/cleanup-packages.sh,
# templates/tests/cleanup-packages.test.sh; zasady: RELEASING.md, "Package retention".
on:
  workflow_dispatch:
    inputs:
      protect:
        description: "Versions consumers still pin, comma-separated (e.g. 1.5.26,1.5.31). They are never deleted."
        type: string
        required: true
      keep:
        description: "How many of the newest versions to keep per package"
        type: string
        default: "10"
      dry_run:
        description: "Only print the plan; nothing is deleted"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Prune (keep the newest N, never a protected version)
        env:
          # PAT konta (classic) z zakresami: read:packages + delete:packages.
          # WAŻNE: automatyczny GITHUB_TOKEN NIE zarządza pakietami KONTA użytkownika — potrzebny PAT.
          GH_TOKEN: ${{ secrets.PACKAGES_ADMIN_TOKEN }}
          KEEP: ${{ inputs.keep }}
          PROTECT: ${{ inputs.protect }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Missing secret PACKAGES_ADMIN_TOKEN (classic PAT: read:packages + delete:packages)."
            exit 1
          fi
          args=(--keep "$KEEP" --protect "$PROTECT")
          if [ "$DRY_RUN" != "true" ]; then
            args+=(--execute)
          fi
          bash scripts/cleanup-packages.sh "${args[@]}"
