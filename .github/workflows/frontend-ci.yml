name: Frontend CI (reusable)

# Reusable workflow dla frontendów Next.js. Kroki tolerancyjne (`--if-present`), więc działa
# niezależnie od tego, które skrypty repo definiuje (lint/typecheck/test/build).
on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: frontend
      node-version:
        type: string
        default: "24"
      run-e2e:
        type: boolean
        default: false
    secrets:
      gpr_token:
        description: "Token do GitHub Packages npm (@dominiksienkiewicz/*). Fallback: automatyczny GITHUB_TOKEN."
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Lint / test / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      # .npmrc konsumenta czyta ${GITHUB_TOKEN} dla scope @dominiksienkiewicz na GitHub Packages.
      GITHUB_TOKEN: ${{ secrets.gpr_token || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - run: npm ci

      # Guard kanonu wersji Platform (@dominiksienkiewicz/versions). Tolerancyjny jak reszta
      # kroków: repo bez paczki = guard pominięty (notice), repo z paczką = dryf failuje build.
      - name: Platform versions guard
        run: |
          if [ -e node_modules/.bin/platform-versions-check ]; then
            node node_modules/@dominiksienkiewicz/versions/bin/check.mjs
          else
            echo "::notice::brak @dominiksienkiewicz/versions w zależnościach — guard kanonu pominięty"
          fi

      - run: npm run lint --if-present
      - run: npm run typecheck --if-present
      - run: npm run test --if-present
      - run: npm run build --if-present

      - name: E2E (Playwright)
        if: ${{ inputs.run-e2e }}
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e --if-present
