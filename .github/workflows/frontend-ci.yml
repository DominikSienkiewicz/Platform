name: Frontend CI (reusable)

# Backward-compatible by default; strict mode requires all standard checks.
# Caller contract (permissions, secrets, a snippet): docs/reusable-workflows.md.
on:
  workflow_call:
    inputs:
      working-directory:
        description: "Directory of the frontend package.json, relative to the repository root."
        type: string
        default: frontend
      node-version:
        description: "Node.js version for install, lint, test and build."
        type: string
        default: "24"
      strict:
        description: "Require the Platform guard and lint/typecheck/test/build scripts."
        type: boolean
        default: false
      run-e2e:
        description: "Run the Playwright end-to-end tests (`npm run test:e2e`) after the build."
        type: boolean
        default: false
    secrets:
      gpr_token:
        description: "Token for GitHub Packages npm (@dominiksienkiewicz/*). Without it the caller's automatic GITHUB_TOKEN is used, which needs packages: read and access to Platform's packages."
        required: false

# packages: read — bez tego fallback na automatyczny GITHUB_TOKEN callera nie przeczyta
# @dominiksienkiewicz/* z GitHub Packages. Caller musi przyznać to samo (workflow wołany nie dostanie więcej).
permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Lint / test / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      # --ignore-scripts: instalacja nie odpala skryptów lifecycle zależności (supply chain).
      # Binaria platformowe (sharp, unrs-resolver) przychodzą jako optionalDependencies, więc
      # działają bez postinstall. Repo konsumenckie, które WYMAGA skryptu, musi to zgłosić tutaj.
      # Token tylko w tym kroku: .npmrc konsumenta czyta ${GITHUB_TOKEN} dla scope @dominiksienkiewicz,
      # a lint/test/build (kod zależności) nie dostają poświadczeń. npm zostawia niezdefiniowane
      # ${GITHUB_TOKEN} jako literał, więc późniejsze `npm run` działają bez niego.
      - run: npm ci --ignore-scripts
        env:
          GITHUB_TOKEN: ${{ secrets.gpr_token || secrets.GITHUB_TOKEN }}

      - name: Require standard scripts
        if: ${{ inputs.strict }}
        env:
          REQUIRE_E2E: ${{ inputs.run-e2e }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const { scripts = {} } = JSON.parse(readFileSync('package.json', 'utf8'));
          const required = ['lint', 'typecheck', 'test', 'build'];
          if (process.env.REQUIRE_E2E === 'true') required.push('test:e2e');
          const missing = required.filter(name => typeof scripts[name] !== 'string' || !scripts[name].trim());
          if (missing.length) {
            console.error(`Missing required scripts: ${missing.join(', ')}`);
            process.exit(1);
          }
          NODE

      # Guard kanonu wersji Platform (@dominiksienkiewicz/versions). Tolerancyjny jak reszta
      # kroków: repo bez paczki = guard pominięty (notice), repo z paczką = dryf failuje build.
      - name: Platform versions guard
        env:
          STRICT: ${{ inputs.strict }}
        run: |
          if [ -e node_modules/.bin/platform-versions-check ]; then
            node node_modules/@dominiksienkiewicz/versions/bin/check.mjs
          elif [ "$STRICT" = "true" ]; then
            echo "::error::Missing @dominiksienkiewicz/versions; strict CI cannot skip the version guard"
            exit 1
          else
            echo "::notice::brak @dominiksienkiewicz/versions w zależnościach — guard kanonu pominięty"
          fi

      - run: npm run lint --if-present
      - run: npm run typecheck --if-present
      - run: npm run test --if-present
      - run: npm run build --if-present

      - name: E2E (Playwright)
        if: ${{ inputs.run-e2e }}
        run: |
          # --no: użyj Playwrighta z node_modules (npm ci wyżej) i przerwij, jeśli go nie ma.
          # Bez tego npx pobrałby dowolną wersję z rejestru i wykonał jej skrypty instalacyjne.
          npx --no playwright install --with-deps chromium
          npm run test:e2e --if-present
