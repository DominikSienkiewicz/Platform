name: Container scan (reusable)

# Reusable skan OPUBLIKOWANYCH obrazów (ścieżka MONITORINGU) — łapie CVE w warstwie bazowej
# obrazu (pakiety OS bazy: sapmachine/eclipse-temurin/node), których SBOM+Grype na zależnościach nie widzi.
# Grype = bramka fail-build (severity-cutoff). Snyk = druga opinia + `monitor` -> dashboard (nieblokujący).
#
# Obrazy budowane są runtime-only (jar/bundle na hoście), więc NIE odbudowujemy ich tutaj —
# ściągamy gotowe z GHCR i skanujemy. Bramkę PRZY DEPLOYU (przed push) robią kroki inline w
# deploy.yml repo (obraz jest tam lokalny). Ten workflow to cotygodniowy re-scan tego, co już wisi.
#
# Nieopublikowany obraz = czysty SKIP: dopóki nie ruszył pierwszy deploy, :latest nie istnieje w GHCR;
# preflight `docker manifest inspect` wykrywa brak manifestu i pomija skan tej pozycji (zamiast failować
# całą bramkę). Inne błędy pulla (auth/rate-limit) nadal failują — brak obrazu, który MIAŁ być, to sygnał.
#
# Wołane przez repo (zwykle na cron):
#   jobs:
#     container-scan:
#       uses: DominikSienkiewicz/Platform/.github/workflows/container-scan.yml@vX.Y.Z
#       with:
#         images: '["ghcr.io/owner/app-backend:latest","ghcr.io/owner/app-frontend:latest"]'
#       secrets:
#         snyk_token: ${{ secrets.SNYK_TOKEN }}
on:
  workflow_call:
    inputs:
      timeout-minutes:
        description: "Minutes before the job is cancelled; GitHub's default is 360. Raise it for a slower build."
        type: number
        default: 15
      images:
        description: "JSON array of full image references to scan, e.g. '[\"ghcr.io/owner/app:latest\"]'."
        type: string
        required: true
      severity-cutoff:
        description: "Grype fail threshold: negligible, low, medium, high or critical."
        type: string
        default: high
      only-fixed:
        description: "Fail only on vulnerabilities that have a fix. Base images carry unfixable HIGH OS CVEs, which would otherwise keep the gate red."
        type: boolean
        default: true
    secrets:
      snyk_token:
        description: "Snyk token. Without it the Snyk steps are skipped; Grype stays the gate."
        required: false

permissions:
  contents: read
  packages: read # pull prywatnych obrazów z GHCR (GITHUB_TOKEN callera)

jobs:
  scan:
    name: Scan ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(inputs.images) }}
    env:
      SNYK_TOKEN: ${{ secrets.snyk_token }}
      # Obraz Snyka przypięty digestem: tag :docker jest ruchomy, a dawna akcja Snyka dla Dockera uruchamiała właśnie
      # ten tag, więc pin SHA akcji niczego nie przypinał. CLI jest wbudowany przy budowie obrazu
      # (snyk/snyk-images 54dbb8b, stan 2026-10-18), więc digest przypina wykonywany kod. Lustro: deploy.yml.
      SNYK_IMAGE: snyk/snyk:docker@sha256:d6595337edef7ce37eded247b8bb47ebb60681fd802c49e64c1b80b3a6963187
    steps:
      # Sekret trafia do kroku przez `env`, nie przez interpolację `${{ }}` w treści `run`:
      # interpolacja wkleja wartość do skryptu shella (widoczna w trace, podatna na wstrzyknięcie
      # przez zawartość podstawianą obok), `env` przekazuje ją procesowi bez przechodzenia przez parser.
      - name: Log in to GHCR
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      # Obraz powstaje dopiero przy PIERWSZYM deployu (push do `release`). Zanim to nastąpi, :latest
      # nie istnieje w GHCR i cotygodniowy monitoring nie ma czego skanować — traktujemy to jako czysty
      # SKIP, nie failure. Ale TYLKO realny brak manifestu; auth/rate-limit/inne błędy nadal failują,
      # żeby nie zamaskować zepsutego deployu (obraz miał być, a go nie ma). Idiom `docker manifest
      # inspect` jak w deploy.yml (chk()); sentinele wyznaczają blok testowany hermetycznie
      # (templates/tests/container-scan-skip.test.sh) — trzymaj je zsynchronizowane.
      - name: Check image is published
        id: published
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          # >>> classify-image-presence
          set -uo pipefail
          if err="$(docker manifest inspect "$IMAGE" 2>&1 >/dev/null)"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          elif grep -qiE 'manifest unknown|manifest.*not found|no such manifest|name unknown|not found' <<<"$err"; then
            echo "::notice title=container-scan::$IMAGE nie jest jeszcze opublikowany w GHCR — pomijam skan (brak manifestu)."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error title=container-scan::Nieoczekiwany błąd inspekcji $IMAGE (to NIE brak manifestu):"
            echo "$err"
            exit 1
          fi
          # <<< classify-image-presence

      - name: Pull image
        if: steps.published.outputs.present == 'true'
        env:
          IMAGE: ${{ matrix.image }}
        run: docker pull "$IMAGE"

      # --- Grype: bramka (fail-build na >= severity-cutoff) ---
      - name: Grype scan (gate)
        if: steps.published.outputs.present == 'true'
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: ${{ matrix.image }}
          fail-build: true
          severity-cutoff: ${{ inputs.severity-cutoff }}
          only-fixed: ${{ inputs.only-fixed }}
          output-format: table

      # --- Snyk: druga opinia (nieblokująca) + monitor -> dashboard. Skip, gdy brak tokena/obrazu. ---
      - name: Snyk container test (advisory)
        if: ${{ steps.published.outputs.present == 'true' && env.SNYK_TOKEN != '' }}
        continue-on-error: true
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm -e SNYK_TOKEN -v /var/run/docker.sock:/var/run/docker.sock \
            "$SNYK_IMAGE" snyk container test "$IMAGE" --severity-threshold=high

      - name: Snyk container monitor (dashboard)
        if: ${{ steps.published.outputs.present == 'true' && env.SNYK_TOKEN != '' }}
        continue-on-error: true
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm -e SNYK_TOKEN -v /var/run/docker.sock:/var/run/docker.sock \
            "$SNYK_IMAGE" snyk container monitor "$IMAGE"
