name: Publish npm packages

# Publikuje paczki frontendu (tsconfig / eslint-config / tailwind-preset / ui) do GitHub Packages (npm).
# Trigger: tag vX.Y.Z lub ręcznie.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://npm.pkg.github.com"
          scope: "@dominiksienkiewicz"

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Build registry (shadcn)
        run: pnpm --filter @dominiksienkiewicz/ui build || echo "registry build skipped"

      - name: Publish all packages
        run: pnpm -r publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
