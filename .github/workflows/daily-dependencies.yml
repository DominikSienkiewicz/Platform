name: Daily dependency updates

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: daily-dependencies
  cancel-in-progress: false

jobs:
  propose:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    outputs:
      branches: ${{ steps.branches.outputs.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app
        with:
          client-id: ${{ vars.DEPENDENCY_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDENCY_APP_PRIVATE_KEY }}
      - name: Propose stable updates
        env:
          RENOVATE_TOKEN: ${{ steps.app.outputs.token }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_FORCE: '{"automerge":false,"skipArtifactsUpdate":true,"rebaseWhen":"behind-base-branch"}'
        run: npx --yes --package "renovate@$(< .github/renovate-version)" -- renovate "$GITHUB_REPOSITORY"
      - name: Find open update branches
        id: branches
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BOT: ${{ steps.app.outputs.app-slug }}[bot]
        run: |
          branches=$(bash scripts/pending-dependency-updates.sh)
          echo "result=$branches" >> "$GITHUB_OUTPUT"
          echo "Dependency pull requests awaiting preparation: $(jq length <<< "$branches")" >> "$GITHUB_STEP_SUMMARY"

  prepare:
    needs: propose
    if: needs.propose.outputs.branches != '[]'
    strategy:
      fail-fast: false
      matrix:
        update: ${{ fromJSON(needs.propose.outputs.branches) }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.update.head }}
          fetch-depth: 0
          persist-credentials: false
      - name: Identify the changed sources
        id: changes
        env:
          BASE: ${{ matrix.update.base }}
        run: |
          ancestor=$(git merge-base "$BASE" HEAD)
          echo "ancestor=$ancestor" >> "$GITHUB_OUTPUT"
          git diff --quiet "$ancestor" HEAD -- gradle/catalog/libs.versions.toml || echo "catalog=true" >> "$GITHUB_OUTPUT"
          git diff --quiet "$ancestor" HEAD -- frontend/package.json ':(glob)frontend/packages/*/package.json' frontend/packages/versions/versions.json ||
            echo "frontend=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        if: steps.changes.outputs.catalog == 'true'
        with:
          distribution: temurin
          java-version: "27"
      - name: Resolve the catalog and regenerate verification metadata
        if: steps.changes.outputs.catalog == 'true'
        env:
          BASE: ${{ steps.changes.outputs.ancestor }}
        run: bash scripts/refresh-catalog-update.sh "$BASE"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changes.outputs.frontend == 'true'
        with:
          node-version: "24"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.changes.outputs.frontend == 'true'
        with:
          package_json_file: frontend/package.json
      - name: Resolve the updated workspace
        if: steps.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - name: Prepare the Platform release for review
        env:
          DEPENDENCY_ADVISORIES: ${{ matrix.update.advisories }}
          BASE: ${{ matrix.update.base }}
          BRANCH: ${{ matrix.update.branch }}
        run: |
          flags=()
          if [[ "$BRANCH" == renovate/major-* ]]; then flags+=(--review-major); fi
          bash scripts/prepare-dependency-release.sh "$BASE" "${flags[@]}"
      - name: Export generated files
        run: |
          git diff --binary -- gradle/catalog/libs.versions.toml ':(glob)gradle/*/*gradle.lockfile' \
            ':(glob)gradle/*/gradle/verification-metadata.xml' frontend/packages/versions/agents/stack.json \
            frontend/pnpm-lock.yaml CHANGELOG.md ':(glob)gradle/*/gradle.properties' \
            ':(glob)templates/jvm/*/gradle.properties' ':(glob)frontend/packages/*/package.json' > "$RUNNER_TEMP/generated.patch"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-${{ matrix.update.number }}-${{ matrix.update.head }}
          path: ${{ runner.temp }}/generated.patch
          retention-days: 1
          overwrite: true

  attach:
    if: ${{ !cancelled() && needs.propose.result == 'success' && needs.propose.outputs.branches != '[]' }}
    needs: [propose, prepare]
    strategy:
      fail-fast: false
      matrix:
        update: ${{ fromJSON(needs.propose.outputs.branches) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: generated-${{ matrix.update.number }}-${{ matrix.update.head }}
          path: ${{ runner.temp }}/result
      - id: patch
        run: if [[ -s "$RUNNER_TEMP/result/generated.patch" ]]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.patch.outputs.changed == 'true'
        with:
          ref: ${{ matrix.update.head }}
          persist-credentials: false
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        if: steps.patch.outputs.changed == 'true'
        id: app
        with:
          client-id: ${{ vars.DEPENDENCY_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDENCY_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Commit generated files to the same update branch
        if: steps.patch.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BRANCH: ${{ matrix.update.branch }}
          EXPECTED_HEAD: ${{ matrix.update.head }}
        run: |
          # >>> attach-generated
          [[ "$BRANCH" == renovate/* ]]
          git apply --index --include='gradle/catalog/libs.versions.toml' --include='gradle/*/*gradle.lockfile' \
            --include='gradle/*/gradle/verification-metadata.xml' --include='frontend/packages/versions/agents/stack.json' \
            --include='frontend/pnpm-lock.yaml' --include='CHANGELOG.md' --include='gradle/*/gradle.properties' \
            --include='templates/jvm/*/gradle.properties' --include='frontend/packages/*/package.json' "$RUNNER_TEMP/result/generated.patch"
          git diff --cached --name-only -z | while IFS= read -r -d '' file; do
            git show ":$file" | jq -Rs --arg path "$file" '{path: $path, contents: @base64}'
          done | jq -s --arg repo "$GITHUB_REPOSITORY" --arg branch "$BRANCH" --arg head "$EXPECTED_HEAD" '{
            query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
            variables: {input: {branch: {repositoryNameWithOwner: $repo, refName: $branch}, expectedHeadOid: $head,
              message: {headline: "chore(deps): refresh generated dependency files"}, fileChanges: {additions: .}}}
          }' | gh api graphql --input - --jq .data.createCommitOnBranch.commit.oid
          # <<< attach-generated
