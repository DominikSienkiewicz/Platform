name: CI

# Walidacja pushy do main i PR-ów: czy moduły z gradle/maven-modules.txt budują się na JDK 27,
# czy paczki frontendu instalują się, przechodzą ESLint, tsc (checkJs, deklaracje .d.ts, testy typów)
# i własne testy oraz czy przechodzą wszystkie śledzone testy skryptów (*.test.sh poza frontend/).
# Filtr branches jest celowy: bez niego CI odpala się też na tagach (np. v1.3.2).
# Wydanie nie polega na wyniku pushu do main: release.yml woła ten workflow przez workflow_call
# (job `verify`) na otagowanym commicie i publikuje dopiero po jego zielonym wyniku.
# Cron w poniedziałek 04:00 UTC: dryf środowiska (runner, Foojay, GitHub Packages) widać tu przed
# cotygodniowymi cronami konsumentów, a nie dopiero u nich.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_call:

permissions:
  contents: read

# github.workflow rozdziela wywołanie z Release od zwykłego CI na tym samym refie.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Moduły publikowane do Maven są sprawdzane sekwencyjnie w jednym jobie.
  # Każdy jest krótki (~40 s), a matrix powielał stały narzut (checkout + setup-java + setup-gradle)
  # ×3 i naliczał 3 pełne minuty za ~2 min realnej pracy (najgorszy stosunek podatku od zaokrąglania
  # w całym koncie). Sekwencyjnie w jednym runnerze = jeden narzut zamiast trzech. `fail-fast: false`
  # zachowane przez `|| fail=1` + `exit $fail` — wszystkie moduły próbują się zbudować, raport zbiorczy.
  gradle:
    name: Gradle — every module of gradle/maven-modules.txt
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        id: toolchain
        with:
          distribution: temurin
          java-version: "27"
      - name: Register consumer toolchain
        env:
          TOOLCHAIN_JAVA_HOME: ${{ steps.toolchain.outputs.path }}
        run: |
          mkdir -p "$HOME/.gradle"
          echo "org.gradle.java.installations.paths=$TOOLCHAIN_JAVA_HOME" >> "$HOME/.gradle/gradle.properties"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build wszystkich modułów
        run: |
          set -uo pipefail
          fail=0
          while read -r m; do
            echo "::group::gradle/$m — build"
            ( cd "gradle/$m" && chmod +x ./gradlew && ./gradlew --no-daemon build ) < /dev/null || fail=1
            echo "::endgroup::"
          done < <(awk '!/^#/ && NF { print $1 }' gradle/maven-modules.txt)
          exit $fail
      # Tylko przy porażce: raport HTML i XML z wyjściem builda TestKit, którego log joba nie mieści.
      # run_attempt w nazwie: artefakty są niezmienne, a ponowiony job biegnie w tym samym run_id.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platform-gradle-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            gradle/*/build/reports/tests/
            gradle/*/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Obraz z templates/Dockerfile.backend naprawdę się buduje i zdrowieje (N-CAP-5): jar startera spring-app
  # z Platform tego commita (lokalne repo Maven), z actuatorem dołożonym do kopii, bo sam starter go nie ma.
  runtime-image:
    name: Runtime image — templates/Dockerfile.backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        id: toolchain
        with:
          distribution: temurin
          java-version: "27"
      - name: Build the spring-app starter on this commit
        env:
          TOOLCHAIN_JDK: ${{ steps.toolchain.outputs.path }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.gradle"
          echo "org.gradle.java.installations.paths=$TOOLCHAIN_JDK" >> "$HOME/.gradle/gradle.properties"
          repo="$RUNNER_TEMP/platform-repo"
          # Z gradle/maven-modules.txt tylko to, co rozwiązuje starter spring-app: konwencje, katalog i platform-bom.
          awk '!/^#/ && NF && $1 ~ /^(build-logic|catalog|bom)$/ { print $1 }' gradle/maven-modules.txt | while IFS= read -r module; do
            (cd "gradle/$module" && ./gradlew --no-daemon -PplatformBundleRepository="$repo" publishAllPublicationsToBundleRepository)
          done
          app="$RUNNER_TEMP/spring-app"
          cp -R templates/jvm/spring-app "$app"
          cp -R templates/jvm/java-library/gradlew templates/jvm/java-library/gradle/wrapper "$app/"
          mkdir -p "$app/gradle" && mv "$app/wrapper" "$app/gradle/wrapper"
          sed -i 's|implementation(libs.boot.starter.webmvc)|&\n\timplementation("org.springframework.boot:spring-boot-starter-actuator")|' "$app/build.gradle.kts"
          (cd "$app" && ./gradlew --no-daemon bootJar -PplatformRepository="file://$repo")
          cp templates/Dockerfile.backend "$app/Dockerfile"
      - name: Build the layered image and wait for healthy
        run: |
          set -euo pipefail
          docker build -t platform-runtime-image:ci "$RUNNER_TEMP/spring-app"
          docker run -d --name platform-runtime-image platform-runtime-image:ci > /dev/null
          for _ in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' platform-runtime-image)
            [ "$status" = healthy ] && break
            [ "$status" = unhealthy ] && break
            sleep 5
          done
          docker logs platform-runtime-image 2>&1 | tail -20
          [ "$status" = healthy ] || { echo "::error::the image of templates/Dockerfile.backend did not become healthy ($status)"; exit 1; }
          echo "templates/Dockerfile.backend: layered image healthy"

  # Obraz z templates/Dockerfile.frontend naprawdę się buduje i odpowiada na porcie 3000 (N-CAP-6): frontend
  # z scripts/new-consumer.sh --frontend next przypięty do ostatniego WYDANIA, bo paczek Platform
  # wersji checkoutu nie ma jeszcze w GitHub Packages. GITHUB_TOKEN (packages: read) czyta je przez .npmrc
  # konsumenta, a do obrazu trafia wyłącznie jako sekret BuildKit github_token, nigdy jako build-arg.
  # Koszt ograniczony: PR i push do main budują obraz tylko, gdy zmieniło się jego wejście (Dockerfile,
  # next.config.ts, npmrc, generator, ten workflow); cron i wywołanie z Release (ref = tag) budują zawsze, bo nowe
  # wydanie i dryf node:24-slim, npm czy Next zmieniają wynik bez żadnej zmiany w repo.
  # Bloki między markerami frontend-image-* uruchamia templates/tests/ci-frontend-image.test.sh.
  frontend-image:
    name: Frontend image — templates/Dockerfile.frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      # fetch-depth 0: tagi wydań i gałąź bazowa PR-a bez osobnego `git fetch` z tokenem.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Did an input of the image change
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          # >>> frontend-image-changes
          set -euo pipefail
          inputs='^(scripts/legacy-frontend-smoke\.mjs|templates/Dockerfile\.frontend|templates/npmrc|scripts/new-consumer\.sh|\.github/workflows/ci\.yml)$|^templates/frontend/'
          if { [ "$EVENT" != push ] && [ "$EVENT" != pull_request ]; } || [ "$REF_TYPE" = tag ]; then
            build=true
          else
            if [ "$EVENT" = pull_request ]; then
              range="origin/$BASE_REF...HEAD"
            elif [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
              range="HEAD^...HEAD"
            else
              range="$BEFORE...HEAD"
            fi
            changed=$(git diff --name-only "$range")
            if grep -qE -- "$inputs" <<<"$changed"; then build=true; else build=false; fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          [ "$build" = true ] || echo "::notice::No input of the frontend image changed, so it is not built."
          # <<< frontend-image-changes
      - name: Find the latest release
        id: release
        if: ${{ steps.changes.outputs.build == 'true' }}
        run: |
          # >>> frontend-image-release
          set -euo pipefail
          # Tag na HEAD albo za nim to wydanie, które ten bieg dopiero bramkuje (Release woła ci.yml jako verify),
          # więc jego paczek jeszcze nie opublikowano. Ruchomy v1 i tagi spoza vX.Y.Z odpadają.
          tags=$(git tag --list 'v*' --no-contains HEAD --sort=-v:refname)
          tag=$(awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ { print; exit }' <<<"$tags")
          [ -n "$tag" ] || { echo "::error::No release tag vX.Y.Z before HEAD to take the Platform packages from."; exit 1; }
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "The frontend pins the packages of Platform $tag."
          # <<< frontend-image-release
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ steps.changes.outputs.build == 'true' }}
        with:
          node-version: "24"
      - name: Authenticate the last personal-scope release for the migration smoke
        if: ${{ steps.release.outputs.version == '1.13.1' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/legacy-platform-assets"
          mkdir -p "$assets"
          gh release download v1.13.1 --repo SeniorDeveloper-pl-Dominik-Sienkiewicz/Platform --dir "$assets" \
            --pattern SHA256SUMS --pattern platform-1.13.1-assets.sigstore.json --pattern '*.tgz'
          gh attestation verify "$assets/SHA256SUMS" --bundle "$assets/platform-1.13.1-assets.sigstore.json" \
            --repo DominikSienkiewicz/Platform --signer-workflow DominikSienkiewicz/Platform/.github/workflows/release.yml \
            --source-ref refs/tags/v1.13.1 --source-digest "$(git rev-parse 'v1.13.1^{commit}')"
      - name: Render a frontend pinned at the release
        id: render
        if: ${{ steps.changes.outputs.build == 'true' }}
        env:
          VERSION: ${{ steps.release.outputs.version }}
          MANIFEST: ${{ runner.temp }}/consumer/frontend/package.json
          # npm view w bloku shipped czyta token przez .npmrc wygenerowanego frontendu.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Wersje zależności z kanonu wydania, nie checkoutu: peery eslint-config i prettier-config są dokładne,
          # więc nowszy next czy eslint z kanonu checkoutu nie zainstalowałby się obok paczek wydania. Wpisy, których
          # wydanie nie zna, zostają z checkoutu, bo generator może już ich potrzebować.
          git show "v$VERSION:frontend/packages/versions/versions.json" > "$RUNNER_TEMP/released-versions.json"
          node - frontend/packages/versions/versions.json "$RUNNER_TEMP/released-versions.json" <<'NODE'
          const { readFileSync, writeFileSync } = require("node:fs");
          const [canonPath, releasedPath] = process.argv.slice(2);
          const canon = JSON.parse(readFileSync(canonPath, "utf8"));
          Object.assign(canon.versions, JSON.parse(readFileSync(releasedPath, "utf8")).versions);
          writeFileSync(canonPath, `${JSON.stringify(canon, null, 2)}\n`);
          NODE
          bash scripts/new-consumer.sh --name frontend-image --package pl.example.image --kind java-library \
            --frontend next --platform-version "$VERSION" --out "$RUNNER_TEMP/consumer"
          if [ "$VERSION" = 1.13.1 ]; then
            node scripts/legacy-frontend-smoke.mjs prepare "$RUNNER_TEMP/consumer/frontend" "$RUNNER_TEMP/legacy-platform-assets"
            echo "shipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # >>> frontend-image-shipped
          # Wydania sprzed 1.6.0 publikowały paczki npm w wersjach własnych (1.0.0), nie w wersji Platform, więc pin
          # na takim wydaniu nie istnieje w rejestrze. Wtedy notka zamiast czerwieni; pierwsze wydanie, które
          # publikuje każdą przypiętą paczkę w swojej wersji, włącza budowanie obrazu samo. Tag to za mało: npm
          # publish 1.6.0 padł, więc o publikacji rozstrzyga rejestr (E404 = brak, inny błąd npm wywala job).
          missing=$(node - "$MANIFEST" "$VERSION" <<'NODE'
          const { execFileSync } = require("node:child_process");
          const { readFileSync } = require("node:fs");
          const { dirname } = require("node:path");
          const [manifestPath, version] = process.argv.slice(2);
          const manifest = JSON.parse(readFileSync(manifestPath, "utf8"));
          const git = (...args) => execFileSync("git", args, { encoding: "utf8", stdio: ["ignore", "pipe", "ignore"] });
          const published = new Map();
          for (const directory of git("ls-tree", "--name-only", `v${version}`, "frontend/packages/").split("\n").filter(Boolean)) {
            try {
              const released = JSON.parse(git("show", `v${version}:${directory}/package.json`));
              if (released.private !== true) published.set(released.name, released.version);
            } catch {
              // katalog bez package.json nie jest paczką
            }
          }
          const legacy = "@dominiksienkiewicz/";
          const organization = "@seniordeveloper-pl-dominik-sienkiewicz/";
          const [scope, other] = version.startsWith("1.") ? [legacy, organization] : [organization, legacy];
          const names = Object.keys({ ...manifest.dependencies, ...manifest.devDependencies });
          if (names.some((name) => name.startsWith(other))) throw new Error(`Unexpected Platform scope ${other} for ${version}`);
          const pinned = names.filter((name) => name.startsWith(scope));
          if (!pinned.length) throw new Error(`No Platform packages in the expected scope ${scope} for ${version}`);
          const inRegistry = (name) => {
            try {
              const shown = execFileSync("npm", ["view", `${name}@${version}`, "version"],
                { cwd: dirname(manifestPath), encoding: "utf8", stdio: ["ignore", "pipe", "pipe"] });
              return shown.trim() === version;
            } catch (error) {
              if (version.startsWith("1.") && /E404/.test(String(error.stderr))) return false;
              throw error;
            }
          };
          process.stdout.write(pinned.filter((name) => published.get(name) !== version || !inRegistry(name)).join(" "));
          NODE
          )
          if [ -n "$missing" ] && [[ "$VERSION" != 1.* ]]; then
            echo "::error::Platform v$VERSION does not publish $missing at the pinned version."
            exit 1
          fi
          if [ -n "$missing" ]; then
            echo "::notice::Platform v$VERSION does not publish $missing at $VERSION, so the frontend image is not built; the first release that does turns this job on."
            echo "shipped=false" >> "$GITHUB_OUTPUT"
          else
            echo "shipped=true" >> "$GITHUB_OUTPUT"
          fi
          # <<< frontend-image-shipped
      - name: Lock the dependencies through the consumer's .npmrc
        if: ${{ steps.render.outputs.shipped == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cd "$RUNNER_TEMP/consumer/frontend" && npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify the 1.x npm lock against the signed tarballs
        if: ${{ steps.render.outputs.shipped == 'true' && steps.release.outputs.version == '1.13.1' }}
        run: node scripts/legacy-frontend-smoke.mjs verify-lock "$RUNNER_TEMP/consumer/frontend" "$RUNNER_TEMP/legacy-platform-assets"
      - name: Build the image with the token as the BuildKit secret github_token
        if: ${{ steps.render.outputs.shipped == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: docker build --secret id=github_token,env=GITHUB_TOKEN -t platform-frontend-image:ci "$RUNNER_TEMP/consumer/frontend"
      - name: Start the container and wait for an answer on port 3000
        if: ${{ steps.render.outputs.shipped == 'true' }}
        timeout-minutes: 5
        run: |
          # >>> frontend-image-health
          set -euo pipefail
          docker run -d --name platform-frontend-image -p 3000:3000 platform-frontend-image:ci > /dev/null
          answered=false
          for _ in $(seq 1 30); do
            if curl -fs -o /dev/null --max-time 5 http://localhost:3000/; then answered=true; break; fi
            [ "$(docker inspect -f '{{.State.Running}}' platform-frontend-image)" = true ] || break
            sleep 2
          done
          if [ "$answered" != true ]; then
            docker logs platform-frontend-image 2>&1 | tail -50
            echo "::error::the image of templates/Dockerfile.frontend did not answer on http://localhost:3000/"
            exit 1
          fi
          echo "templates/Dockerfile.frontend: the standalone server answers on port 3000"
          # <<< frontend-image-health
      # Zawsze, także po porażce lub anulowaniu; `|| true`, gdy kontenera nie było (obraz pominięty albo niezbudowany).
      - name: Remove the container
        if: ${{ always() }}
        run: docker rm -f platform-frontend-image > /dev/null 2>&1 || true

  # Jawna walidacja gradle-wrapper.jar każdego modułu wobec sum publikowanych przez Gradle. setup-gradle
  # robi to domyślnie także w innych jobach, ale Scorecard (Binary-Artifacts) uznaje wyłącznie tę akcję.
  # Release woła ci.yml jako `verify`, więc walidacja bramkuje też wydania.
  wrapper-validation:
    name: Gradle wrapper validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

  # Każdy śledzony skrypt shell, także kopiowane do konsumentów.
  # shellcheck jest preinstalowany na ubuntu-latest; --severity=warning: uwagi informacyjne nie bramkują.
  shellcheck:
    name: Shellcheck — every tracked script
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck -x --severity=warning
        run: git ls-files -z '*.sh' | xargs -0 shellcheck -x --severity=warning

  # Składnia, wyrażenia, typy wejść i uwagi shellcheck dla każdego workflow. Binarka w przypiętej wersji,
  # pobrana z wydania i zweryfikowana sumą SHA-256 (suma z actionlint_<wersja>_checksums.txt tego wydania).
  # shellcheck jest preinstalowany na ubuntu-latest, więc actionlint sprawdza też bloki `run:`.
  actionlint:
    name: Actionlint — every workflow
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint ${{ env.ACTIONLINT_VERSION }}
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
      - name: actionlint
        run: '"$RUNNER_TEMP/actionlint" -color'

  # Piny akcji kontra prawdziwy GitHub: SHA = commit taga z komentarza `# vX.Y.Z`, nie obiekt annotated taga,
  # który Scorecard odrzuca przy publikacji jako „imposter commit”. Logikę na atrapie gh pilnuje
  # scripts/check-action-pins.test.sh (job templates).
  action-pins:
    name: Action pins — commits of their tags
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: scripts/check-action-pins.sh
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-action-pins.sh

  # Walidator configów Renovate w przypiętej wersji (jak semgrep-version w semgrep.yml): zepsuty preset
  # trafiłby do każdego konsumenta przez `extends`. Wersja >= 2 tygodnie od wydania.
  renovate-config:
    name: Renovate — validate the preset and Platform's config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: renovate-config-validator --strict
        run: npx --yes --package renovate@44.132.5 -- renovate-config-validator --strict renovate.json default.json

  # Wersja Platform dla backend-ci-smoke. Commit wydania z release.sh podbija pin startera do wersji, której
  # GitHub Packages jeszcze nie ma: release.yml publikuje ją dopiero po zielonym verify (= ten workflow), a push
  # main i tag niosą ten sam commit. Gdy pin różni się od pinu rodzica, smoke buduje na pinie rodzica, czyli
  # ostatnim wydaniu; każdy inny commit na własnym pinie. Wersji, której nie ma w rejestrze (wydanie 1.7.0 nic nie
  # opublikowało), smoke nie bierze: schodzi do najnowszej opublikowanej niższej, kluczując po markerze
  # settings-conventions z gradle/maven-modules.txt jak version-exists w release.yml.
  # Blok testuje templates/tests/smoke-platform-version.test.sh.
  smoke-platform-version:
    name: Smoke Platform version
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.pin.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2 # rodzic HEAD: pin ostatniego wydania na commicie wydania
      - id: pin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPR_OWNER: ${{ github.repository_owner }}
        run: |
          # >>> smoke-platform-version
          pin_file=templates/jvm/java-library/gradle.properties
          read_pin() { sed -n 's/^platformVersion=//p' | tr -d ' \r'; }
          pin=$(read_pin < "$pin_file")
          parent=$(git show "HEAD^:$pin_file" 2>/dev/null | read_pin) || parent=""
          version=$pin
          if [ -n "$parent" ] && [ "$parent" != "$pin" ]; then
            version=$parent
            echo "::notice title=backend-ci-smoke::This commit moves the starter pin to $pin, which release.yml publishes only after this CI passes, so the smoke builds on $parent."
          fi
          marker=$(awk '$1 == "build-logic" { print $2 }' gradle/maven-modules.txt)
          published=$(gh api --paginate "/orgs/$GPR_OWNER/packages/maven/$marker/versions" --jq '.[].name')
          if ! grep -qxF "$version" <<<"$published"; then
            below=$(printf '%s\n%s\n' "$published" "$version" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -uV \
              | awk -v wanted="$version" '$0 == wanted { print previous; exit } { previous = $0 }')
            if [ -z "$below" ]; then
              echo "::error title=backend-ci-smoke::Neither $version nor any version below it is in GitHub Packages."
              exit 1
            fi
            echo "::notice title=backend-ci-smoke::$version is not in GitHub Packages, so the smoke builds on $below."
            version=$below
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # <<< smoke-platform-version

  # Reusable backend-ci uruchomiony tu, zanim zrobi to konsument: na starterze java-library z jego wrapperem
  # i opublikowaną wersją Platform z joba wyżej, więc idzie prawdziwą ścieżką konsumenta (dwa setup-java, rejestracja
  # toolchainu 27, GitHub Packages przez GITHUB_TOKEN, upload raportów). Wydanie woła ci.yml jako verify,
  # więc ten job bramkuje też publikację.
  backend-ci-smoke:
    needs: smoke-platform-version
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/backend-ci.yml
    with:
      working-directory: templates/jvm/java-library
      gradle-task: build -PplatformVersion=${{ needs.smoke-platform-version.outputs.version }} ${{ startsWith(needs.smoke-platform-version.outputs.version, '1.') && '--init-script ../../../gradle/legacy-smoke-repository.init.gradle' || '' }}

  # Reusable api-contract na prawdziwym oasdiff: para zgodna musi dać breaking=false, para łamiąca
  # breaking=true. Para łamiąca idzie z fail-on-breaking: false, żeby wynik sprawdzał job niżej, a nie
  # czerwony status. Logikę kroków na stubie pilnuje templates/tests/api-contract.test.sh.
  api-contract-compatible:
    uses: ./.github/workflows/api-contract.yml
    with:
      spec-path: templates/tests/fixtures/openapi/compatible.yaml
      base-spec-path: templates/tests/fixtures/openapi/base.yaml

  api-contract-breaking:
    uses: ./.github/workflows/api-contract.yml
    with:
      spec-path: templates/tests/fixtures/openapi/breaking.yaml
      base-spec-path: templates/tests/fixtures/openapi/base.yaml
      fail-on-breaking: false

  api-contract-self-test:
    name: api-contract — self-test
    needs: [api-contract-compatible, api-contract-breaking]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          COMPATIBLE: ${{ needs.api-contract-compatible.outputs.breaking }}
          BREAKING: ${{ needs.api-contract-breaking.outputs.breaking }}
        run: |
          [ "$COMPATIBLE" = "false" ] || { echo "::error::the compatible pair reported breaking=$COMPATIBLE"; exit 1; }
          [ "$BREAKING" = "true" ] || { echo "::error::the breaking pair reported breaking=$BREAKING"; exit 1; }

  # Tytuł PR-a w formie Conventional Commit, tym samym wzorcem co message wydania w release.sh (jedno źródło);
  # notatki (scripts/release-notes.sh) grupują tematy po typie, a "ci fix" nie mówi, co się zmieniło.
  pr-title:
    name: PR title — Conventional Commit
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: release.sh
          sparse-checkout-cone-mode: false
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern=$(sed -n "s/^CONVENTIONAL='\(.*\)'$/\1/p" release.sh)
          [ -n "$pattern" ] || { echo "::error::release.sh defines no CONVENTIONAL pattern"; exit 1; }
          if ! grep -Eq "$pattern" <<<"$TITLE"; then
            echo "::error::The pull request title must be a Conventional Commit, for example \"fix(versions): keep the lockfile\" (got \"$TITLE\")."
            exit 1
          fi

  templates:
    name: Templates — testy skryptów
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Każdy śledzony *.test.sh poza frontend/ (tamte odpala `pnpm -r test`) — nowy test nie
      # wymaga dopisania do listy. Wszystkie biegną do końca, wynik zbiorczy jak w jobie gradle.
      - name: Wszystkie testy skryptów
        run: |
          set -uo pipefail
          mapfile -t tests < <(git ls-files '*.test.sh' ':!:frontend/**')
          [ "${#tests[@]}" -gt 0 ] || { echo "::error::Nie znaleziono żadnego *.test.sh"; exit 1; }
          fail=0
          for test in "${tests[@]}"; do
            echo "::group::$test"
            bash "$test" || { echo "::error file=$test::$test nie przeszedł"; fail=1; }
            echo "::endgroup::"
          done
          exit $fail

  # Dwie nogi: Node 24 (wersja Platform) i 22.13.0 — dolna granica engines.node paczek, którą konsumenci mogą
  # uruchamiać; bez tej nogi deklarowana granica nigdy nie była wykonywana (N-REL-4).
  frontend:
    name: Frontend (Node ${{ matrix.node }}) — install + lint + typecheck + test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22.13.0", "24"]
    defaults:
      run:
        working-directory: frontend
    # Bez GITHUB_TOKEN: lockfile ciągnie wyłącznie publiczne paczki npm, a job uruchamia kod zależności.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.18.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      # --ignore-scripts: żadna paczka w monorepo ani w jej drzewie zależności nie wymaga
      # skryptu lifecycle (binaria napi/sharp przychodzą jako optionalDependencies).
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm -r --if-present test
      - name: Record the Node version
        env:
          NODE_LEG: ${{ matrix.node }}
        run: echo "Frontend workspace passed on Node $(node --version) (leg $NODE_LEG)." >> "$GITHUB_STEP_SUMMARY"
