name: CI

# Walidacja pushy do main i PR-ów: czy build-logic / catalog / test-fixtures kompilują się
# na JDK 25, czy paczki frontendu instalują się, przechodzą ESLint i tsc (checkJs, deklaracje .d.ts,
# testy typów, rejestr .tsx), własne testy i budują rejestr shadcn oraz czy przechodzą wszystkie
# śledzone testy skryptów (*.test.sh poza frontend/).
# Filtr branches jest celowy: bez niego CI odpala się też na tagach (v1.3.2, ruchomy v1).
# Wydanie nie polega na wyniku pushu do main: release.yml woła ten workflow przez workflow_call
# (job `verify`) na otagowanym commicie i publikuje dopiero po jego zielonym wyniku.
# Cron w poniedziałek 04:00 UTC: dryf środowiska (runner, Foojay, GitHub Packages) widać tu przed
# cotygodniowymi cronami konsumentów, a nie dopiero u nich.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_call:

permissions:
  contents: read

# github.workflow rozdziela wywołanie z Release od zwykłego CI na tym samym refie.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Moduły publikowane do Maven są sprawdzane sekwencyjnie w jednym jobie.
  # Każdy jest krótki (~40 s), a matrix powielał stały narzut (checkout + setup-java + setup-gradle)
  # ×3 i naliczał 3 pełne minuty za ~2 min realnej pracy (najgorszy stosunek podatku od zaokrąglania
  # w całym koncie). Sekwencyjnie w jednym runnerze = jeden narzut zamiast trzech. `fail-fast: false`
  # zachowane przez `|| fail=1` + `exit $fail` — wszystkie moduły próbują się zbudować, raport zbiorczy.
  gradle:
    name: Gradle — every module of gradle/maven-modules.txt
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        id: toolchain
        with:
          distribution: temurin
          java-version: "27"
      - name: Register consumer toolchain
        env:
          TOOLCHAIN_JAVA_HOME: ${{ steps.toolchain.outputs.path }}
        run: |
          mkdir -p "$HOME/.gradle"
          echo "org.gradle.java.installations.paths=$TOOLCHAIN_JAVA_HOME" >> "$HOME/.gradle/gradle.properties"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Build wszystkich modułów
        run: |
          set -uo pipefail
          fail=0
          while read -r m; do
            echo "::group::gradle/$m — build"
            ( cd "gradle/$m" && chmod +x ./gradlew && ./gradlew --no-daemon build ) < /dev/null || fail=1
            echo "::endgroup::"
          done < <(awk '!/^#/ && NF { print $1 }' gradle/maven-modules.txt)
          exit $fail

  # Obraz z templates/Dockerfile.backend naprawdę się buduje i zdrowieje (N-CAP-5): jar startera spring-app
  # z Platform tego commita (lokalne repo Maven), z actuatorem dołożonym do kopii, bo sam starter go nie ma.
  runtime-image:
    name: Runtime image — templates/Dockerfile.backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        id: toolchain
        with:
          distribution: temurin
          java-version: "27"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"
      - name: Build the spring-app starter on this commit
        env:
          TOOLCHAIN_JDK: ${{ steps.toolchain.outputs.path }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.gradle"
          echo "org.gradle.java.installations.paths=$TOOLCHAIN_JDK" >> "$HOME/.gradle/gradle.properties"
          repo="$RUNNER_TEMP/platform-repo"
          # Z gradle/maven-modules.txt tylko to, co rozwiązuje starter spring-app: konwencje, katalog i platform-bom.
          awk '!/^#/ && NF && $1 ~ /^(build-logic|catalog|bom)$/ { print $1 }' gradle/maven-modules.txt | while IFS= read -r module; do
            (cd "gradle/$module" && ./gradlew --no-daemon -PplatformBundleRepository="$repo" publishAllPublicationsToBundleRepository)
          done
          app="$RUNNER_TEMP/spring-app"
          cp -R templates/jvm/spring-app "$app"
          cp -R templates/jvm/java-library/gradlew templates/jvm/java-library/gradle/wrapper "$app/"
          mkdir -p "$app/gradle" && mv "$app/wrapper" "$app/gradle/wrapper"
          sed -i 's|implementation(libs.boot.starter.webmvc)|&\n\timplementation("org.springframework.boot:spring-boot-starter-actuator")|' "$app/build.gradle.kts"
          (cd "$app" && ./gradlew --no-daemon bootJar -PplatformRepository="file://$repo")
          cp templates/Dockerfile.backend "$app/Dockerfile"
      - name: Build the layered image and wait for healthy
        run: |
          set -euo pipefail
          docker build -t platform-runtime-image:ci "$RUNNER_TEMP/spring-app"
          docker run -d --name platform-runtime-image platform-runtime-image:ci > /dev/null
          for _ in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' platform-runtime-image)
            [ "$status" = healthy ] && break
            [ "$status" = unhealthy ] && break
            sleep 5
          done
          docker logs platform-runtime-image 2>&1 | tail -20
          [ "$status" = healthy ] || { echo "::error::the image of templates/Dockerfile.backend did not become healthy ($status)"; exit 1; }
          echo "templates/Dockerfile.backend: layered image healthy"

  # Decyzja 28: własne moduły Java Platform w SonarQube Cloud, jak konsumenci (zasada 8, quality-conventions).
  # Bez sekretu SONAR_TOKEN (fork, brak projektu w SonarCloud) krok kończy się notką i nic nie robi.
  sonar:
    name: SonarQube Cloud — test-fixtures and security-starter
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0 # blame i nowy kod w SonarCloud potrzebują historii
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Analyse with SonarQube Cloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SONAR_TOKEN:-}" ]; then
            echo "::notice::SONAR_TOKEN is not set, so the SonarQube Cloud analysis is skipped."
            exit 0
          fi
          for m in test-fixtures security-starter; do
            echo "::group::gradle/$m — sonar"
            ( cd "gradle/$m" && ./gradlew --no-daemon build sonar )
            echo "::endgroup::"
          done

  # Jawna walidacja gradle-wrapper.jar każdego modułu wobec sum publikowanych przez Gradle. setup-gradle
  # robi to domyślnie także w innych jobach, ale Scorecard (Binary-Artifacts) uznaje wyłącznie tę akcję.
  # Release woła ci.yml jako `verify`, więc walidacja bramkuje też wydania.
  wrapper-validation:
    name: Gradle wrapper validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

  # Każdy śledzony skrypt shell, także kopiowane do konsumentów i uruchamiane na hoście deployu (deploy-remote.sh).
  # shellcheck jest preinstalowany na ubuntu-latest; --severity=warning: uwagi informacyjne nie bramkują.
  shellcheck:
    name: Shellcheck — every tracked script
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: shellcheck -x --severity=warning
        run: git ls-files -z '*.sh' | xargs -0 shellcheck -x --severity=warning

  # Piny akcji kontra prawdziwy GitHub: SHA = commit taga z komentarza `# vX.Y.Z`, nie obiekt annotated taga,
  # który Scorecard odrzuca przy publikacji jako „imposter commit”. Logikę na atrapie gh pilnuje
  # scripts/check-action-pins.test.sh (job templates).
  action-pins:
    name: Action pins — commits of their tags
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: scripts/check-action-pins.sh
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-action-pins.sh

  # Walidator configów Renovate w przypiętej wersji (jak semgrep-version w semgrep.yml): zepsuty preset
  # trafiłby do każdego konsumenta przez `extends`. Wersja >= 2 tygodnie od wydania.
  renovate-config:
    name: Renovate — validate the preset and Platform's config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
      - name: renovate-config-validator --strict
        run: npx --yes --package renovate@44.132.5 -- renovate-config-validator --strict renovate.json default.json

  # Reusable backend-ci uruchomiony tu, zanim zrobi to konsument: na starterze java-library z jego wrapperem
  # i publikowanym pinem platformVersion, więc idzie prawdziwą ścieżką konsumenta (dwa setup-java, rejestracja
  # toolchainu 27, GitHub Packages przez GITHUB_TOKEN, upload raportów). Wydanie woła ci.yml jako verify,
  # więc ten job bramkuje też publikację.
  backend-ci-smoke:
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/backend-ci.yml
    with:
      working-directory: templates/jvm/java-library
      gradle-task: build

  # Reusable api-contract na prawdziwym oasdiff: para zgodna musi dać breaking=false, para łamiąca
  # breaking=true. Para łamiąca idzie z fail-on-breaking: false, żeby wynik sprawdzał job niżej, a nie
  # czerwony status. Logikę kroków na stubie pilnuje templates/tests/api-contract.test.sh.
  api-contract-compatible:
    uses: ./.github/workflows/api-contract.yml
    with:
      spec-path: templates/tests/fixtures/openapi/compatible.yaml
      base-spec-path: templates/tests/fixtures/openapi/base.yaml

  api-contract-breaking:
    uses: ./.github/workflows/api-contract.yml
    with:
      spec-path: templates/tests/fixtures/openapi/breaking.yaml
      base-spec-path: templates/tests/fixtures/openapi/base.yaml
      fail-on-breaking: false

  api-contract-self-test:
    name: api-contract — self-test
    needs: [api-contract-compatible, api-contract-breaking]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          COMPATIBLE: ${{ needs.api-contract-compatible.outputs.breaking }}
          BREAKING: ${{ needs.api-contract-breaking.outputs.breaking }}
        run: |
          [ "$COMPATIBLE" = "false" ] || { echo "::error::the compatible pair reported breaking=$COMPATIBLE"; exit 1; }
          [ "$BREAKING" = "true" ] || { echo "::error::the breaking pair reported breaking=$BREAKING"; exit 1; }

  # Tytuł PR-a w formie Conventional Commit, tym samym wzorcem co message wydania w release.sh (jedno źródło);
  # notatki (scripts/release-notes.sh) grupują tematy po typie, a "ci fix" nie mówi, co się zmieniło.
  pr-title:
    name: PR title — Conventional Commit
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: release.sh
          sparse-checkout-cone-mode: false
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern=$(sed -n "s/^CONVENTIONAL='\(.*\)'$/\1/p" release.sh)
          [ -n "$pattern" ] || { echo "::error::release.sh defines no CONVENTIONAL pattern"; exit 1; }
          if ! grep -Eq "$pattern" <<<"$TITLE"; then
            echo "::error::The pull request title must be a Conventional Commit, for example \"fix(versions): keep the lockfile\" (got \"$TITLE\")."
            exit 1
          fi

  templates:
    name: Templates — testy skryptów
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # Każdy śledzony *.test.sh poza frontend/ (tamte odpala `pnpm -r test`) — nowy test nie
      # wymaga dopisania do listy. Wszystkie biegną do końca, wynik zbiorczy jak w jobie gradle.
      - name: Wszystkie testy skryptów
        run: |
          set -uo pipefail
          mapfile -t tests < <(git ls-files '*.test.sh' ':!:frontend/**')
          [ "${#tests[@]}" -gt 0 ] || { echo "::error::Nie znaleziono żadnego *.test.sh"; exit 1; }
          fail=0
          for test in "${tests[@]}"; do
            echo "::group::$test"
            bash "$test" || { echo "::error file=$test::$test nie przeszedł"; fail=1; }
            echo "::endgroup::"
          done
          exit $fail

  # Dwie nogi: Node 24 (wersja Platform) i 22.13.0 — dolna granica engines.node paczek, którą konsumenci mogą
  # uruchamiać; bez tej nogi deklarowana granica nigdy nie była wykonywana (N-REL-4).
  frontend:
    name: Frontend (Node ${{ matrix.node }}) — install + lint + typecheck + test + registry build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22.13.0", "24"]
    defaults:
      run:
        working-directory: frontend
    # Bez GITHUB_TOKEN: lockfile ciągnie wyłącznie publiczne paczki npm, a job uruchamia kod zależności.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.18.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
      # --ignore-scripts: żadna paczka w monorepo ani w jej drzewie zależności nie wymaga
      # skryptu lifecycle (binaria napi/sharp przychodzą jako optionalDependencies).
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm -r --if-present test
      # Zepsuty rejestr czerwieni PR, zamiast wyjść dopiero przy wydaniu.
      - name: Build registry (shadcn)
        run: pnpm --filter @dominiksienkiewicz/ui build
      - name: Record the Node version
        env:
          NODE_LEG: ${{ matrix.node }}
        run: echo "Frontend workspace passed on Node $(node --version) (leg $NODE_LEG)." >> "$GITHUB_STEP_SUMMARY"
