name: CI

# Walidacja pushy do main i PR-ów: czy build-logic / catalog / test-fixtures kompilują się
# na JDK 25, czy paczki frontendu instalują się + lintują i czy testy skryptów szablonowych
# (templates/tests) przechodzą. (Publish robi osobno release.yml.)
# Filtr branches jest celowy: bez niego CI odpala się też na tagach (v1.3.2, ruchomy v1),
# czyli 3× na każde wydanie — ten sam commit jest już zwalidowany przez push do main.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Trzy moduły (build-logic, catalog, test-fixtures) w JEDNYM jobie zamiast matrix po 3.
  # Każdy jest krótki (~40 s), a matrix powielał stały narzut (checkout + setup-java + setup-gradle)
  # ×3 i naliczał 3 pełne minuty za ~2 min realnej pracy (najgorszy stosunek podatku od zaokrąglania
  # w całym koncie). Sekwencyjnie w jednym runnerze = jeden narzut zamiast trzech. `fail-fast: false`
  # zachowane przez `|| fail=1` + `exit $fail` — wszystkie moduły próbują się zbudować, raport zbiorczy.
  gradle:
    name: Gradle — build-logic + catalog + test-fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Build wszystkich modułów
        run: |
          set -uo pipefail
          fail=0
          for m in build-logic catalog test-fixtures; do
            echo "::group::gradle/$m — build"
            ( cd "gradle/$m" && chmod +x ./gradlew && ./gradlew --no-daemon build ) || fail=1
            echo "::endgroup::"
          done
          exit $fail

  templates:
    name: Templates — testy skryptów
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: bash templates/tests/platform-bump.test.sh
      - run: bash templates/tests/container-scan-skip.test.sh

  frontend:
    name: Frontend — install + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 9
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm -r --if-present lint
