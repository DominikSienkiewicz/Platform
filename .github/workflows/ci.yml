name: CI

# Walidacja pushy do main i PR-ów: czy build-logic / catalog / test-fixtures kompilują się
# na JDK 25, czy paczki frontendu instalują się + lintują i czy testy skryptów szablonowych
# (templates/tests) przechodzą. (Publish robi osobno release.yml.)
# Filtr branches jest celowy: bez niego CI odpala się też na tagach (v1.3.2, ruchomy v1),
# czyli 3× na każde wydanie — ten sam commit jest już zwalidowany przez push do main.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gradle:
    name: Gradle — ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [build-logic, catalog, test-fixtures]
    defaults:
      run:
        working-directory: gradle/${{ matrix.module }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Build
        run: chmod +x ./gradlew && ./gradlew --no-daemon build

  templates:
    name: Templates — testy skryptów
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: bash templates/tests/platform-bump.test.sh
      - run: bash templates/tests/container-scan-skip.test.sh

  frontend:
    name: Frontend — install + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 9
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm -r --if-present lint
