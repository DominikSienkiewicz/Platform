name: CI

# Walidacja pushy do main i PR-ów: czy build-logic / catalog / test-fixtures kompilują się
# na JDK 25, czy paczki frontendu instalują się, przechodzą ESLint i tsc (checkJs, deklaracje .d.ts,
# testy typów, rejestr .tsx), własne testy i budują rejestr shadcn oraz czy przechodzą wszystkie
# śledzone testy skryptów (*.test.sh poza frontend/).
# Filtr branches jest celowy: bez niego CI odpala się też na tagach (v1.3.2, ruchomy v1).
# Wydanie nie polega na wyniku pushu do main: release.yml woła ten workflow przez workflow_call
# (job `verify`) na otagowanym commicie i publikuje dopiero po jego zielonym wyniku.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# github.workflow rozdziela wywołanie z Release od zwykłego CI na tym samym refie.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Moduły publikowane do Maven są sprawdzane sekwencyjnie w jednym jobie.
  # Każdy jest krótki (~40 s), a matrix powielał stały narzut (checkout + setup-java + setup-gradle)
  # ×3 i naliczał 3 pełne minuty za ~2 min realnej pracy (najgorszy stosunek podatku od zaokrąglania
  # w całym koncie). Sekwencyjnie w jednym runnerze = jeden narzut zamiast trzech. `fail-fast: false`
  # zachowane przez `|| fail=1` + `exit $fail` — wszystkie moduły próbują się zbudować, raport zbiorczy.
  gradle:
    name: Gradle — build-logic + catalog + test-fixtures + security-starter
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        id: toolchain
        with:
          distribution: temurin
          java-version: "27"
      - name: Register consumer toolchain
        env:
          TOOLCHAIN_JAVA_HOME: ${{ steps.toolchain.outputs.path }}
        run: |
          mkdir -p "$HOME/.gradle"
          echo "org.gradle.java.installations.paths=$TOOLCHAIN_JAVA_HOME" >> "$HOME/.gradle/gradle.properties"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Build wszystkich modułów
        run: |
          set -uo pipefail
          fail=0
          for m in build-logic catalog test-fixtures security-starter; do
            echo "::group::gradle/$m — build"
            ( cd "gradle/$m" && chmod +x ./gradlew && ./gradlew --no-daemon build ) || fail=1
            echo "::endgroup::"
          done
          exit $fail

  # Jawna walidacja gradle-wrapper.jar każdego modułu wobec sum publikowanych przez Gradle. setup-gradle
  # robi to domyślnie także w innych jobach, ale Scorecard (Binary-Artifacts) uznaje wyłącznie tę akcję.
  # Release woła ci.yml jako `verify`, więc walidacja bramkuje też wydania.
  wrapper-validation:
    name: Gradle wrapper validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

  # Każdy śledzony skrypt shell, także kopiowane do konsumentów i uruchamiane na hoście deployu (deploy-remote.sh).
  # shellcheck jest preinstalowany na ubuntu-latest; --severity=warning: uwagi informacyjne nie bramkują.
  shellcheck:
    name: Shellcheck — every tracked script
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: shellcheck -x --severity=warning
        run: git ls-files -z '*.sh' | xargs -0 shellcheck -x --severity=warning

  # Walidator configów Renovate w przypiętej wersji (jak semgrep-version w semgrep.yml): zepsuty preset
  # trafiłby do każdego konsumenta przez `extends`. Wersja >= 2 tygodnie od wydania.
  renovate-config:
    name: Renovate — validate the preset and Platform's config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
      - name: renovate-config-validator --strict
        run: npx --yes --package renovate@44.132.5 -- renovate-config-validator --strict renovate.json default.json

  templates:
    name: Templates — testy skryptów
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # Każdy śledzony *.test.sh poza frontend/ (tamte odpala `pnpm -r test`) — nowy test nie
      # wymaga dopisania do listy. Wszystkie biegną do końca, wynik zbiorczy jak w jobie gradle.
      - name: Wszystkie testy skryptów
        run: |
          set -uo pipefail
          mapfile -t tests < <(git ls-files '*.test.sh' ':!:frontend/**')
          [ "${#tests[@]}" -gt 0 ] || { echo "::error::Nie znaleziono żadnego *.test.sh"; exit 1; }
          fail=0
          for test in "${tests[@]}"; do
            echo "::group::$test"
            bash "$test" || { echo "::error file=$test::$test nie przeszedł"; fail=1; }
            echo "::endgroup::"
          done
          exit $fail

  frontend:
    name: Frontend — install + lint + typecheck + test + registry build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    # Bez GITHUB_TOKEN: lockfile ciągnie wyłącznie publiczne paczki npm, a job uruchamia kod zależności.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.18.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
      # --ignore-scripts: żadna paczka w monorepo ani w jej drzewie zależności nie wymaga
      # skryptu lifecycle (binaria napi/sharp przychodzą jako optionalDependencies).
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm -r --if-present test
      # Zepsuty rejestr czerwieni PR, zamiast wyjść dopiero przy wydaniu.
      - name: Build registry (shadcn)
        run: pnpm --filter @dominiksienkiewicz/ui build
