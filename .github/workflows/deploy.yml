name: Deploy (reusable)

# Reusable deploy = UNIA najlepszych cech release.yml (SSP) i deploy.yml (BoS):
#   • preflight walidujący sekrety/zmienne ZANIM ruszy build          (z SSP)
#   • build obrazów przez docker/build-push-action (cache, provenance) (z SSP)
#   • idempotencja: pomiń tag, który już jest w GHCR (docker manifest) (z BoS)
#   • workflow_dispatch — ręczny re-deploy                            (z BoS)
#   • environment: production — druga bramka (required reviewer)        (z BoS)
#   • SSH z PINOWANYM known_hosts — naprawia regresję host-key w BoS   (z SSP); przypięty przy bootstrapie,
#     sprawdzony względem SSH_HOST_KEY_SHA256, gdy go podano (templates/setup-gh-deploy.sh)
#   • logika on-box w jednym źródle: Platform/scripts/deploy-remote.sh (wzorzec SSP, bez duplikatu w repo)
#
# Wołane z cienkiego callera z jawnymi sekretami (nie `inherit`) — snippet w docs/reusable-workflows.md:
#   uses: DominikSienkiewicz/Platform/.github/workflows/deploy.yml@vX.Y.Z
#   secrets: { GPR_USER: ${{ secrets.GPR_USER }}, GPR_KEY: ${{ secrets.GPR_KEY }}, … }
# Różnice między repo idą przez `with:` (app-name, compose-dir, has-worker, migrate-*).

on:
  workflow_call:
    inputs:
      app-name:
        description: "Image name prefix, e.g. skillsprintplus or bookofstyling."
        type: string
        required: true
      compose-dir:
        description: "Directory with the compose file and the Caddyfile on the host (e.g. '.' or 'infra')."
        type: string
        default: "."
      has-worker:
        description: "Also build the <app>-eval-worker image."
        type: boolean
        default: false
      migrate-image-suffix:
        description: "Suffix of the migration image (e.g. 'migrate' or 'db-migrate')."
        type: string
        default: "migrate"
      migrate-tag-source:
        description: "Tag of the migration image: 'backend' (the backend version) or 'changelog' (the changelog number)."
        type: string
        default: "backend"
      java-version:
        description: "JDK that runs Gradle. Platform's build-logic is compiled for Java 25, so Gradle must run on 25 or newer."
        type: string
        default: "25"
      toolchain-java-version:
        description: "Toolchain JDK that seniordev.java-conventions compiles with; installed by setup-java, not Foojay."
        type: string
        default: "27"
      has-migrate:
        description: "Build and run a separate migration image. Use false for applications that migrate on start (Flyway)."
        type: boolean
        default: true
      scan-images:
        description: "Scan the pushed images before deploying (Grype gate, optional Snyk). Opt-in."
        type: boolean
        default: false
      scan-severity:
        description: "Grype fail threshold for scan-images."
        type: string
        default: high
      compose-file:
        description: "Compose file name in compose-dir."
        type: string
        default: "docker-compose.prod.yml"
      base-env:
        description: "Base env file on the host; empty picks .env.prod, then .env."
        type: string
        default: ""
      platform-ref:
        description: "Ref of DominikSienkiewicz/Platform that scripts/deploy-remote.sh is taken from; set it to the tag pinned in uses:."
        type: string
        default: "v1"
    # Wszystkie required: false — brak wymaganego sekretu zgłasza preflight czytelnym błędem, zanim ruszy build.
    # Zmienne GHCR_OWNER i DEPLOY_PATH idą z kontekstu `vars` callera.
    secrets:
      GPR_USER:
        description: "GitHub user owning GPR_KEY; the bootJar build resolves Platform's Gradle packages with them."
        required: false
      GPR_KEY:
        description: "Classic PAT with read:packages for Platform's Gradle packages in the bootJar build."
        required: false
      NPM_GH_TOKEN:
        description: "Classic PAT with read:packages, passed to the frontend image build as a BuildKit secret."
        required: false
      SSH_HOST:
        description: "Host the deploy job connects to over SSH."
        required: false
      SSH_USER:
        description: "SSH user on the deploy host."
        required: false
      SSH_KEY:
        description: "Private SSH key of SSH_USER."
        required: false
      SSH_KNOWN_HOSTS:
        description: "known_hosts entry of SSH_HOST, pinned at bootstrap by templates/setup-gh-deploy.sh."
        required: false
      SNYK_TOKEN:
        description: "Snyk token for the advisory image scan. Without it the Snyk steps are skipped; Grype stays the gate."
        required: false

concurrency:
  group: deploy-${{ inputs.app-name }}
  cancel-in-progress: false # nie przerywaj trwającego deployu

# W reusable workflow blok top-level tylko zawęża to, co przyznał caller; joby dostają resztę jawnie.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  # ---- Fail-fast: ujawnij brakującą konfigurację ZANIM ruszy build/deploy ----
  preflight:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Sprawdź wymagane sekrety i zmienne
        env:
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_KEY: ${{ secrets.GPR_KEY }}
          NPM_GH_TOKEN: ${{ secrets.NPM_GH_TOKEN }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          GHCR_OWNER: ${{ vars.GHCR_OWNER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          missing=()
          for v in GPR_USER GPR_KEY NPM_GH_TOKEN SSH_HOST SSH_USER SSH_KEY SSH_KNOWN_HOSTS GHCR_OWNER DEPLOY_PATH; do
            [ -z "${!v}" ] && missing+=("$v")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Brakuje sekretów/zmiennych: ${missing[*]} — ustaw je (runbook §B)."
            exit 1
          fi
          echo "Preflight OK."

  # ---- Wersje warstw = source of truth dla tagów obrazów ----
  versions:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      owner: ${{ steps.v.outputs.owner }}
      backend: ${{ steps.v.outputs.backend }}
      frontend: ${{ steps.v.outputs.frontend }}
      migrate: ${{ steps.v.outputs.migrate }}
      worker: ${{ steps.v.outputs.backend }} # worker sprzężony z backendem
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - id: v
        shell: bash
        env:
          GHCR_OWNER: ${{ vars.GHCR_OWNER || github.repository_owner }}
          MIGRATE_TAG_SOURCE: ${{ inputs.migrate-tag-source }}
        run: |
          set -euo pipefail
          owner="$(echo "$GHCR_OWNER" | tr '[:upper:]' '[:lower:]')"
          backend="$(grep -E '^version=' backend/gradle.properties | head -1 | cut -d= -f2 | tr -d '[:space:]')"
          frontend="$(node -p "require('./frontend/package.json').version")"
          if [ "$MIGRATE_TAG_SOURCE" = "changelog" ]; then
            migrate="$(find backend/src/main/resources/db/changelog/changes -mindepth 1 -maxdepth 1 -printf '%f\n' 2>/dev/null | grep -oE '^[0-9]{4}' | sort | tail -1)"
          else
            migrate="$backend"
          fi
          { echo "owner=$owner"; echo "backend=$backend"; echo "frontend=$frontend"; echo "migrate=$migrate"; } | tee -a "$GITHUB_OUTPUT"

  # ---- Build + push: build-push-action (z SSP) + idempotentny skip istniejącego tagu (z BoS) ----
  build-push:
    needs: versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      OWNER: ${{ needs.versions.outputs.owner }}
      APP: ${{ inputs.app-name }}
      BACKEND_VER: ${{ needs.versions.outputs.backend }}
      FRONTEND_VER: ${{ needs.versions.outputs.frontend }}
      MIGRATE_VER: ${{ needs.versions.outputs.migrate }}
    steps:
      # Bez zapisanego tokenu: ten job trzyma packages: write, a dalej buduje kod repo.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      # Toolchain JDK z setup-java (API Adoptium), nie z Foojay: 2026-09-25 Foojay indeksował Temurin 27
      # dla linuksa tylko jako build Alpine (musl), resolver wybierał go na runnerze glibc i Gradle
      # odrzucał rozpakowane archiwum. Jawna ścieżka w installations.paths omija provisioning.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        id: toolchain-jdk
        with:
          distribution: temurin
          java-version: ${{ inputs.toolchain-java-version }}
      - name: Expose the toolchain JDK to Gradle
        env:
          TOOLCHAIN_JDK: ${{ steps.toolchain-jdk.outputs.path }}
        run: |
          mkdir -p "${GRADLE_USER_HOME:-$HOME/.gradle}"
          echo "org.gradle.java.installations.paths=$TOOLCHAIN_JDK" >> "${GRADLE_USER_HOME:-$HOME/.gradle}/gradle.properties"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      # Które tagi już są w GHCR -> pomijamy rebuild (oszczędność minut, brak nadpisania :wersja).
      - id: exists
        shell: bash
        env:
          MIGRATE_IMAGE_SUFFIX: ${{ inputs.migrate-image-suffix }}
        run: |
          set -euo pipefail
          chk() { docker manifest inspect "$1" >/dev/null 2>&1 && echo true || echo false; }
          {
            echo "backend=$(chk "$REGISTRY/$OWNER/$APP-backend:$BACKEND_VER")"
            echo "frontend=$(chk "$REGISTRY/$OWNER/$APP-frontend:$FRONTEND_VER")"
            echo "migrate=$(chk "$REGISTRY/$OWNER/$APP-$MIGRATE_IMAGE_SUFFIX:$MIGRATE_VER")"
            echo "worker=$(chk "$REGISTRY/$OWNER/$APP-eval-worker:$BACKEND_VER")"
          } | tee -a "$GITHUB_OUTPUT"

      # bootJar potrzebny do obrazów backend/worker (pluginy Platform z GH Packages -> PAT).
      - name: Build bootJar
        if: steps.exists.outputs.backend == 'false' || (inputs.has-worker && steps.exists.outputs.worker == 'false')
        working-directory: backend
        env:
          GITHUB_ACTOR: ${{ secrets.GPR_USER || github.actor }}
          GITHUB_TOKEN: ${{ secrets.GPR_KEY || secrets.GITHUB_TOKEN }}
        run: ./gradlew bootJar --no-daemon

      - name: Build & push — backend
        if: steps.exists.outputs.backend == 'false'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.APP }}-backend:${{ env.BACKEND_VER }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.APP }}-backend:latest

      - name: Build & push — migrate
        if: inputs.has-migrate && steps.exists.outputs.migrate == 'false'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: backend
          file: backend/migrate/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.APP }}-${{ inputs.migrate-image-suffix }}:${{ env.MIGRATE_VER }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.APP }}-${{ inputs.migrate-image-suffix }}:latest

      - name: Build & push — eval-worker
        if: inputs.has-worker && steps.exists.outputs.worker == 'false'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: backend/eval-worker
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.APP }}-eval-worker:${{ env.BACKEND_VER }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.APP }}-eval-worker:latest

      - name: Build & push — frontend (token npm jako BuildKit secret; id-ki gh_token + github_token)
        if: steps.exists.outputs.frontend == 'false'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          secrets: |
            gh_token=${{ secrets.NPM_GH_TOKEN }}
            github_token=${{ secrets.NPM_GH_TOKEN }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.APP }}-frontend:${{ env.FRONTEND_VER }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.APP }}-frontend:latest

      # ---- Opt-in gate: skan obrazów PO push, PRZED deployem. Grype-fail => job pada => deploy się nie ruszy.
      #      Base-image OS CVE, tylko fixowalne. Snyk (druga opinia) biegnie w osobnym jobie snyk-advisory.
      - name: Grype scan — backend (gate)
        if: ${{ inputs.scan-images }}
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.APP }}-backend:${{ env.BACKEND_VER }}
          fail-build: true
          severity-cutoff: ${{ inputs.scan-severity }}
          only-fixed: true
          output-format: table
      - name: Grype scan — frontend (gate)
        if: ${{ inputs.scan-images }}
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.APP }}-frontend:${{ env.FRONTEND_VER }}
          fail-build: true
          severity-cutoff: ${{ inputs.scan-severity }}
          only-fixed: true
          output-format: table

  # ---- Snyk: druga opinia, nieblokująca, pomijana bez SNYK_TOKEN. Osobny job, bo obraz Snyka dostaje gniazdo
  #      Dockera hosta: tu może co najwyżej CZYTAĆ GHCR, a w build-push miałby packages: write tuż przed
  #      deployem. Deploy na ten job nie czeka.
  snyk-advisory:
    needs: [versions, build-push]
    if: ${{ inputs.scan-images }}
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_PREFIX: ghcr.io/${{ needs.versions.outputs.owner }}/${{ inputs.app-name }}
      BACKEND_VER: ${{ needs.versions.outputs.backend }}
      FRONTEND_VER: ${{ needs.versions.outputs.frontend }}
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      # Obraz przypięty digestem, CLI wbudowany przy budowie (snyk/snyk-images 54dbb8b, stan 2026-10-18).
      # Lustro: container-scan.yml.
      SNYK_IMAGE: snyk/snyk:docker@sha256:d6595337edef7ce37eded247b8bb47ebb60681fd802c49e64c1b80b3a6963187
    steps:
      - name: Log in to GHCR
        if: ${{ env.SNYK_TOKEN != '' }}
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - name: Snyk scan (advisory)
        if: ${{ env.SNYK_TOKEN != '' }}
        run: |
          set -uo pipefail
          for image in "$IMAGE_PREFIX-backend:$BACKEND_VER" "$IMAGE_PREFIX-frontend:$FRONTEND_VER"; do
            docker pull "$image"
            docker run --rm -e SNYK_TOKEN -v /var/run/docker.sock:/var/run/docker.sock \
              "$SNYK_IMAGE" snyk container test "$image" --severity-threshold=high \
              || echo "::warning title=Snyk (advisory)::Snyk reported issues in $image"
          done

  # ---- Deploy on-box: SSH z PINOWANYM known_hosts; logika w Platform/scripts/deploy-remote.sh ----
  deploy:
    needs: [versions, build-push]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: production # druga bramka (required reviewer) na szczycie merge'a PR
    env:
      OWNER: ${{ needs.versions.outputs.owner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 — repo wołające: compose + Caddyfile
        with:
          persist-credentials: false

      # Platform jest publiczny: checkout bez tokenu, więc PAT konsumenta nie ląduje w _platform/.git/config
      # joba z dostępem SSH do produkcji. platform-ref = tag z `uses:`, żeby workflow i skrypt były z jednej wersji.
      - name: Pobierz deploy-remote.sh z Platform (jedno źródło prawdy, bez duplikatu w repo)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: DominikSienkiewicz/Platform
          ref: ${{ inputs.platform-ref }}
          path: _platform
          persist-credentials: false

      - name: Plik z tagami (.env.deploy) — aliasy *_TAG i *_VER (compose SSP używa TAG, BoS VER)
        run: |
          {
            echo "GHCR_OWNER=${{ env.OWNER }}"
            echo "BACKEND_TAG=${{ needs.versions.outputs.backend }}"
            echo "BACKEND_VER=${{ needs.versions.outputs.backend }}"
            echo "FRONTEND_TAG=${{ needs.versions.outputs.frontend }}"
            echo "FRONTEND_VER=${{ needs.versions.outputs.frontend }}"
            echo "WORKER_TAG=${{ needs.versions.outputs.worker }}"
            echo "MIGRATE_TAG=${{ needs.versions.outputs.migrate }}"
            echo "MIGRATE_VER=${{ needs.versions.outputs.migrate }}"
          } > .env.deploy

      # known_hosts przypięty przy bootstrapie; setup-gh-deploy.sh sprawdza go względem SSH_HOST_KEY_SHA256, gdy podano.
      - name: Konfiguracja SSH (known_hosts PINOWANE)
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Wgranie artefaktów na boks (DEPLOY_PATH)
        env:
          COMPOSE_DIR: ${{ inputs.compose-dir }}
          COMPOSE_FILE: ${{ inputs.compose-file }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          files=("$COMPOSE_DIR/$COMPOSE_FILE" .env.deploy _platform/scripts/deploy-remote.sh)
          # Caddyfile opcjonalny — aplikacje bez reverse-proxy (np. health-check wprost na backend) go nie mają.
          [ -f "$COMPOSE_DIR/Caddyfile" ] && files+=("$COMPOSE_DIR/Caddyfile")
          scp -i ~/.ssh/id_ed25519 "${files[@]}" "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      - name: Deploy (migracje -> backend -> frontend -> caddy, warunkowo + health-gate)
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          COMPOSE_FILE: ${{ inputs.compose-file }}
          BASE_ENV: ${{ inputs.base-env }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" \
            "cd '$DEPLOY_PATH' && COMPOSE_FILE='$COMPOSE_FILE' BASE_ENV='$BASE_ENV' bash deploy-remote.sh"
