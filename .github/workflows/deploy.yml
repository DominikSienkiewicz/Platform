name: Deploy (reusable)

# Reusable deploy = UNIA najlepszych cech release.yml (SSP) i deploy.yml (BoS):
#   • preflight walidujący sekrety/zmienne ZANIM ruszy build          (z SSP)
#   • build obrazów przez docker/build-push-action: cache warstw w GHA (scope na obraz, mode=max) i domyślna
#     atestacja provenance BuildKita (min, niepodpisana); bootJar z cache Gradle przez setup-gradle
#   • idempotencja: pomiń tag, który już jest w GHCR (docker manifest) (z BoS)
#   • workflow_dispatch — ręczny re-deploy                            (z BoS)
#   • environment: production — bramka: deployment branch policy `release` (tylko ta gałąź wdraża)
#     i sekrety SSH_* trzymane w tym environmencie, więc workflow z innej gałęzi ich nie przeczyta.
#     Zatwierdzania przez recenzenta nie ma: GitHub daje tę regułę prywatnym repo dopiero na Enterprise.
#   • SSH z PINOWANYM known_hosts — naprawia regresję host-key w BoS   (z SSP); przypięty przy bootstrapie,
#     sprawdzony względem SSH_HOST_KEY_SHA256, gdy go podano (templates/setup-gh-deploy.sh)
#   • logika on-box w jednym źródle: Platform/scripts/deploy-remote.sh (wzorzec SSP, bez duplikatu w repo)
#   • single-image: jeden obraz backendu z eksportem frontendu w jarze (npm ci + npm run build przed bootJar),
#     bez obrazu frontendu; tylko z ssh-deploy: false, jak w promote.yml, bo wdrożenie SSH stawia dwa obrazy
#   • scan-images: tag -> digest raz, potem bramki Grype i Trivy na tym digeście, a job sign podpisuje cosign keyless
#     dokładnie te digesty, dopiero gdy obie bramki przeszły (łańcuch dostaw, Kyverno verifyImages po stronie klastra)
#
# Wołane z cienkiego callera z jawnymi sekretami (nie `inherit`) — snippet w docs/reusable-workflows.md:
#   uses: DominikSienkiewicz/Platform/.github/workflows/deploy.yml@vX.Y.Z
#   secrets: { GPR_USER: ${{ secrets.GPR_USER }}, GPR_KEY: ${{ secrets.GPR_KEY }}, … }
# Różnice między repo idą przez `with:` (app-name, compose-dir, has-worker, migrate-*).

on:
  workflow_call:
    inputs:
      build-timeout-minutes:
        description: "Minutes before the build-push job is cancelled; GitHub's default is 360."
        type: number
        default: 30
      deploy-timeout-minutes:
        description: "Minutes before the deploy job (upload, migrations, health gate) is cancelled; GitHub's default is 360."
        type: number
        default: 20
      app-name:
        description: "Image name prefix, e.g. skillsprintplus or bookofstyling."
        type: string
        required: true
      compose-dir:
        description: "Directory with the compose file and the Caddyfile on the host (e.g. '.' or 'infra')."
        type: string
        default: "."
      has-worker:
        description: "Also build the <app>-eval-worker image."
        type: boolean
        default: false
      migrate-image-suffix:
        description: "Suffix of the migration image (e.g. 'migrate' or 'db-migrate')."
        type: string
        default: "migrate"
      migrate-tag-source:
        description: "Tag of the migration image: 'backend' (the backend version) or 'changelog' (the changelog number)."
        type: string
        default: "backend"
      java-version:
        description: "JDK that runs Gradle. Platform builds and tests its plugins with Gradle on Java 27 (ADR-0034), the only JDK it supports for Gradle."
        type: string
        default: "27"
      toolchain-java-version:
        description: "Toolchain JDK that seniordev.java-conventions compiles with; installed by setup-java, not Foojay."
        type: string
        default: "27"
      has-migrate:
        description: "Build and run a separate migration image. Use false for applications that migrate on start (Flyway)."
        type: boolean
        default: true
      scan-images:
        description: "Scan the pushed images by digest before deploying (Grype and Trivy gates, optional Snyk), then sign the scanned digests with cosign keyless; the caller grants id-token: write. Opt-in."
        type: boolean
        default: false
      scan-severity:
        description: "Fail threshold of the Grype and Trivy gates for scan-images: negligible, low, medium, high or critical."
        type: string
        default: high
      compose-file:
        description: "Compose file name in compose-dir."
        type: string
        default: "docker-compose.prod.yml"
      base-env:
        description: "Base env file on the host; empty picks .env.prod, then .env."
        type: string
        default: ""
      platform-ref:
        description: "Ref of DominikSienkiewicz/Platform that scripts/deploy-remote.sh is taken from; set it to the tag pinned in uses:."
        type: string
        default: "v1"
      ssh-deploy:
        description: "Deploy over SSH after the build. Set false to only build and scan the images, as promote.yml does; the SSH secrets and DEPLOY_PATH are then not required."
        type: boolean
        default: true
      single-image:
        description: "Build one image, for an application whose boot jar serves its frontend: npm ci and npm run build in frontend/ before bootJar, then only the backend image is built, scanned and pushed, and frontend-tag is empty. Requires ssh-deploy: false."
        type: boolean
        default: false
      rollback-to-backend:
        description: "Backend image tag already in GHCR to deploy again, for a rollback dispatch; empty deploys the version of the checkout. Either rollback input skips build-push."
        type: string
        default: ""
      rollback-to-frontend:
        description: "Frontend image tag already in GHCR to deploy again, for a rollback dispatch; empty deploys the version of the checkout. Either rollback input skips build-push."
        type: string
        default: ""
    outputs:
      backend-tag:
        description: "Tag of the backend image: the version of the checkout, or rollback-to-backend."
        value: ${{ jobs.versions.outputs.backend }}
      frontend-tag:
        description: "Tag of the frontend image: the version of the checkout, or rollback-to-frontend; empty with single-image."
        value: ${{ jobs.versions.outputs.frontend }}
    # Wszystkie required: false — brak wymaganego sekretu zgłasza preflight czytelnym błędem, zanim ruszy build.
    # Zmienne GHCR_OWNER i DEPLOY_PATH idą z kontekstu `vars` callera.
    secrets:
      GPR_USER:
        description: "GitHub user owning GPR_KEY; the bootJar build resolves Platform's Gradle packages with them."
        required: false
      GPR_KEY:
        description: "Classic PAT with read:packages for Platform's Gradle packages in the bootJar build."
        required: false
      NPM_GH_TOKEN:
        description: "Classic PAT with read:packages, passed to the frontend image build as a BuildKit secret."
        required: false
      SSH_HOST:
        description: "Host the deploy job connects to over SSH. Keep it a secret of the caller's production environment, which the deploy job reads; a passed value is ignored there."
        required: false
      SSH_USER:
        description: "SSH user on the deploy host. Keep it a secret of the caller's production environment, which the deploy job reads; a passed value is ignored there."
        required: false
      SSH_KEY:
        description: "Private SSH key of SSH_USER. Keep it a secret of the caller's production environment, which the deploy job reads; a passed value is ignored there."
        required: false
      SSH_KNOWN_HOSTS:
        description: "known_hosts entry of SSH_HOST, pinned at bootstrap by templates/setup-gh-deploy.sh. Keep it a secret of the caller's production environment, which the deploy job reads; a passed value is ignored there."
        required: false
      SNYK_TOKEN:
        description: "Snyk token for the advisory image scan. Without it the Snyk steps are skipped; Grype stays the gate."
        required: false

concurrency:
  group: deploy-${{ inputs.app-name }}
  cancel-in-progress: false # nie przerywaj trwającego deployu

# W reusable workflow blok top-level tylko zawęża to, co przyznał caller; joby dostają resztę jawnie.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  # ---- Fail-fast: ujawnij brakującą konfigurację ZANIM ruszy build/deploy ----
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Sprawdź wymagane sekrety i zmienne
        env:
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_KEY: ${{ secrets.GPR_KEY }}
          NPM_GH_TOKEN: ${{ secrets.NPM_GH_TOKEN }}
          GHCR_OWNER: ${{ vars.GHCR_OWNER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          SSH_DEPLOY: ${{ inputs.ssh-deploy }}
          SINGLE_IMAGE: ${{ inputs.single-image }}
        # SSH_* żyją w environmencie production, którego ten job nie widzi — sprawdza je pierwszy krok joba deploy.
        # Bez wdrożenia SSH (ssh-deploy: false) DEPLOY_PATH nie jest potrzebny.
        run: |
          # >>> preflight
          set -euo pipefail
          if [ "${SINGLE_IMAGE:-false}" = "true" ] && [ "$SSH_DEPLOY" = "true" ]; then
            echo "::error::single-image builds no frontend image, but the SSH deploy runs a backend and a frontend. Call deploy.yml with ssh-deploy: false, as promote.yml does."
            exit 1
          fi
          required=(GPR_USER GPR_KEY NPM_GH_TOKEN GHCR_OWNER)
          if [ "$SSH_DEPLOY" = "true" ]; then required+=(DEPLOY_PATH); fi
          missing=()
          for v in "${required[@]}"; do
            [ -n "${!v:-}" ] || missing+=("$v")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing secrets or variables: ${missing[*]}. Set them with templates/setup-gh-deploy.sh (docs/reusable-workflows.md, deploy.yml)."
            exit 1
          fi
          echo "Preflight OK."
          # <<< preflight

  # ---- Wersje warstw = source of truth dla tagów obrazów ----
  versions:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    outputs:
      owner: ${{ steps.v.outputs.owner }}
      backend: ${{ steps.v.outputs.backend }}
      frontend: ${{ steps.v.outputs.frontend }}
      migrate: ${{ steps.v.outputs.migrate }}
      worker: ${{ steps.v.outputs.backend }} # worker sprzężony z backendem
      rollback: ${{ steps.v.outputs.rollback }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - id: v
        shell: bash
        env:
          GHCR_OWNER: ${{ vars.GHCR_OWNER || github.repository_owner }}
          MIGRATE_TAG_SOURCE: ${{ inputs.migrate-tag-source }}
          ROLLBACK_BACKEND: ${{ inputs.rollback-to-backend }}
          ROLLBACK_FRONTEND: ${{ inputs.rollback-to-frontend }}
          SINGLE_IMAGE: ${{ inputs.single-image }}
        run: |
          # >>> versions
          set -euo pipefail
          owner="$(echo "$GHCR_OWNER" | tr '[:upper:]' '[:lower:]')"
          backend="$(grep -E '^version=' backend/gradle.properties | head -1 | cut -d= -f2 | tr -d '[:space:]')"
          frontend=""
          if [ "${SINGLE_IMAGE:-false}" != "true" ]; then
            frontend="$(node -p "require('./frontend/package.json').version")"
          fi
          # Rollback (N-REL-12): tag z wejścia zamiast wersji checkoutu; build-push wtedy nie rusza.
          backend="${ROLLBACK_BACKEND:-$backend}"
          frontend="${ROLLBACK_FRONTEND:-$frontend}"
          rollback=false
          if [ -n "${ROLLBACK_BACKEND}${ROLLBACK_FRONTEND}" ]; then rollback=true; fi
          if [ "$MIGRATE_TAG_SOURCE" = "changelog" ]; then
            migrate="$(find backend/src/main/resources/db/changelog/changes -mindepth 1 -maxdepth 1 -printf '%f\n' 2>/dev/null | grep -oE '^[0-9]{4}' | sort | tail -1)"
          else
            migrate="$backend"
          fi
          { echo "owner=$owner"; echo "backend=$backend"; echo "frontend=$frontend"; echo "migrate=$migrate"; echo "rollback=$rollback"; } | tee -a "$GITHUB_OUTPUT"
          # <<< versions
      # Rollback wdraża tylko istniejące obrazy: brak tagu w GHCR zatrzymuje go przed SSH na boks.
      - name: Check that the rollback tags exist in GHCR
        if: steps.v.outputs.rollback == 'true'
        env:
          OWNER: ${{ steps.v.outputs.owner }}
          APP: ${{ inputs.app-name }}
          ROLLBACK_BACKEND: ${{ inputs.rollback-to-backend }}
          ROLLBACK_FRONTEND: ${{ inputs.rollback-to-frontend }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin > /dev/null
          for image in ${ROLLBACK_BACKEND:+"$APP-backend:$ROLLBACK_BACKEND"} ${ROLLBACK_FRONTEND:+"$APP-frontend:$ROLLBACK_FRONTEND"}; do
            if ! docker manifest inspect "ghcr.io/$OWNER/$image" > /dev/null 2>&1; then
              echo "::error::ghcr.io/$OWNER/$image does not exist, so there is nothing to roll back to."
              exit 1
            fi
            echo "Rolling back to ghcr.io/$OWNER/$image"
          done

  # ---- Build + push: build-push-action (z SSP) + idempotentny skip istniejącego tagu (z BoS) ----
  build-push:
    needs: versions
    if: needs.versions.outputs.rollback != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.build-timeout-minutes }}
    permissions:
      contents: read
      packages: write
    # Same digesty obrazów, które przeszły bramki; referencje z właścicielem składa z nich job sign. GitHub pomija wyjście
    # joba, w którym jest wartość sekretu, a właściciel bywa wartością sekretu (GPR_USER konsumenta).
    outputs:
      backend-digest: ${{ steps.digests.outputs.backend-digest }}
      frontend-digest: ${{ steps.digests.outputs.frontend-digest }}
    env:
      OWNER: ${{ needs.versions.outputs.owner }}
      APP: ${{ inputs.app-name }}
      BACKEND_VER: ${{ needs.versions.outputs.backend }}
      FRONTEND_VER: ${{ needs.versions.outputs.frontend }}
      MIGRATE_VER: ${{ needs.versions.outputs.migrate }}
    steps:
      # Bez zapisanego tokenu: ten job trzyma packages: write, a dalej buduje kod repo.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      # Kanał deprecacji (N-REL-9): id sekretu BuildKit gh_token zostaje tylko do migracji na github_token,
      # które czyta templates/Dockerfile.frontend; usunięcie aliasu to akcja konsumenta w późniejszym MINOR.
      - name: Warn about the deprecated gh_token secret id
        run: |
          if [ -f frontend/Dockerfile ] && grep -q 'id=gh_token' frontend/Dockerfile; then
            echo "::warning title=Platform deprecation::[PLAT-DEPR-001] frontend/Dockerfile reads the BuildKit secret gh_token, deprecated since Platform 1.6.0; read github_token as templates/Dockerfile.frontend does."
          fi
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Toolchain JDK z setup-java (API Adoptium), nie z Foojay: 2026-09-25 Foojay indeksował Temurin 27
      # dla linuksa tylko jako build Alpine (musl), resolver wybierał go na runnerze glibc i Gradle
      # odrzucał rozpakowane archiwum. Jawna ścieżka w installations.paths omija provisioning.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        id: toolchain-jdk
        with:
          distribution: temurin
          java-version: ${{ inputs.toolchain-java-version }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
      # Jak w backend-ci: cache Gradle przed zapisem installations.paths. Na gałęzi `release` (nie domyślnej)
      # setup-gradle tylko czyta cache, który zapisały joby backendu konsumenta na main.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Expose the toolchain JDK to Gradle
        env:
          TOOLCHAIN_JDK: ${{ steps.toolchain-jdk.outputs.path }}
        run: |
          mkdir -p "${GRADLE_USER_HOME:-$HOME/.gradle}"
          echo "org.gradle.java.installations.paths=$TOOLCHAIN_JDK" >> "${GRADLE_USER_HOME:-$HOME/.gradle}/gradle.properties"

      # Które tagi już są w GHCR -> pomijamy rebuild (oszczędność minut, brak nadpisania :wersja).
      - id: exists
        shell: bash
        env:
          MIGRATE_IMAGE_SUFFIX: ${{ inputs.migrate-image-suffix }}
        run: |
          set -euo pipefail
          chk() { docker manifest inspect "$1" >/dev/null 2>&1 && echo true || echo false; }
          {
            echo "backend=$(chk "$REGISTRY/$OWNER/$APP-backend:$BACKEND_VER")"
            echo "frontend=$(chk "$REGISTRY/$OWNER/$APP-frontend:$FRONTEND_VER")"
            echo "migrate=$(chk "$REGISTRY/$OWNER/$APP-$MIGRATE_IMAGE_SUFFIX:$MIGRATE_VER")"
            echo "worker=$(chk "$REGISTRY/$OWNER/$APP-eval-worker:$BACKEND_VER")"
          } | tee -a "$GITHUB_OUTPUT"

      # single-image: jar backendu niesie eksport frontendu, który build konsumenta pakuje przy bootJar, więc eksport
      # powstaje przed nim. Token tylko w npm ci, jak w frontend-ci: npm run build to już kod zależności.
      - name: Set up Node for the frontend export
        if: ${{ inputs.single-image && steps.exists.outputs.backend == 'false' }}
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the frontend for the export
        if: ${{ inputs.single-image && steps.exists.outputs.backend == 'false' }}
        working-directory: frontend
        env:
          GITHUB_TOKEN: ${{ secrets.NPM_GH_TOKEN }}
        run: npm ci --ignore-scripts
      - name: Build the frontend export
        if: ${{ inputs.single-image && steps.exists.outputs.backend == 'false' }}
        working-directory: frontend
        run: npm run build

      # bootJar potrzebny do obrazów backend/worker (pluginy Platform z GH Packages -> PAT).
      - name: Build bootJar
        if: steps.exists.outputs.backend == 'false' || (inputs.has-worker && steps.exists.outputs.worker == 'false')
        working-directory: backend
        env:
          GITHUB_ACTOR: ${{ secrets.GPR_USER || github.actor }}
          GITHUB_TOKEN: ${{ secrets.GPR_KEY || secrets.GITHUB_TOKEN }}
        run: ./gradlew bootJar --no-daemon

      - name: Build & push — backend
        if: steps.exists.outputs.backend == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.APP }}-backend:${{ env.BACKEND_VER }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.APP }}-backend:latest
          cache-from: type=gha,scope=${{ inputs.app-name }}-backend
          cache-to: type=gha,mode=max,scope=${{ inputs.app-name }}-backend

      - name: Build & push — migrate
        if: inputs.has-migrate && steps.exists.outputs.migrate == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          file: backend/migrate/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.APP }}-${{ inputs.migrate-image-suffix }}:${{ env.MIGRATE_VER }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.APP }}-${{ inputs.migrate-image-suffix }}:latest
          cache-from: type=gha,scope=${{ inputs.app-name }}-migrate
          cache-to: type=gha,mode=max,scope=${{ inputs.app-name }}-migrate

      - name: Build & push — eval-worker
        if: inputs.has-worker && steps.exists.outputs.worker == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend/eval-worker
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.APP }}-eval-worker:${{ env.BACKEND_VER }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.APP }}-eval-worker:latest
          cache-from: type=gha,scope=${{ inputs.app-name }}-eval-worker
          cache-to: type=gha,mode=max,scope=${{ inputs.app-name }}-eval-worker

      - name: Build & push — frontend (token npm jako BuildKit secret; id-ki gh_token + github_token)
        if: ${{ !inputs.single-image && steps.exists.outputs.frontend == 'false' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          secrets: |
            gh_token=${{ secrets.NPM_GH_TOKEN }}
            github_token=${{ secrets.NPM_GH_TOKEN }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.APP }}-frontend:${{ env.FRONTEND_VER }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.APP }}-frontend:latest
          cache-from: type=gha,scope=${{ inputs.app-name }}-frontend
          cache-to: type=gha,mode=max,scope=${{ inputs.app-name }}-frontend

      # Cache warstw (cache-from/cache-to wyżej) dzieli limit 10 GB cache Actions repo konsumenta z cache Gradle;
      # GitHub usuwa najstarsze wpisy po przekroczeniu, więc przy rzadkich deployach to zysk, nie ryzyko.
      # Bramki i podpis dotyczą tych samych bajtów: tag z GHCR zamieniany na digest raz, potem wszystko po digeście.
      # Obraz pominięty jako już istniejący też dostaje digest, więc ponowny run po poprawionym wyjątku go podpisze.
      - name: Resolve the digests of the scanned images
        id: digests
        if: ${{ inputs.scan-images }}
        env:
          SINGLE_IMAGE: ${{ inputs.single-image }}
        run: |
          # >>> image-digests
          set -euo pipefail
          digest_of() { docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -er .digest; }
          backend_digest=$(digest_of "$REGISTRY/$OWNER/$APP-backend:$BACKEND_VER")
          backend="$REGISTRY/$OWNER/$APP-backend@$backend_digest"
          frontend="" frontend_digest=""
          if [ "${SINGLE_IMAGE:-false}" != "true" ]; then
            frontend_digest=$(digest_of "$REGISTRY/$OWNER/$APP-frontend:$FRONTEND_VER")
            frontend="$REGISTRY/$OWNER/$APP-frontend@$frontend_digest"
          fi
          { echo "backend=$backend"; echo "frontend=$frontend"; echo "images=$backend${frontend:+ $frontend}"
            echo "backend-digest=$backend_digest"; echo "frontend-digest=$frontend_digest"; } | tee -a "$GITHUB_OUTPUT"
          # <<< image-digests
      # ---- Opt-in gate: skan obrazów PO push, PRZED deployem i podpisem. Fail Grype albo Trivy => job pada => deploy
      #      się nie ruszy, a job sign nie podpisze obrazu, więc Kyverno go nie wpuści, choć leży w GHCR.
      #      Base-image OS CVE, tylko fixowalne. Snyk (druga opinia) biegnie w osobnym jobie snyk-advisory.
      - name: Grype scan — backend (gate)
        if: ${{ inputs.scan-images }}
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ steps.digests.outputs.backend }}
          fail-build: true
          severity-cutoff: ${{ inputs.scan-severity }}
          only-fixed: true
          output-format: table
      - name: Grype scan — frontend (gate)
        if: ${{ inputs.scan-images && !inputs.single-image }}
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ steps.digests.outputs.frontend }}
          fail-build: true
          severity-cutoff: ${{ inputs.scan-severity }}
          only-fixed: true
          output-format: table
      # Trivy pobiera bazę Java DB (blisko 1 GB spakowana) na dysk, który zapełniły już buildy, cache buildx i baza Grype:
      # release Azimuth 0.1.69 padł na "no space left on device". Cache buildx jest już wyeksportowany do gha, baza Grype
      # po jego bramkach niepotrzebna, a Android, .NET, GHC i CodeQL z obrazu runnera nie służą temu jobowi. Narzędzia
      # usuwa tylko na runnerze GitHuba; porażka prune zostawia ostrzeżenie, bo o miejscu i tak rozstrzyga Trivy.
      - name: Free the disk for the Trivy databases
        if: ${{ inputs.scan-images }}
        run: |
          # >>> trivy-disk
          set -euo pipefail
          df -h /
          docker buildx prune --all --force || echo "::warning::docker buildx prune failed; Trivy may run short of disk."
          rm -rf "$HOME/.cache/grype"
          if [ "${RUNNER_ENVIRONMENT:-}" = "github-hosted" ]; then
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          fi
          df -h /
          # <<< trivy-disk
      # Trivy obok Grype: ten sam próg, tylko podatności z poprawką, każdy obraz skanowany nawet po porażce poprzedniego.
      # Wersja przypięta, setup-trivy sprawdza sumę kontrolną wydania. Wyjątki: .trivyignore.yaml w korzeniu repo
      # (docs/security-scanning.md). Trivy biegnie tu, jak Grype, a nie w osobnym jobie: build-push i tak uruchamia kod
      # zależności z packages: write, a osobny job bramki musiałby zmienić warunek joba deploy.
      - name: Set up Trivy
        if: ${{ inputs.scan-images }}
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.2
      - name: Trivy scan — scanned images (gate)
        if: ${{ inputs.scan-images }}
        env:
          IMAGES: ${{ steps.digests.outputs.images }}
          SCAN_SEVERITY: ${{ inputs.scan-severity }}
        run: |
          # >>> trivy-scan
          set -uo pipefail
          case "$SCAN_SEVERITY" in
            critical) severity=CRITICAL ;;
            high) severity=HIGH,CRITICAL ;;
            medium) severity=MEDIUM,HIGH,CRITICAL ;;
            low) severity=LOW,MEDIUM,HIGH,CRITICAL ;;
            negligible) severity=UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL ;;
            *) echo "::error::scan-severity must be negligible, low, medium, high or critical, got '$SCAN_SEVERITY'."; exit 1 ;;
          esac
          ignore=()
          if [ -f .trivyignore.yaml ]; then ignore=(--ignorefile .trivyignore.yaml); fi
          failed=0
          for image in $IMAGES; do
            trivy image --image-src remote --scanners vuln --ignore-unfixed --exit-code 1 --severity "$severity" \
              ${ignore[@]+"${ignore[@]}"} "$image" || failed=1
          done
          exit "$failed"
          # <<< trivy-scan

  # ---- Snyk: druga opinia, nieblokująca, pomijana bez SNYK_TOKEN. Osobny job, bo obraz Snyka dostaje gniazdo
  #      Dockera hosta: tu może co najwyżej CZYTAĆ GHCR, a w build-push miałby packages: write tuż przed
  #      deployem. Deploy na ten job nie czeka.
  snyk-advisory:
    needs: [versions, build-push]
    if: ${{ inputs.scan-images }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_PREFIX: ghcr.io/${{ needs.versions.outputs.owner }}/${{ inputs.app-name }}
      BACKEND_VER: ${{ needs.versions.outputs.backend }}
      FRONTEND_VER: ${{ needs.versions.outputs.frontend }}
      SINGLE_IMAGE: ${{ inputs.single-image }}
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      # Obraz przypięty digestem, CLI wbudowany przy budowie (snyk/snyk-images 54dbb8b, stan 2026-10-18).
      # Lustro: container-scan.yml.
      SNYK_IMAGE: snyk/snyk:docker@sha256:d6595337edef7ce37eded247b8bb47ebb60681fd802c49e64c1b80b3a6963187
    steps:
      - name: Log in to GHCR
        if: ${{ env.SNYK_TOKEN != '' }}
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - name: Snyk scan (advisory)
        if: ${{ env.SNYK_TOKEN != '' }}
        run: |
          # >>> snyk-scan
          set -uo pipefail
          images=("$IMAGE_PREFIX-backend:$BACKEND_VER")
          [ "$SINGLE_IMAGE" = "true" ] || images+=("$IMAGE_PREFIX-frontend:$FRONTEND_VER")
          for image in "${images[@]}"; do
            docker pull "$image"
            docker run --rm -e SNYK_TOKEN -v /var/run/docker.sock:/var/run/docker.sock \
              "$SNYK_IMAGE" snyk container test "$image" --severity-threshold=high \
              || echo "::warning title=Snyk (advisory)::Snyk reported issues in $image"
          done
          # <<< snyk-scan

  # ---- Podpis cosign keyless po bramkach: needs build-push, więc obraz odrzucony przez Grype albo Trivy zostaje
  #      w GHCR bez podpisu, a Kyverno verifyImages go nie wpuści. Osobny job bez checkoutu i bez kodu repo: tylko on
  #      ma id-token: write, więc kod zależności z buildu nie dostaje tożsamości podpisu. Certyfikat Fulcio wskazuje
  #      ten workflow (Platform/.github/workflows/deploy.yml@<ref z uses:>) i repozytorium wywołującego; podpis idzie
  #      do GHCR jako referrer obrazu (cosign v3, Sigstore bundle), wpis do publicznego Rekora.
  sign:
    needs: [versions, build-push]
    if: ${{ inputs.scan-images }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      packages: write
    env:
      BACKEND_DIGEST: ${{ needs.build-push.outputs.backend-digest }}
      FRONTEND_DIGEST: ${{ needs.build-push.outputs.frontend-digest }}
      IMAGE_PREFIX: ghcr.io/${{ needs.versions.outputs.owner }}/${{ inputs.app-name }}
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Podpisuje tylko digesty skanowanych obrazów tej aplikacji, z referencjami złożonymi z jej prefiksu; każdy digest
      # sprawdza, zanim podpisze którykolwiek.
      - name: Sign the scanned images
        run: |
          # >>> sign-images
          set -euo pipefail
          if [ -z "${BACKEND_DIGEST:-}" ]; then
            echo "::error::build-push resolved no backend digest to sign."
            exit 1
          fi
          images=("$IMAGE_PREFIX-backend@$BACKEND_DIGEST")
          if [ -n "${FRONTEND_DIGEST:-}" ]; then images+=("$IMAGE_PREFIX-frontend@$FRONTEND_DIGEST"); fi
          for image in "${images[@]}"; do
            if [[ ! "${image#*@}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Refusing to sign '$image': its digest is not a sha256 digest."
              exit 1
            fi
          done
          for image in "${images[@]}"; do
            cosign sign --yes "$image"
          done
          # <<< sign-images

  # ---- Deploy on-box: SSH z PINOWANYM known_hosts; logika w Platform/scripts/deploy-remote.sh ----
  deploy:
    needs: [versions, build-push]
    # Rollback pomija build-push, więc deploy biegnie także po pominiętym buildzie, ale nie po porażce.
    # ssh-deploy: false (promote.yml) pomija deploy w całości.
    if: ${{ !cancelled() && inputs.ssh-deploy && needs.versions.result == 'success' && (needs.build-push.result == 'success' || needs.build-push.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.deploy-timeout-minutes }}
    permissions:
      contents: read
    environment: production # deployment branch policy `release` + sekrety SSH_* tylko tego environmentu
    env:
      OWNER: ${{ needs.versions.outputs.owner }}
    steps:
      # >>> ssh-secrets
      - name: Check the SSH secrets of the production environment
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          missing=()
          for v in SSH_HOST SSH_USER SSH_KEY SSH_KNOWN_HOSTS; do
            [ -n "${!v}" ] || missing+=("$v")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing secrets of the production environment: ${missing[*]}. Store them with templates/setup-gh-deploy.sh, which keeps SSH_* in that environment."
            exit 1
          fi
      # <<< ssh-secrets

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 — repo wołające: compose + Caddyfile
        with:
          persist-credentials: false

      # Platform jest publiczny: checkout bez tokenu, więc PAT konsumenta nie ląduje w _platform/.git/config
      # joba z dostępem SSH do produkcji. platform-ref = tag z `uses:`, żeby workflow i skrypt były z jednej wersji.
      - name: Pobierz deploy-remote.sh z Platform (jedno źródło prawdy, bez duplikatu w repo)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: DominikSienkiewicz/Platform
          ref: ${{ inputs.platform-ref }}
          path: _platform
          persist-credentials: false

      - name: Plik z tagami (.env.deploy) — aliasy *_TAG i *_VER (compose SSP używa TAG, BoS VER)
        run: |
          {
            echo "GHCR_OWNER=${{ env.OWNER }}"
            echo "BACKEND_TAG=${{ needs.versions.outputs.backend }}"
            echo "BACKEND_VER=${{ needs.versions.outputs.backend }}"
            echo "FRONTEND_TAG=${{ needs.versions.outputs.frontend }}"
            echo "FRONTEND_VER=${{ needs.versions.outputs.frontend }}"
            echo "WORKER_TAG=${{ needs.versions.outputs.worker }}"
            echo "MIGRATE_TAG=${{ needs.versions.outputs.migrate }}"
            echo "MIGRATE_VER=${{ needs.versions.outputs.migrate }}"
          } > .env.deploy

      # known_hosts przypięty przy bootstrapie; setup-gh-deploy.sh sprawdza go względem SSH_HOST_KEY_SHA256, gdy podano.
      - name: Konfiguracja SSH (known_hosts PINOWANE)
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Wgranie artefaktów na boks (DEPLOY_PATH)
        env:
          COMPOSE_DIR: ${{ inputs.compose-dir }}
          COMPOSE_FILE: ${{ inputs.compose-file }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          files=("$COMPOSE_DIR/$COMPOSE_FILE" .env.deploy _platform/scripts/deploy-remote.sh)
          # Caddyfile opcjonalny — aplikacje bez reverse-proxy (np. health-check wprost na backend) go nie mają.
          [ -f "$COMPOSE_DIR/Caddyfile" ] && files+=("$COMPOSE_DIR/Caddyfile")
          scp -i ~/.ssh/id_ed25519 "${files[@]}" "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      - name: Deploy (migracje -> backend -> frontend -> caddy, warunkowo + health-gate)
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          COMPOSE_FILE: ${{ inputs.compose-file }}
          BASE_ENV: ${{ inputs.base-env }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" \
            "cd '$DEPLOY_PATH' && COMPOSE_FILE='$COMPOSE_FILE' BASE_ENV='$BASE_ENV' bash deploy-remote.sh"
