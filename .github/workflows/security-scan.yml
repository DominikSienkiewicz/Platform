name: Security scan (reusable)

# Reusable skan CVE zależności: backend przez CycloneDX SBOM (generowany przez
# seniordev.quality-conventions) + Grype; frontend przez skan package-lock.json.
# Triggery (push/PR z filtrem paths, cron) deklaruje CALLER — tu mieszka wyłącznie logika.
# Tiering: CRITICAL/HIGH = fail, MODERATE/LOW = log-only.
# Wołany przez repo:
#   jobs: { scan: { uses: DominikSienkiewicz/Platform/.github/workflows/security-scan.yml@vX.Y.Z,
#                   secrets: { gpr_token: "${{ secrets.GPR_TOKEN }}" } } }
on:
  workflow_call:
    inputs:
      timeout-minutes:
        description: "Minutes before each job is cancelled; GitHub's default is 360. Raise it for a slower build."
        type: number
        default: 15
      working-directory:
        description: "Directory of the Gradle build, relative to the repository root."
        type: string
        default: backend
      java-version:
        description: "JDK that runs Gradle for the CycloneDX SBOM."
        type: string
        default: "27"
      severity-cutoff:
        description: "Grype fail threshold for the SBOM and the frontend lockfile: negligible, low, medium, high or critical."
        type: string
        default: high
      run-frontend:
        description: "Also scan frontend/package-lock.json. Use false for a backend without a frontend."
        type: boolean
        default: true
      only-if-deps-changed:
        description: "On push and pull_request, scan only when a changed path matches deps-pattern. Schedules and manual runs always scan."
        type: boolean
        default: false
      deps-pattern:
        description: "Extended regular expression matched against every changed path when only-if-deps-changed is on."
        type: string
        default: '^(backend/(build|settings)\.gradle\.kts|backend/(settings-)?gradle\.lockfile|backend/gradle/verification-metadata\.xml|backend/gradle/libs\.versions\.toml|frontend/package(-lock)?\.json|\.github/workflows/[^/]+\.ya?ml)$'
      only-fixed:
        description: "Fail only on vulnerabilities that have a fix. Accept a finding without a fix through .grype.yaml instead; see docs/security-scanning.md."
        type: boolean
        default: false
    secrets:
      gpr_token:
        description: "Classic PAT with read:packages for Platform's GitHub Packages. Without it the caller's automatic GITHUB_TOKEN is used, which needs packages: read and access to Platform's packages."
        required: false

permissions:
  contents: read

jobs:
  # Filtr „czy zmieniły się zależności” w jednym miejscu, zamiast kopii joba `changes` w każdym repo. Domyślnie
  # wyłączony (deps=true), więc caller bez nowych wejść skanuje zawsze, jak dotąd. Cron i dispatch skanują zawsze.
  changes:
    name: Did dependencies change
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      # fetch-depth 0 pobiera też gałąź bazową PR-a, więc filtr nie potrzebuje osobnego `git fetch` z tokenem.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: ${{ inputs.only-if-deps-changed && (github.event_name == 'push' || github.event_name == 'pull_request') }}
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect dependency manifest changes
        id: filter
        env:
          ONLY_IF_CHANGED: ${{ inputs.only-if-deps-changed }}
          DEPS_PATTERN: ${{ inputs.deps-pattern }}
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          # >>> deps-changed
          set -euo pipefail
          if [ "$ONLY_IF_CHANGED" != "true" ] || { [ "$EVENT" != "push" ] && [ "$EVENT" != "pull_request" ]; }; then
            echo "deps=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" = "pull_request" ]; then
            range="origin/$BASE_REF...HEAD"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            range="HEAD^...HEAD"
          else
            range="$BEFORE...HEAD"
          fi
          changed=$(git diff --name-only "$range")
          if grep -qE -- "$DEPS_PATTERN" <<<"$changed"; then deps=true; else deps=false; fi
          echo "Dependency manifests changed in $range: $deps"
          echo "deps=$deps" >> "$GITHUB_OUTPUT"
          # <<< deps-changed

  backend-sbom:
    name: Backend — CycloneDX SBOM + Grype
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.deps == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      # Wyjątki z .grype.yaml w roocie repo (Grype czyta go z katalogu roboczego akcji, obu skanów):
      # każdy wpis ma komentarz `# expires: YYYY-MM-DD; tracking: <URL>; reason: …` (docs/security-scanning.md).
      # Przeterminowany = fail, bez daty = ostrzeżenie. Blok testuje templates/tests/grype-exceptions.test.sh.
      - name: Check Grype exceptions
        working-directory: .
        run: |
          # >>> grype-exceptions
          set -euo pipefail
          config=.grype.yaml
          if [ ! -f "$config" ]; then
            echo "No $config: no accepted findings."
            exit 0
          fi
          awk -v today="$(date -u +%F)" -v config="$config" '
            /^[[:space:]]*#[[:space:]]*expires:/ {
              expires = $0
              sub(/^[[:space:]]*#[[:space:]]*expires:[[:space:]]*/, "", expires)
              expires = substr(expires, 1, 10)
              next
            }
            /^[[:space:]]*-[[:space:]]+(vulnerability|package|fix-state|namespace):/ {
              entry = $0
              sub(/^[[:space:]]*-[[:space:]]+/, "", entry)
              if (expires !~ /^[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]$/) {
                printf "::warning file=%s,line=%d::Grype exception \"%s\" has no # expires: YYYY-MM-DD comment; see docs/security-scanning.md\n", config, NR, entry
              } else if (expires < today) {
                printf "::error file=%s,line=%d::Grype exception \"%s\" expired on %s; fix the finding, or renew the entry with a new date and tracking link\n", config, NR, entry, expires
                expired++
              }
              expires = ""
            }
            END { exit expired > 0 }
          ' "$config"
          # <<< grype-exceptions

      # GITHUB_ACTOR + GITHUB_TOKEN włączają w settings.gradle.kts repo GitHub Packages.
      - name: Generate CycloneDX SBOM
        run: ./gradlew cyclonedxBom --no-daemon
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.gpr_token || secrets.GITHUB_TOKEN }}

      - name: Locate SBOM
        id: sbom
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |
          BOM=$(find build -type f \( -name 'bom*.json' -o -name '*.cdx.json' \) -print -quit)
          if [ -z "$BOM" ]; then
            echo "::error::CycloneDX SBOM not found under $WORKING_DIRECTORY/build — check the cyclonedxBom output path"
            exit 1
          fi
          echo "path=$WORKING_DIRECTORY/$BOM" >> "$GITHUB_OUTPUT"

      - name: Scan SBOM with Grype
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          sbom: ${{ steps.sbom.outputs.path }}
          fail-build: true
          severity-cutoff: ${{ inputs.severity-cutoff }}
          only-fixed: ${{ inputs.only-fixed }}
          output-format: table

      # Kod bramki (N-SHOW-8): scan-action drukuje własny raport, a adnotacja nazywa bramkę i kotwicę docs.
      - name: Name the failed SCA gate
        if: ${{ failure() }}
        run: echo "::error title=PLAT-SCA-001::[PLAT-SCA-001] Grype found vulnerabilities at or above the severity cutoff; see the table above and docs/gates.md#plat-sca-001."

  frontend-deps:
    name: Frontend — Grype (package-lock)
    needs: changes
    if: ${{ !cancelled() && inputs.run-frontend && needs.changes.outputs.deps == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Scan frontend dependencies with Grype
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          path: frontend
          fail-build: true
          severity-cutoff: ${{ inputs.severity-cutoff }}
          only-fixed: ${{ inputs.only-fixed }}
          output-format: table

      # Kod bramki (N-SHOW-8): scan-action drukuje własny raport, a adnotacja nazywa bramkę i kotwicę docs.
      - name: Name the failed SCA gate
        if: ${{ failure() }}
        run: echo "::error title=PLAT-SCA-001::[PLAT-SCA-001] Grype found vulnerabilities at or above the severity cutoff; see the table above and docs/gates.md#plat-sca-001."
