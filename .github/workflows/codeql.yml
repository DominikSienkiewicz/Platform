name: CodeQL

# CodeQL na samej Platform (repo publiczne, więc Code scanning jest dostępne). Uzupełnia Semgrep z self-scan.yml
# analizą przepływu danych, a workflow z github/codeql-action/analyze to jedyny SAST, który OpenSSF Scorecard
# rozpoznaje bez pull requestów — Semgrepa nie widzi wcale. java-kotlin w build-mode none analizuje Javę modułów
# i starterów bez budowania; Kotlin build-logic wymagałby autobuild, czyli pełnego buildu Gradle w każdym przebiegu.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL — ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, java-kotlin, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: "/language:${{ matrix.language }}"
