name: CodeQL

# CodeQL na samej Platform (repo publiczne, więc Code scanning jest dostępne). Uzupełnia Semgrep z self-scan.yml
# analizą przepływu danych, a workflow z github/codeql-action/analyze to jedyny SAST, który OpenSSF Scorecard
# rozpoznaje bez pull requestów — Semgrepa nie widzi wcale. java-kotlin w build-mode none analizuje Javę modułów
# i starterów bez budowania; Kotlin build-logic wymagałby autobuild, czyli pełnego buildu Gradle w każdym przebiegu.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL — ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, java-kotlin, python]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:${{ matrix.language }}"
