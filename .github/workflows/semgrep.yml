name: Semgrep SAST (reusable)

# Reusable SAST (Static Application Security Testing) — skanuje KOD ŹRÓDŁOWY (nie zależności;
# to robi security-scan.yml/Dependabot) pod kątem wzorców podatności: injection, path traversal,
# słabe krypto, hardkodowane sekrety, błędy authz. Uzupełnia warstwę SCA.
#
# Triggery (push/PR/cron) deklaruje CALLER — tu mieszka wyłącznie logika.
# Wołane przez repo:
#   jobs: { semgrep: { uses: DominikSienkiewicz/Platform/.github/workflows/semgrep.yml@vX.Y.Z } }
# Platform skanuje nim siebie w self-scan.yml (domyślny zestaw reguł, ten sam co u konsumentów).
#
# Repo PRYWATNE bez GitHub Advanced Security: zakładka „Code scanning" (upload SARIF) jest
# ZABLOKOWANA — dlatego wynik idzie jako tekst + fail-build (dokładnie jak Grype w security-scan.yml),
# NIE przez `github/codeql-action/upload-sarif`. Bramka: severity ERROR = fail, WARNING/INFO = log-only.
on:
  workflow_call:
    inputs:
      timeout-minutes:
        description: "Minutes before the job is cancelled; GitHub's default is 360. Raise it for a slower build."
        type: number
        default: 10
      config:
        description: "Semgrep rulesets, separated by spaces; each gets its own --config."
        type: string
        default: "p/default p/secrets p/java p/javascript p/typescript p/dockerfile p/github-actions"
      semgrep-version:
        description: "Pinned Semgrep CLI version, installed with pipx."
        type: string
        default: "1.168.0"

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep — SAST scan
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install Semgrep (pinned)
        env:
          SEMGREP_VERSION: ${{ inputs.semgrep-version }}
        run: pipx install "semgrep==${SEMGREP_VERSION}"

      # JEDEN przebieg skanera. Wcześniej kod był skanowany DWA razy (osobny krok ERROR, potem osobny
      # WARNING/INFO) — te same reguły na tym samym drzewie, podwójny compute na każdym runie. Teraz
      # skanujemy raz do JSON, a bramkę (ERROR = fail) i widok advisory (WARNING/INFO = log-only)
      # liczymy z tego samego wyniku. Semantyka bramki bez zmian: ERROR blokuje, reszta nie.
      - name: Semgrep — SAST (jeden skan, bramka ERROR)
        env:
          SEMGREP_CONFIGS: ${{ inputs.config }}
        run: |
          set -uo pipefail   # bez -e: sami sterujemy kodem wyjścia na podstawie JSON
          args=()
          for c in $SEMGREP_CONFIGS; do args+=(--config "$c"); done

          # Pojedynczy skan: wszystkie severity naraz -> JSON. rc=1 (są znaleziska) jest OK,
          # rc>=2 to realny błąd skanera (brak/niepełny JSON) -> przerywamy.
          semgrep scan "${args[@]}" --json --output semgrep.json --quiet
          rc=$?
          if [ ! -s semgrep.json ]; then
            echo "::error::Semgrep produced no result (rc=$rc), so the scan failed." >&2
            exit 1
          fi

          # Czytelny widok z tego samego wyniku (severity  ścieżka:linia  reguła).
          jq -r '.results[] | "\(.extra.severity)\t\(.path):\(.start.line)\t\(.check_id)"' \
            semgrep.json | sort || true

          err=$(jq  '[.results[] | select(.extra.severity=="ERROR")]   | length' semgrep.json)
          warn=$(jq '[.results[] | select(.extra.severity=="WARNING")] | length' semgrep.json)
          info=$(jq '[.results[] | select(.extra.severity=="INFO")]    | length' semgrep.json)
          echo "Semgrep: ${err} ERROR (blokujące), ${warn} WARNING, ${info} INFO (log-only)"

          if [ "${err:-0}" -gt 0 ]; then
            echo "::error::Semgrep: ${err} znalezisk severity ERROR — bramka SAST failuje build."
            exit 1
          fi
