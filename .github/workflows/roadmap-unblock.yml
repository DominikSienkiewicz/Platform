name: Roadmap auto-unblock (reusable)

# Reusable: po zamknięciu issue-prerekwizytu odpala skrypt repo wołającego, który przestawia
# zależne pozycje roadmapy blocked/backlog -> ready (gdy WSZYSTKIE ich prerekwizyty są zamknięte).
# Wołane z cienkiego callera z jawnym sekretem (nie `inherit` — job czyta tylko ten jeden):
#   uses: DominikSienkiewicz/Platform/.github/workflows/roadmap-unblock.yml@vX.Y.Z
#   secrets: { ROADMAP_PROJECT_TOKEN: ${{ secrets.ROADMAP_PROJECT_TOKEN }} }
#
# Logika i parser zostają w repo wołającym (scripts/roadmap-unblock.sh + scripts/lib/*) — są sprzężone
# z konfiguracją roadmapy danego repo (nazwa Projects v2, statusy, streamy). Tu owijamy tylko WARSTWĘ
# CI: trigger-guard, uprawnienia, fail-safe na brak tokenu i checkout. Kontrakt skryptu, który repo
# musi spełniać:  bash scripts/roadmap-unblock.sh --closed <issue-number>
#
# WYMAGANIA (repo user-owned!):
#   • secret ROADMAP_PROJECT_TOKEN — Projects v2 użytkownika: classic PAT ze scope `project` i `repo`.
#       `repo` daje zapis do KAŻDEGO prywatnego repo ownera, więc ustaw ważność <= 90 dni.
#       Domyślny GITHUB_TOKEN NIE zapisuje Projects v2; fine-grained PAT dla Projects v2 użytkownika
#       jest niezweryfikowany (może dać zielony no-op).
#   • var ROADMAP_PROJECT_NUMBER — numer tablicy Projects v2.
# Brak tokenu => krok kończy się ostrzeżeniem i nie robi nic (fail-safe).

on:
  workflow_call:
    inputs:
      timeout-minutes:
        description: "Minutes before the job is cancelled; GitHub's default is 360. Raise it for a slower build."
        type: number
        default: 5
    # Zmienna ROADMAP_PROJECT_NUMBER idzie z kontekstu `vars` callera.
    secrets:
      ROADMAP_PROJECT_TOKEN:
        description: "Classic PAT with the project and repo scopes, valid for 90 days at most. Without it the job warns and does nothing."
        required: false

permissions:
  contents: read

jobs:
  unblock:
    # Tylko issue z markerem roadmapy, zamknięte jako ukończone: „not planned” albo duplikat nie odblokowuje
    # zależnych. Kontekst eventu z callera.
    if: contains(github.event.issue.body, 'roadmap-id:') && github.event.issue.state_reason == 'completed'
    # PR z „Closes #A, closes #B” odpala kilka runów naraz; kolejka zamiast równoległych komentarzy audytu.
    concurrency:
      group: roadmap-unblock-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Auto-unblock dependents
        env:
          GH_TOKEN: ${{ secrets.ROADMAP_PROJECT_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ROADMAP_PROJECT_NUMBER: ${{ vars.ROADMAP_PROJECT_NUMBER }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning title=Auto-unblock pominięty::Brak sekretu ROADMAP_PROJECT_TOKEN (PAT scope project). Projects v2 dla repo user-owned wymaga PAT-a."
            exit 0
          fi
          bash scripts/roadmap-unblock.sh --closed "$ISSUE_NUMBER"
