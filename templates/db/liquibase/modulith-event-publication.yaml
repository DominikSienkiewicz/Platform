# CANON (Platform/templates/db/liquibase/modulith-event-publication.yaml).
# Tabela rejestru publikacji zdarzeń Spring Modulith dla spring-modulith-starter-jpa (tryb UPDATE i DELETE).
# spring-modulith-events-jpa nie dostarcza SQL-a, a bez tabeli rejestr po cichu nie zapisuje publikacji,
# więc gwarancja at-least-once nie działa. Schemat odpowiada encji JpaEventPublication wersji Modulith
# z katalogu Platform; AbstractSchemaValidationIT w test-fixtures waliduje go Hibernate'em na PostgreSQL.
# Kopiuj jako db/changelog/changes/NNNN-modulith-event-publication.yaml (następny wolny numer) i dodaj
# include do mastera. IF NOT EXISTS: repo, które założyło tabelę ręcznie, przyjmuje changeset bez błędu.
databaseChangeLog:
  - changeSet:
      id: modulith-event-publication
      author: platform
      comment: Spring Modulith event publication registry (JPA, completion mode UPDATE or DELETE).
      changes:
        - sql:
            dbms: postgresql
            splitStatements: true
            endDelimiter: ;
            sql: |
              CREATE TABLE IF NOT EXISTS event_publication
              (
                id                     UUID                     NOT NULL,
                listener_id            TEXT                     NOT NULL,
                event_type             TEXT                     NOT NULL,
                serialized_event       TEXT                     NOT NULL,
                publication_date       TIMESTAMP WITH TIME ZONE NOT NULL,
                completion_date        TIMESTAMP WITH TIME ZONE,
                status                 TEXT,
                completion_attempts    INTEGER                  NOT NULL DEFAULT 0,
                last_resubmission_date TIMESTAMP WITH TIME ZONE,
                PRIMARY KEY (id)
              );
              CREATE INDEX IF NOT EXISTS event_publication_serialized_event_hash_idx ON event_publication USING hash (serialized_event);
              CREATE INDEX IF NOT EXISTS event_publication_by_completion_date_idx ON event_publication (completion_date);
      rollback:
        - sql:
            sql: DROP TABLE IF EXISTS event_publication;
