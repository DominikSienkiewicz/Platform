name: Bug
description: Something does not work as documented.
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: The release, tag or commit you run.
      placeholder: 1.2.3
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, runtime and tool versions that matter for the problem.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      description: The command or action, the full message and the documented behaviour it contradicts.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps, or a link to a minimal example, that shows the problem.
    validations:
      required: true
