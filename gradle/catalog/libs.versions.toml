# platform-catalog — KANON wersji backendu (plain-plik, edytowalny + Renovate-friendly, symetryczny z FE versions.json).
# Ładowany przez gradle/catalog/build.gradle.kts: from(files("libs.versions.toml")).
# `platform` jest PLACEHOLDEREM — nadpisywanym injectem (platformVersion z gradle.properties/-P) w build.gradle.kts,
# bo statyczny TOML nie wyrazi dynamicznej wersji. Wpisy z version.ref="platform" biorą wstrzykniętą wartość.
# Placeholder NIE jest prawdziwym wydaniem: wcześniejsze "1.4.3" po cichu rozwiązywało stare test-fixtures.
# build-logic dołącza TEN plik przez swoje settings.gradle.kts, więc marker-artefakty pluginów biorą wersje
# stąd, a wersje narzucane przez źródła convention pluginów (toolchain, narzędzia jakości, BOM-y, nadpisania
# BOM-u) task :generatePlatformVersions wpisuje do PlatformVersions.kt — bump to jeden wpis tutaj, bez lustra
# w źródłach (L-2; tabela: docs/versions.md, "Versions the convention plugins impose"). Lustra spoza Kotlina
# zostają: toolchain-java-version workflowów (java) i wrappery Gradle (gradle).
# Po bumpie katalogu regeneruj też gradle.lockfile (--write-locks).

[versions]
platform = "0.0.0-injected-at-publish"   # PLACEHOLDER — nadpisywany injectem (platformVersion) w build.gradle.kts; celowo nierozwiązywalny, żeby zepsuty inject failował głośno
gradle = "9.8.1"                         # lustro: distributionUrl wrapperów gradle/*/gradle/wrapper i gradle-version w canon-cve-scan.yml; platform-bump podbija nim wrapper konsumenta
java = "27"                              # → PlatformVersions: toolchain w java-conventions. non-LTS; baseline portfolio (2026-09). JaCoCo 0.8.15: class-file 26/27 nieoficjalne
springBoot = "4.1.1"                     # → PlatformVersions: springBootVersion w spring-modulith-conventions (import BOM-u)
lombok = "1.18.48"                       # → platform-bom: constraint z because, importowany przez spring-modulith-conventions (nadpisuje BOM-owe 1.18.46, które pada na javac 27). Zdejmij, gdy BOM Boota >= 1.18.48
tomcat = "11.0.27"                       # → platform-bom: podłoga CVE (constraint z because) — CVE: Boot 4.1.1 ma 11.0.24 (3x Critical, poprawka 11.0.25). Zdejmij, gdy BOM Boota >= 11.0.25
jacksonBom = "3.1.8"                     # → platform-bom: import przed Bootem — CVE: Boot 4.1.1 ma 3.1.5 (High, poprawka 3.1.7). Zdejmij, gdy BOM Boota >= 3.1.7
jackson2Bom = "2.21.8"                   # → platform-bom: import przed Bootem — CVE: Boot 4.1.1 ma 2.21.5 (High, poprawka 2.21.7). Zdejmij, gdy BOM Boota >= 2.21.7
springDependencyManagement = "1.1.7"
springModulith = "2.1.1"                 # → PlatformVersions: springModulithVersion w spring-modulith-conventions (import BOM-u)
springAi = "2.0.1"                       # → PlatformVersions: springAiVersion w spring-modulith-conventions (import BOM-u)
junit = "6.1.3"                          # → PlatformVersions: enforcedPlatform junit-bom w spring-modulith-conventions i baseline JUnit w java-conventions
archunit = "1.5.0"                       # → PlatformVersions: archunitVersion w spring-modulith-conventions — też zarządzana na runtime (spring-modulith-core 2.1.1 ciągnie 1.4.2, które nie czyta class-file 71)
resilience4j = "2.4.0"
bucket4j = "8.19.0"
shedlock = "7.7.0"
javers = "7.11.7"
jooq = "3.21.7"                          # lustro jooq.version z BOM-u Boota: tylko dla pluginu generatora jooq-codegen (pluginów żaden BOM nie zarządza); bump wyłącznie razem z Bootem, rozjazd wywala PlatformBomImportFunctionalTest
spotless = "8.9.0"
ktlint = "1.8.0"                          # formater Kotlin w Spotless samego build-logic (D-14); konsumenci go nie dostają
googleJavaFormat = "1.36.1"              # → PlatformVersions: googleJavaFormat(...) w java-conventions. JDK 27 wymaga >= 1.35.0 (1.28: NoSuchFieldError endPositions, 1.34.1: błąd na `var`)
spotbugsPlugin = "6.5.9"                 # plugin Gradle; SAM SpotBugs to spotbugs
spotbugs = "4.10.3"                      # → PlatformVersions: toolVersion w quality-conventions (SAM SpotBugs, nie plugin Gradle)
checkstyle = "13.10.0"                   # → PlatformVersions: toolVersion w java-conventions (guard configów czyta stąd)
pitest = "1.19.0"                        # plugin Gradle info.solidsoft.pitest; SAM PIT to pitestTool
# testRetry >= 1.6.6: wcześniejsze mają ASM bez class-file 71 (JDK 27) i failują task testów z NullPointerException.
testRetry = "1.6.6"                      # plugin Gradle org.gradle.test-retry: java-conventions stosuje go tylko z -Pplatform.test.retry=detect (N-REL-13)
pitestTool = "1.30.0"                    # → PlatformVersions: pitestVersion w quality-conventions. Class-file 71 (JDK 27) wymaga >= 1.30.0 (1.25.3: ASM 9.9.1)
pitestJunit5 = "1.2.3"                   # → PlatformVersions: junit5PluginVersion w quality-conventions
cyclonedx = "3.5.1"
jackson2Tooling = "2.22.3"               # → build-logic: platform jackson-bom na classpath pluginów — CVE: CycloneDX 3.5.1 ciągnie Jacksona 2.22.2 (4x High, poprawka 2.22.3). Aplikacji konsumenta nie dotyczy (tam jackson2Bom). Zdejmij, gdy CycloneDX przyniesie Jacksona >= 2.22.3
jacoco = "0.8.15"                        # → PlatformVersions: toolVersion w java-conventions
foojayResolver = "1.0.0"
mapstruct = "1.6.3"
jsoup = "1.23.2"
picocli = "4.7.7"
wiremock = "3.13.2"
sonarqube = "7.5.0.8588"                 # marker pluginu na classpath build-logic; aplikowany w quality-conventions. >= 7.5: skaner 4.2.1 zacieniowany z bcprov 1.85.2 (CVE w 1.84)
openrewrite = "8.88.3"                   # Attestate (ADR-0005)
# seniordev.nullness-conventions (N-CAP-11, opt-in): Error Prone + NullAway w trybie JSpecify. Error Prone wpina się
# w wewnętrzne API javac, więc bump toolchainu sprawdza TestKit PlatformNullnessFunctionalTest.
errorprone = "2.50.0"                    # → PlatformVersions: error_prone_core w nullness-conventions
nullaway = "0.14.2"                      # → PlatformVersions: nullaway w nullness-conventions
errorpronePlugin = "5.1.1"               # plugin Gradle net.ltgt.errorprone na classpath build-logic
jspecify = "1.0.0"                       # adnotacje @NullMarked/@Nullable dla modułów spoza Springa (Spring 7 ma je tranzytywnie)

[libraries]
# --- BOM-y ---
spring-boot-bom = { group = "org.springframework.boot", name = "spring-boot-dependencies", version.ref = "springBoot" }
spring-ai-bom = { group = "org.springframework.ai", name = "spring-ai-bom", version.ref = "springAi" }
spring-modulith-bom = { group = "org.springframework.modulith", name = "spring-modulith-bom", version.ref = "springModulith" }
junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit" }

# --- Biblioteki (jawna wersja) ---
resilience4j-spring-boot4 = { group = "io.github.resilience4j", name = "resilience4j-spring-boot4", version.ref = "resilience4j" }
bucket4j-core = { group = "com.bucket4j", name = "bucket4j_jdk17-core", version.ref = "bucket4j" }
shedlock-spring = { group = "net.javacrumbs.shedlock", name = "shedlock-spring", version.ref = "shedlock" }
shedlock-provider-jdbc-template = { group = "net.javacrumbs.shedlock", name = "shedlock-provider-jdbc-template", version.ref = "shedlock" }
javers-spring-boot-starter-sql = { group = "org.javers", name = "javers-spring-boot-starter-sql", version.ref = "javers" }
archunit-junit5 = { group = "com.tngtech.archunit", name = "archunit-junit5", version.ref = "archunit" }
mapstruct = { group = "org.mapstruct", name = "mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { group = "org.mapstruct", name = "mapstruct-processor", version.ref = "mapstruct" }
jsoup = { group = "org.jsoup", name = "jsoup", version.ref = "jsoup" }
picocli = { group = "info.picocli", name = "picocli", version.ref = "picocli" }
wiremock-standalone = { group = "org.wiremock", name = "wiremock-standalone", version.ref = "wiremock" }
jspecify = { group = "org.jspecify", name = "jspecify", version.ref = "jspecify" }
errorprone-core = { group = "com.google.errorprone", name = "error_prone_core", version.ref = "errorprone" }
nullaway = { group = "com.uber.nullaway", name = "nullaway", version.ref = "nullaway" }
openrewrite-bom = { group = "org.openrewrite", name = "rewrite-bom", version.ref = "openrewrite" }

# --- Artefakty platformy (pin = dynamiczny `platform`) ---
platform-bom = { group = "pl.seniordeveloper", name = "platform-bom", version.ref = "platform" }
platform-test-fixtures = { group = "pl.seniordeveloper", name = "platform-test-fixtures", version.ref = "platform" }
platform-security-starter = { group = "pl.seniordeveloper", name = "platform-security-starter", version.ref = "platform" }
platform-observability-starter = { group = "pl.seniordeveloper", name = "platform-observability-starter", version.ref = "platform" }
platform-web-starter = { group = "pl.seniordeveloper", name = "platform-web-starter", version.ref = "platform" }

# --- Startery Spring Boot / Modulith (BOM-managed → BEZ wersji; spina je bundle poniżej) ---
boot-starter-actuator = { group = "org.springframework.boot", name = "spring-boot-starter-actuator" }
boot-starter-data-jpa = { group = "org.springframework.boot", name = "spring-boot-starter-data-jpa" }
boot-starter-jdbc = { group = "org.springframework.boot", name = "spring-boot-starter-jdbc" }
boot-starter-liquibase = { group = "org.springframework.boot", name = "spring-boot-starter-liquibase" }
boot-starter-validation = { group = "org.springframework.boot", name = "spring-boot-starter-validation" }
boot-starter-webmvc = { group = "org.springframework.boot", name = "spring-boot-starter-webmvc" }
modulith-starter-core = { group = "org.springframework.modulith", name = "spring-modulith-starter-core" }
modulith-starter-jpa = { group = "org.springframework.modulith", name = "spring-modulith-starter-jpa" }
modulith-actuator = { group = "org.springframework.modulith", name = "spring-modulith-actuator" }
modulith-observability = { group = "org.springframework.modulith", name = "spring-modulith-observability" }
boot-docker-compose = { group = "org.springframework.boot", name = "spring-boot-docker-compose" }
spring-ai-docker-compose = { group = "org.springframework.ai", name = "spring-ai-spring-boot-docker-compose" }
boot-test-actuator = { group = "org.springframework.boot", name = "spring-boot-starter-actuator-test" }
boot-test-data-jpa = { group = "org.springframework.boot", name = "spring-boot-starter-data-jpa-test" }
boot-test-jdbc = { group = "org.springframework.boot", name = "spring-boot-starter-jdbc-test" }
boot-test-liquibase = { group = "org.springframework.boot", name = "spring-boot-starter-liquibase-test" }
boot-test-validation = { group = "org.springframework.boot", name = "spring-boot-starter-validation-test" }
boot-test-webmvc = { group = "org.springframework.boot", name = "spring-boot-starter-webmvc-test" }

# --- Biblioteki zarządzane BOM-ami (BEZ wersji): moduły bez Springa biorą wersję z platform(libs.platform.bom) ---
postgresql = { group = "org.postgresql", name = "postgresql" }
jackson-databind = { group = "tools.jackson.core", name = "jackson-databind" }
jackson-dataformat-yaml = { group = "tools.jackson.dataformat", name = "jackson-dataformat-yaml" }

[bundles]
# Kręgosłup web+modulith i slice'y testowe — powielane inline w repo konsumentów. Wersje z BOM-ów.
modulith-web = ["boot-starter-actuator", "boot-starter-data-jpa", "boot-starter-validation", "boot-starter-webmvc", "modulith-starter-core", "modulith-starter-jpa"]
modulith-web-tests = ["boot-test-actuator", "boot-test-data-jpa", "boot-test-validation", "boot-test-webmvc"]
dev-docker-compose = ["boot-docker-compose", "spring-ai-docker-compose"]
# Modulith przy platform-observability-starter: endpoint modułów i obserwacje między modułami (BOM Modulith).
observability-modulith = ["modulith-actuator", "modulith-observability"]

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
pitest = { id = "info.solidsoft.pitest", version.ref = "pitest" }
test-retry = { id = "org.gradle.test-retry", version.ref = "testRetry" }
cyclonedx = { id = "org.cyclonedx.bom", version.ref = "cyclonedx" }
sonarqube = { id = "org.sonarqube", version.ref = "sonarqube" }
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorpronePlugin" }
# Generator jOOQ konsumenta (DDLDatabase z migracji Flyway); runtime jOOQ i jooq-meta-extensions bez wersji, z BOM-u Boota.
jooq-codegen = { id = "org.jooq.jooq-codegen-gradle", version.ref = "jooq" }
# Convention pluginy publikowane z gradle/build-logic (id = nazwa pliku *.gradle.kts). Pin = dynamiczny `platform`.
conventions-java = { id = "seniordev.java-conventions", version.ref = "platform" }
conventions-quality = { id = "seniordev.quality-conventions", version.ref = "platform" }
conventions-spring-modulith = { id = "seniordev.spring-modulith-conventions", version.ref = "platform" }
conventions-settings = { id = "seniordev.settings-conventions", version.ref = "platform" }
conventions-sonar = { id = "seniordev.sonar-conventions", version.ref = "platform" }
conventions-nullness = { id = "seniordev.nullness-conventions", version.ref = "platform" }
