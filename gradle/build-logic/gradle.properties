# Wersja platformy (= wersja publikowanych convention pluginów). Musi zgadzać się z
# `version("platform", ...)` w gradle/catalog/build.gradle.kts.
platformVersion=1.8.6

# Cel publikacji — GitHub Packages. Nadpisywalne przez -Pgpr.owner / -Pgpr.repo lub env GPR_OWNER/GPR_REPO.
# UWAGA: dla GitHub Packages npm scope (@owner) MUSI równać się właścicielowi repo GitHub (lowercase).
gpr.owner=DominikSienkiewicz
gpr.repo=Platform

# Najstarszy Gradle konsumenta, na którym TestKit sprawdza convention pluginy (PlatformMinimumGradleFunctionalTest).
# To wersja narzędzia uruchomieniowego, nie biblioteki, więc żyje tu, nie w katalogu. Lustro: GradleVersion.version(…)
# w seniordev.settings-conventions; podniesienie = akcja konsumenta (MINOR, CHANGELOG).
minimumConsumerGradle=9.8.1

org.gradle.caching=true
org.gradle.parallel=true
