# Aplikacja biegnie na hoście (./gradlew bootRun), więc Prometheus w kontenerze scrapuje host.docker.internal.
# /actuator/prometheus wystawia observability-starter z platform.observability.prometheus=true; inny port aplikacji
# niż 8080 = edycja celu niżej (Prometheus nie rozwija zmiennych środowiskowych w scrape_configs).
global:
  scrape_interval: 15s
scrape_configs:
  - job_name: application
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]
