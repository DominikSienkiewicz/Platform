name: platform-infra

# Szablon środowiska dev współdzielony przez repo konsumentów (scripts/consumers.txt).
# PostgreSQL+pgvector zawsze; Ollama tylko z profilem "ai" (local-first, np. Attestate); metryki i ślady
# aplikacji uruchomionej na hoście tylko z profilem "observability" (stos z Azimuth/observability, N-CAP-4):
#   docker compose up -d                            # samo PG
#   docker compose --profile ai up -d               # PG + Ollama
#   docker compose --profile observability up -d    # PG + otel-collector, Tempo, Prometheus, Grafana

services:
  postgres:
    # PG patch = najnowszy 18.x w tym buildzie; pgvector przypięty do 0.8.2.
    image: pgvector/pgvector:0.8.2-pg18
    container_name: ${COMPOSE_PROJECT_NAME:-platform}-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Obrazy pg18+ trzymają dane w /var/lib/postgresql/<major>/docker (PGDATA) — montujemy rodzica.
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.32.3
    container_name: ${COMPOSE_PROJECT_NAME:-platform}-ollama
    profiles: ["ai"]
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama --version || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector:0.130.1
    container_name: ${COMPOSE_PROJECT_NAME:-platform}-otel-collector
    profiles: ["observability"]
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "${OTLP_HTTP_PORT:-4318}:4318"
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.8.1
    container_name: ${COMPOSE_PROJECT_NAME:-platform}-tempo
    profiles: ["observability"]
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: ${COMPOSE_PROJECT_NAME:-platform}-prometheus
    profiles: ["observability"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    container_name: ${COMPOSE_PROJECT_NAME:-platform}-grafana
    profiles: ["observability"]
    # Tylko lokalnie: anonimowy administrator bez logowania, źródła danych Prometheus i Tempo z provisioningu.
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./observability/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    depends_on: [prometheus, tempo]
    restart: unless-stopped

volumes:
  postgres-data:
  ollama-data:
  tempo-data:
  prometheus-data:
